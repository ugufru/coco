<!doctype html>
<html lang="en">
<head>

<title>CoCo Renovation issues</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #fbfaf7; --panel: #fff; --ink: #1b1a17; --dim: #6b6862; --line: #e3ded4;
  --accent: #8a4b2a; --accent-ink: #fff;
  --open: #b4541f; --inprog: #8a6d1f; --done: #3f6b3a; --defer: #4a5a75; --wont: #6b6862;
  --high: #a8322a; --med: #8a6d1f; --low: #6b6862;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16151a; --panel: #1e1d23; --ink: #ece8e1; --dim: #9b968d; --line: #32303a;
    --accent: #d98a5a; --accent-ink: #16151a;
    --open: #e08b52; --inprog: #d4b95e; --done: #8fc182; --defer: #93aad6; --wont: #9b968d;
    --high: #e5776c; --med: #d4b95e; --low: #9b968d;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
}
.wrap { max-width: 60rem; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
h1 { font-size: 1.5rem; margin: 0 0 .2rem; letter-spacing: -.01em; }
h2 { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em;
  color: var(--dim); margin: 0 0 .6rem; }
.lede { color: var(--dim); margin: 0 0 1.5rem; font-size: .9rem; }
.note { font-size: .8rem; color: var(--dim); background: var(--panel);
  border: 1px solid var(--line); border-left: 3px solid var(--med);
  border-radius: 6px; padding: .5rem .7rem; margin: 0 0 1.25rem; }
.roadmap { margin: 0 0 1.75rem; }
.plan { list-style: none; margin: 0; padding: 0; counter-reset: step; }
.step { display: flex; gap: .7rem; padding: .55rem .7rem; border: 1px solid var(--line);
  border-radius: 8px; background: var(--panel); margin-bottom: .35rem; }
.step .rank { font-variant-numeric: tabular-nums; color: var(--dim); font-size: .85rem; }
.step .what { flex: 1; }
.step a { color: inherit; font-weight: 550; text-decoration: none; }
.step a:hover { text-decoration: underline; text-decoration-color: var(--accent); }
.step .why { display: block; color: var(--dim); font-size: .84rem; margin-top: .15rem; }
.step.bad { border-color: var(--high); }
.step .warn { color: var(--high); font-size: .78rem; }
.controls {
  position: sticky; top: 0; z-index: 5; background: var(--bg);
  padding: .75rem 0; border-bottom: 1px solid var(--line); margin-bottom: 1.25rem;
}
#q {
  width: 100%; padding: .6rem .75rem; font: inherit; color: var(--ink);
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
}
#q:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.chip.th { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--fg); }
.morebtn { font-size: .72rem; background: none; color: var(--dim); cursor: pointer;
  border: 1px dashed var(--line); border-radius: 999px; padding: .2rem .55rem; }
.morebtn:hover { color: var(--fg); }
.pills { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .6rem; align-items: center; }
.pills .label { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em;
  color: var(--dim); margin-right: .15rem; }
.pill {
  font: inherit; font-size: .8rem; padding: .2rem .6rem; cursor: pointer;
  background: var(--panel); color: var(--ink);
  border: 1px solid var(--line); border-radius: 999px;
}
.pill:hover { border-color: var(--accent); }
.pill[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.pill .n { opacity: .6; font-variant-numeric: tabular-nums; }
.bar { display: flex; gap: .75rem; align-items: center; margin-top: .6rem;
  font-size: .8rem; color: var(--dim); }
.bar button { font: inherit; background: none; border: 0; color: var(--accent);
  cursor: pointer; padding: 0; text-decoration: underline; }
#count { margin-right: auto; font-variant-numeric: tabular-nums; }
.card { background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; margin-bottom: .5rem; overflow: hidden; }
.card:target { outline: 2px solid var(--accent); }
.row {
  width: 100%; display: flex; gap: .7rem; align-items: baseline; text-align: left;
  font: inherit; color: inherit; background: none; border: 0;
  padding: .7rem .9rem; cursor: pointer;
}
.row:hover { background: color-mix(in srgb, var(--accent) 7%, transparent); }
.id { color: var(--dim); font-variant-numeric: tabular-nums; font-size: .85rem; min-width: 2.2rem; }
.summary { flex: 1; font-weight: 550; }
.chips { display: flex; gap: .3rem; flex-wrap: wrap; }
.chip { font-size: .7rem; text-transform: uppercase; letter-spacing: .04em;
  padding: .1rem .45rem; border-radius: 4px; border: 1px solid currentColor; white-space: nowrap; }
.st-open { color: var(--open); } .st-in-progress { color: var(--inprog); }
.st-done { color: var(--done); } .st-deferred { color: var(--defer); }
.st-wontfix { color: var(--wont); }
.pr-high { color: var(--high); } .pr-medium { color: var(--med); } .pr-low { color: var(--low); }
.ty { color: var(--dim); }
.caret { width: .55rem; height: .55rem; border-right: 2px solid var(--dim);
  border-bottom: 2px solid var(--dim); transform: rotate(45deg); transition: transform .15s; }
.row[aria-expanded="true"] .caret { transform: rotate(-135deg); }
.body { padding: 0 .9rem .9rem; border-top: 1px solid var(--line); }
.desc { max-width: 62ch; }
.desc p { margin: .8rem 0; }
code { font: .87em ui-monospace, SFMono-Regular, Menlo, monospace;
  background: color-mix(in srgb, var(--ink) 7%, transparent);
  padding: .05em .3em; border-radius: 3px; }
footer { display: flex; gap: .4rem; flex-wrap: wrap; align-items: center;
  margin-top: .9rem; padding-top: .7rem; border-top: 1px dashed var(--line); }
.tag { font-size: .72rem; color: var(--dim); border: 1px solid var(--line);
  border-radius: 999px; padding: .05rem .45rem; }
.meta { margin-left: auto; font-size: .75rem; color: var(--dim); }
.empty { color: var(--dim); padding: 2rem 0; text-align: center; }
@media (max-width: 40rem) {
  .row { flex-wrap: wrap; } .summary { flex-basis: 100%; order: 2; }
  .chips { order: 3; } .meta { margin-left: 0; }
}
</style>

<script id="snapshot" type="application/json">{"issues": [{"id": 1, "summary": "README.md needs full rewrite", "description": "README.md is significantly out of date. Says six tutorial chapters complete (there are 13), roadmap tables show kernel primitives and fc.py features as not-started when most are done, references getting-started/ directory which is actually docs/, and the status section doesn't reflect current project state.", "type": "docs", "status": "done", "priority": "high", "file": "README.md", "created": "2026-03-04", "updated": "2026-03-04"}, {"id": 2, "summary": "forth/kernel/README.md primitives table incomplete", "description": "The primitives table stops at the early set (DUP, DROP, SWAP, OVER, +, -, @, !, EMIT, CR, HALT). Missing all primitives added for chapters 6-12: DO, LOOP, I, *, /MOD, KEY, 0BRANCH, BRANCH, =, <>, <, >, 0=, AT. Memory layout also shows an old START address.", "type": "docs", "status": "done", "priority": "medium", "file": "forth/kernel/README.md", "created": "2026-03-04", "updated": "2026-03-04"}, {"id": 3, "summary": "forth/tools/README.md shows completed features as not-yet", "description": "The 'What fc.py does not do' table still lists IF/THEN/LOOP as not yet implemented — they are done. The compilation pipeline description omits DO/LOOP, IF/ELSE/THEN, BEGIN/AGAIN/UNTIL. Uses CLOADM which should be LOADM.", "type": "docs", "status": "done", "priority": "medium", "file": "forth/tools/README.md", "created": "2026-03-04", "updated": "2026-03-04"}, {"id": 4, "summary": "Bare Naked kernel: replace POLCAT with direct PIA0 keyboard scan", "description": "CODE_KEY (line 350 of forth/kernel/kernel.asm) is the kernel's only ROM dependency, calling JSR [$A000] (POLCAT via Extended Color BASIC ROM). Replacing this with direct PIA0 access makes the kernel fully ROM-independent and ready for cartridge delivery without BASIC loaded. Work includes: (1) new KBD-SCAN primitive writing col_mask to PIA0-B ($FF02) and reading PIA0-A ($FF00); (2) rewritten CODE_KEY with register-based debounce and MATRIX2ASCII lookup table; (3) AND and OR primitives; (4) KEY-HELD? Forth word; (5) optional KEY? non-blocking variant. Also requires fc.py word table updates for kbd-scan, and, or.", "type": "enhancement", "status": "done", "priority": "high", "file": "forth/kernel/kernel.asm", "created": "2026-03-06", "updated": "2026-03-09"}, {"id": 5, "summary": "AND / OR bitwise primitives", "description": "Add CODE_AND ( n1 n2 -- n ) and CODE_OR ( n1 n2 -- n ) to kernel.asm (CFA table entries + implementations). Add 'and' and 'or' to fc.py kernel_words dict. These are needed by KEY-HELD? and general bitwise application code.", "type": "enhancement", "status": "done", "priority": "high", "file": "forth/kernel/kernel.asm", "created": "2026-03-06", "updated": "2026-03-06"}, {"id": 6, "summary": "PIA0-A direction register init in START", "description": "Add bare-metal PIA0 initialisation to the START routine in kernel.asm: write to PIA0-A control register ($FF01) to set port A as input and enable the data register, and write to PIA0-B control register ($FF03) to set port B as output. BASIC does this at boot; a bare-metal cartridge must do it explicitly. Prerequisite for KBD-SCAN and the new CODE_KEY.", "type": "enhancement", "status": "done", "priority": "high", "file": "forth/kernel/kernel.asm", "created": "2026-03-06", "updated": "2026-03-06"}, {"id": 7, "summary": "KBD-SCAN primitive ( col_mask -- row_bits )", "description": "Add CODE_KBD_SCAN to kernel.asm: write col_mask to PIA0-B ($FF02), read PIA0-A ($FF00), invert, mask bit 7 (joystick comparator), push result. Passing $00 strobes all columns simultaneously for a fast any-key check. Add 'kbd-scan' to fc.py kernel_words. Depends on issue 6 (PIA0 init).", "type": "enhancement", "status": "done", "priority": "high", "file": "forth/kernel/kernel.asm", "created": "2026-03-06", "updated": "2026-03-06"}, {"id": 8, "summary": "MATRIX2ASCII table + CODE_KEY rewrite", "description": "Replace CODE_KEY's JSR [$A000] / POLCAT call with a direct PIA0 scan loop. Includes: (1) register-based two-poll debounce (no RAM needed); (2) MATRIX2ASCII BSR subroutine with a 56-entry lookup table (7 cols x 8 rows) mapping matrix position to ASCII; (3) conditional assembly (IFDEF COCO3) for CoCo 3 variant table covering F1/F2/ALT. Eliminates the last ROM dependency. Depends on issues 6 and 7.", "type": "enhancement", "status": "done", "priority": "high", "file": "forth/kernel/kernel.asm", "created": "2026-03-06", "updated": "2026-03-06"}, {"id": 9, "summary": "Add INCLUDE directive to fc.py", "description": "Implement INCLUDE <filename> as a compile-time host directive in fc.py. When the tokeniser encounters INCLUDE, it reads the named file (relative to the source file's directory) and splices its tokens into the stream before continuing. Enables a lib/ directory of shared Forth source. Standard ANS Forth FILE word set behaviour, implemented as a cross-compiler host operation.", "type": "enhancement", "status": "done", "priority": "medium", "file": "forth/tools/fc.py", "created": "2026-03-06", "updated": "2026-03-06"}, {"id": 10, "summary": "KEY-HELD? word and KB-Cx constants in lib/keyboard.fs", "description": "Create forth/lib/keyboard.fs containing: column mask constants (KB-C0 through KB-C6) as Forth CONSTANT definitions, and KEY-HELD? ( col_mask row_bit -- flag ) defined in pure Forth as: SWAP KBD-SCAN AND. Depends on issues 5 (AND), 7 (KBD-SCAN), and 9 (INCLUDE). Applications include it with: INCLUDE lib/keyboard.fs", "type": "enhancement", "status": "done", "priority": "medium", "file": "forth/lib/keyboard.fs", "created": "2026-03-06", "updated": "2026-03-06"}, {"id": 11, "summary": "KEY? non-blocking variant ( -- char|0 )", "description": "Add CODE_KEY_NB to kernel.asm: same PIA0 scan as CODE_KEY but returns 0 immediately if no key is pressed rather than spinning. Useful for game loops, timeouts, and polling. Add 'key?' to fc.py kernel_words. Depends on issue 8 (MATRIX2ASCII table, which KEY? will share via BSR).", "type": "enhancement", "status": "done", "priority": "low", "file": "forth/kernel/kernel.asm", "created": "2026-03-06", "updated": "2026-03-06"}, {"id": 12, "summary": "Typewriter test app in src/typewriter", "description": "Create src/typewriter/typewriter.fs: a simple app that calls KEY in a loop and EMITs each character to the screen. Tests the new PIA0-based KEY implementation end-to-end. ENTER advances to the next row (CR), CLEAR resets cursor to top-left. Includes cursor display, arrow key movement, backspace, SHIFT support, and VSYNC-based auto-repeat.", "type": "test", "status": "done", "priority": "high", "file": "src/typewriter/typewriter.fs", "created": "2026-03-06", "updated": "2026-03-09"}, {"id": 13, "summary": "Demo: Snake game", "description": "Classic snake game using VDG semigraphics-4 color blocks. Arrow keys control direction, snake grows when eating food, game over on wall/self collision. Exercises keyboard input, game loop timing (VSYNC), screen drawing, and game state management.", "type": "demo", "status": "icebox", "priority": "low", "file": "src/snake/snake.fs", "created": "2026-03-09", "updated": "2026-06-16"}, {"id": 14, "summary": "Demo: Drawing program", "description": "Arrow keys move a brush cursor, number keys select colors. Uses VDG semigraphics modes for a 64x32 color pixel canvas. Demonstrates semigraphics block characters, color selection, and interactive screen painting.", "type": "demo", "status": "icebox", "priority": "low", "file": "src/draw/draw.fs", "created": "2026-03-09", "updated": "2026-06-16"}, {"id": 15, "summary": "Demo: Sound/music player", "description": "Explore the CoCo's 6-bit DAC on PIA1. Simple tone generator or melody player. Could play a sequence of notes or allow interactive keyboard-to-tone mapping (piano). Opens up PIA1 hardware access. DONE 2026-05-05: src/sound/sound.fs is the interactive tone demo — banner + KEY dispatch on 1..5 producing distinct (pitch, duration) combinations and a descending sweep. Uses forth/lib/sound.fs. Does not yet implement a musical-note language (see #37 PLAY) or piano-keyboard mapping (see #42).", "type": "demo", "status": "done", "priority": "low", "file": "src/sound/sound.fs", "created": "2026-03-09", "updated": "2026-05-05"}, {"id": 16, "summary": "Demo: Conway's Game of Life", "description": "Cellular automaton on the VDG semigraphics grid. Visually satisfying and a good stress test for Forth performance on the 6809. Could use semigraphics-4 for color or text mode for simplicity.", "type": "demo", "status": "icebox", "priority": "low", "file": "src/life/life.fs", "created": "2026-03-09", "updated": "2026-06-16"}, {"id": 17, "summary": "Demo: Starfield", "description": "Stars flying toward the viewer, simulating depth with different speeds. Pure VDG semigraphics, no math library needed. VSYNC-timed animation loop.", "type": "demo", "status": "icebox", "priority": "low", "file": "src/starfield/starfield.fs", "created": "2026-03-09", "updated": "2026-06-16"}, {"id": 18, "summary": "Demo: Clock / stopwatch", "description": "Big digit display using block characters, ticks off the VSYNC 60Hz counter. Could include a stopwatch mode with start/stop/reset. Demonstrates timed display updates and large character rendering.", "type": "demo", "status": "icebox", "priority": "low", "file": "src/clock/clock.fs", "created": "2026-03-09", "updated": "2026-06-16"}, {"id": 19, "summary": "Demo: Maze generator and navigator", "description": "Random recursive backtracker draws maze walls in real time using semigraphics, then lets the player navigate with arrow keys. Requires a random number generator (could seed from VSYNC timing or keyboard).", "type": "demo", "status": "icebox", "priority": "low", "file": "src/maze/maze.fs", "created": "2026-03-09", "updated": "2026-06-16"}, {"id": 20, "summary": "Demo: Text adventure", "description": "Navigate between rooms with N/S/E/W commands. Room descriptions, items to pick up, simple puzzles. Pushes the Forth toolchain into string handling, data tables for room connections, and state tracking. A CoCo classic. NOTE 2026-05-06: would be a strong use case for DATA[PY] (#479) — room layouts, exit tables, item/verb tables, and tokenized text strings can all be authored in Python and spliced into the binary at compile time, avoiding hand-rolled byte arrays.", "type": "demo", "status": "icebox", "priority": "low", "file": "src/adventure/adventure.fs", "created": "2026-03-09", "updated": "2026-06-16"}, {"id": 21, "summary": "Demo: Sprite animation", "description": "Walking character or bouncing ball using VDG semigraphics. Explores smooth movement, erase-draw cycles, and VSYNC-timed animation on the CoCo's character-mapped display.", "type": "demo", "status": "icebox", "priority": "low", "file": "src/sprite/sprite.fs", "created": "2026-03-09", "updated": "2026-06-16"}, {"id": 22, "summary": "Tool: Memory monitor / hex editor", "description": "Hex dump display, live memory editor, peek/poke any address. Arrow keys navigate, hex input to modify bytes. Actually useful as a development tool for inspecting kernel state, variables, and screen RAM.", "type": "tool", "status": "open", "priority": "low", "file": "src/monitor/monitor.fs", "created": "2026-03-09", "updated": "2026-06-16"}, {"id": 23, "summary": "Demo: Reaction time game", "description": "Wait for a random delay, flash the screen, measure how fast the player hits a key. Uses VSYNC frame counter for timing. Simple but fun, and demonstrates precise timing measurement.", "type": "demo", "status": "icebox", "priority": "low", "file": "src/reaction/reaction.fs", "created": "2026-03-09", "updated": "2026-06-16"}, {"id": 24, "summary": "Demo: Claude Code terminal over the Becker port (T1 lowercase)", "description": "Original idea (2026-03-09): dumb serial terminal via PIA1 bit-banger or cart UART. Design session 2026-09-14 (Claude Code planning, CoCo terminal to Claude Code). Re-scoped: desktop XRoar has no emulated bit-banger or working ACIA, so the transport is the Becker port (#556), and the far end is a Mac bridge to headless Claude Code (#557). Screen uses T1 true lowercase (#554) with scrolling (#555). WORK: src/terminal/terminal.fs plus Makefile via make/demo.mk. Startup: 1 LOWER, clear, banner (e.g. \"cocoterm / claude code\"), prompt \"> \". Main loop: KEY? -> local echo into a line buffer with BS, ENTER sends line+CR via BK!; BK? -> BK@ EMIT. Blinking $20 block cursor timed on VSYNC (idea from src/typewriter/typewriter.fs:32-110). Lowercase input: SHIFT+letter via SHIFT_APPLY (kernel.asm ~960) or a caps-lock toggle. BREAK sends $03 to cancel a Claude turn. Run: xroar -machine coco2bus -cart becker (plus run.sh ROM flags). TEST: start bridge, ask \"what files are in this directory?\", reply streams in wrapped at 32 columns with lowercase and no garbage; BREAK cancels a long reply. Depends on #554 #555 #556 #557 #560. Transport: -cart rsdos -cart-becker (hdbdw3bck.rom not installed). Keys: key? with edge detection (KEY blocks); letters sent lowercase unless SHIFT (kvar-key-shift); LEFT $1E sent as $08; bridge owns echo and line editing. Follow-ups: #561 console into kernel, #562 key repeat/rollover. Follow-ups: #558 escapes, #559 CoCo 3. Real hardware (Waveshare RP2350-PiZero) needs firmware work in that repo: render_alpha_frame ignores T1 EXT/GM0 and there is no Becker device; not filed here (outside repo boundary). Closed 2026-09-14: user confirmed working in live XRoar sessions (coco2bus T1, Becker bridge, peek/poke drawing, recorded as the \"Darth Vaper\" video).", "type": "demo", "status": "done", "priority": "medium", "file": "src/terminal/terminal.fs", "created": "2026-03-09", "updated": "2026-09-14"}, {"id": 25, "summary": "Tool: 6809 disassembler", "description": "Disassemble memory regions into 6809 mnemonics. Takes a start address and length, displays address, hex bytes, and decoded instruction. Must handle variable-length instructions (1-5 bytes), $10/$11 prefix pages, and indexed addressing postbyte decoding. Big but highly useful for inspecting compiled Forth output and kernel code on-device.", "type": "tool", "status": "open", "priority": "medium", "file": "src/disasm/disasm.fs", "created": "2026-03-09", "updated": "2026-03-09"}, {"id": 26, "summary": "Tool: Stack viewer", "description": "Display data stack and return stack contents on screen. Show stack depth and values in hex. Small enough to be a library word — no kernel changes needed. Immediately useful for debugging any Forth program. Could be invoked with a word like .S (print stack).", "type": "tool", "status": "open", "priority": "medium", "file": "forth/lib/stackview.fs", "created": "2026-03-09", "updated": "2026-06-16"}, {"id": 27, "summary": "Tool: Word lister", "description": "Show all compiled words with their CFA addresses. Helps verify that fc.py produced what you expected. Could display kernel primitives and app-defined words with their entry points. Requires fc.py to emit a word table or symbol list into the binary.", "type": "tool", "status": "open", "priority": "medium", "file": "src/tools/words.fs", "created": "2026-03-09", "updated": "2026-03-09"}, {"id": 28, "summary": "Tool: Breakpoint trap", "description": "A Forth word (e.g. BRK or DEBUG) that can be inserted anywhere in Forth code. When executed, dumps registers and stack contents to the screen and waits for a keypress before continuing. Like a printf-debugger for Forth. Implementable as a library word using existing primitives.", "type": "tool", "status": "open", "priority": "low", "file": "forth/lib/debug.fs", "created": "2026-03-09", "updated": "2026-06-16"}, {"id": 29, "summary": "Tool: Memory compare", "description": "Diff two memory regions byte-by-byte, highlighting differences. Takes two addresses and a length. Useful for verifying binaries match expectations or checking if RAM has been corrupted. Display shows address, expected byte, actual byte for each mismatch.", "type": "tool", "status": "icebox", "priority": "low", "file": "forth/lib/memcmp.fs", "created": "2026-03-09", "updated": "2026-06-16"}, {"id": 30, "summary": "Tool: Execution tracer", "description": "Single-step through the Forth thread, showing each word as it executes with stack state. The most powerful debugging tool but also the hardest — requires hooking DOCOL and NEXT in the kernel to intercept each threaded dispatch. Could show CFA address, word name (if symbol table available), and stack contents at each step.", "type": "tool", "status": "icebox", "priority": "low", "file": "src/tools/trace.fs", "created": "2026-03-09", "updated": "2026-06-16"}, {"id": 31, "summary": "Lib: Hi-res graphics (PMODE)", "description": "Closed: VDG mode switching exists in vdg.fs (set-sam-v, set-sam-f, set-pia, reset-text). No unified pmode abstraction needed — separate per-mode libraries (rg-pixel.fs for RG6, future cg-pixel.fs for CG modes) conserve app space by only loading what each app uses.", "type": "enhancement", "status": "done", "priority": "high", "file": "forth/lib/graphics.fs", "created": "2026-03-09", "updated": "2026-03-19"}, {"id": 32, "summary": "Lib: Pixel plot and line drawing", "description": "Closed: Pixel plot and line drawing exist in rg-pixel.fs as optimized CODE words (rg-pset, rg-pget, rg-line, rg-hline). Future CG-mode equivalents would go in a separate cg-pixel.fs library.", "type": "enhancement", "status": "done", "priority": "high", "file": "forth/lib/graphics.fs", "created": "2026-03-09", "updated": "2026-03-19"}, {"id": 33, "summary": "Lib: Circle drawing", "description": "CIRCLE ( cx cy r color -- ) draws a circle using the midpoint circle algorithm. Optional filled variant. Extended Color BASIC's CIRCLE also supports aspect ratio and arc segments — consider a simplified subset. Depends on issue 32 (pixel/line drawing).", "type": "enhancement", "status": "icebox", "priority": "low", "file": "forth/lib/graphics.fs", "created": "2026-03-09", "updated": "2026-06-16"}, {"id": 34, "summary": "Lib: Flood fill (PAINT)", "description": "PAINT ( x y fill-color border-color -- ) flood-fills a bounded region. Extended Color BASIC uses a scanline seed fill. On the 6809 with limited RAM, a simple stack-based fill may hit memory limits — consider a scanline approach. Depends on issue 32.", "type": "enhancement", "status": "icebox", "priority": "low", "file": "forth/lib/graphics.fs", "created": "2026-03-09", "updated": "2026-06-16"}, {"id": 35, "summary": "Lib: DRAW turtle graphics", "description": "A DRAW-like command inspired by Extended Color BASIC's DRAW string language. Compact command strings like 'U10R5D10L5' to draw shapes. Commands: U/D/L/R (up/down/left/right), E/F/G/H (diagonals), M (move to), B (blank move), N (no cursor update), A (angle 0-3), S (scale), C (color). Extremely efficient for defining complex shapes in minimal code. Implement as a Forth word that interprets a command string stored in memory.", "type": "enhancement", "status": "icebox", "priority": "low", "file": "forth/lib/draw.fs", "created": "2026-03-09", "updated": "2026-06-16"}, {"id": 36, "summary": "Lib: Sound and DAC access", "description": "SOUND ( pitch duration -- ) generates a tone via the CoCo's 6-bit DAC on PIA1 ($FF20 bits 2-7). Pitch controls frequency by toggling the DAC output in a timed loop, duration controls length. Also expose DAC-OUT ( value -- ) for direct 6-bit DAC writes (values 0-63 shifted left 2 into $FF20). Foundation for all sound/music features. BLOCKED: DAC writes produce no audio after all-RAM mode (STA $FFDF) is enabled. Full investigation in src/sound/SOUND.md. forth/lib/sound.fs and src/sound/sound.fs exist but silent until the mode-switch/IRQ/PIA path is understood. DONE 2026-05-05: forth/lib/sound.fs provides snd-init, snd-tone (pitch duration --), snd-noise (duration --), and convenience words snd-beep/snd-zap/snd-boom/snd-chirp/snd-dock/snd-hit. PIA setup uses the canonical Daggorath recipe; works in both ROM-mode and all-RAM kernels. Demo at src/sound/ exercises it interactively.", "type": "enhancement", "status": "done", "priority": "medium", "file": "forth/lib/sound.fs", "created": "2026-03-09", "updated": "2026-05-05", "blocked_by": "all-RAM DAC issue — see src/sound/SOUND.md"}, {"id": 37, "summary": "Lib: PLAY music command", "description": "A PLAY-like command inspired by Extended Color BASIC's PLAY string language. Compact music notation like 'T5O3CDEFGAB' to play melodies. Commands: A-G (notes), O (octave 1-5), L (note length), T (tempo 1-31), P (pause), # (sharp). Extremely efficient for encoding music in minimal code. Uses the DAC (issue 36) for tone generation. Implement as a Forth word that interprets a music string stored in memory.", "type": "enhancement", "status": "icebox", "priority": "low", "file": "forth/lib/play.fs", "created": "2026-03-09", "updated": "2026-06-16"}, {"id": 38, "summary": "Demo: Joy to the World (music + graphics)", "description": "Inspired by the Extended Color BASIC manual's sample program. Plays 'Joy to the World' melody while drawing colorful graphics on screen. Combines the PLAY music library (issue 37) with PMODE hi-res graphics (issue 31). A showcase of audio-visual capability.", "type": "demo", "status": "icebox", "priority": "low", "file": "src/joyworld/joyworld.fs", "created": "2026-03-09", "updated": "2026-06-16"}, {"id": 39, "summary": "Demo: Animated rocket", "description": "Inspired by the Extended Color BASIC manual's animated rocket program. Uses GET/PUT-style sprite blitting to move a rocket shape across a hi-res graphics screen. Demonstrates sprite animation, erase-draw cycles, and PMODE graphics. Depends on issues 31-32 (graphics library).", "type": "demo", "status": "icebox", "priority": "low", "file": "src/rocket/rocket.fs", "created": "2026-03-09", "updated": "2026-06-16"}, {"id": 40, "summary": "Demo: Hi-res font renderer", "description": "Inspired by the Extended Color BASIC manual's custom character program. Renders text characters in PMODE hi-res graphics using pixel-level font definitions. Shows how to display readable text on a graphics screen where the normal VDG text mode is unavailable. Depends on issues 31-32.", "type": "demo", "status": "icebox", "priority": "low", "file": "src/hifont/hifont.fs", "created": "2026-03-09", "updated": "2026-06-16"}, {"id": 41, "summary": "Demo: Back to Bach (music player)", "description": "Inspired by the Extended Color BASIC manual's Bach Invention program. Plays a classical piece using the PLAY music library. Demonstrates complex musical notation, tempo changes, and sustained performance. A pure audio demo showcasing the DAC sound system. Depends on issue 37 (PLAY library).", "type": "demo", "status": "icebox", "priority": "low", "file": "src/bach/bach.fs", "created": "2026-03-09", "updated": "2026-06-16"}, {"id": 42, "summary": "Demo: Electronic piano", "description": "Inspired by the Color BASIC manual's electronic piano. Maps keyboard keys to musical tones — press A through K to play notes from middle C up one octave. Visual feedback shows which note is playing. A simple but satisfying interactive demo. Depends on issue 36 (sound library).", "type": "demo", "status": "icebox", "priority": "low", "file": "src/piano/piano.fs", "created": "2026-03-09", "updated": "2026-06-16"}, {"id": 43, "summary": "Demo: Kaleidoscope", "description": "Inspired by the Color BASIC manual's kaleidoscope program. Draws symmetric random patterns using semigraphics-4 SET/RESET. Four-way symmetry creates mesmerizing visual effects. Uses random colors and positions with VSYNC timing. A classic CoCo demo that works with existing semigraphics capabilities — no PMODE needed.", "type": "demo", "status": "done", "priority": "low", "file": "src/kaleidoscope/kaleidoscope.fs", "created": "2026-03-09", "updated": "2026-03-13"}, {"id": 44, "summary": "Demo: Ready Aim Fire (shooting game)", "description": "Inspired by the Color BASIC manual's Ready Aim Fire game. Move a cannon left/right along the bottom of the screen, fire at targets. Text-mode semigraphics with sound effects. Exercises keyboard input, animation, collision detection, and scoring.", "type": "demo", "status": "icebox", "priority": "low", "file": "src/aimfire/aimfire.fs", "created": "2026-03-09", "updated": "2026-06-16"}, {"id": 45, "summary": "Demo: Typing test", "description": "Inspired by the Color BASIC manual's typing test program. Displays a phrase, times the user as they type it, calculates words per minute. Uses VSYNC frame counter for accurate timing. Counts errors by comparing input character-by-character. A practical demo that exercises KEY?, screen output, and timing.", "type": "demo", "status": "icebox", "priority": "low", "file": "src/typing/typing.fs", "created": "2026-03-09", "updated": "2026-06-16"}, {"id": 46, "summary": "Demo: Music composer", "description": "Inspired by the Color BASIC manual's music composer program. Generates random melodies with user-selectable length and tempo. Uses random note selection from a scale, with color screen changes on each note. A generative art/music piece. Depends on issue 36 (sound library).", "type": "demo", "status": "icebox", "priority": "low", "file": "src/composer/composer.fs", "created": "2026-03-09", "updated": "2026-06-16"}, {"id": 47, "summary": "Demo: Bouncing ball", "description": "Inspired by the Color BASIC manual's bouncing dot program. A ball bounces around the screen, reflecting off walls. Uses semigraphics-4 SET/RESET for smooth-looking animation. Could evolve into a simple Pong or Breakout. VSYNC-timed for consistent speed.", "type": "demo", "status": "icebox", "priority": "low", "file": "src/bounce/bounce.fs", "created": "2026-03-09", "updated": "2026-06-16"}, {"id": 48, "summary": "Demo: Dice/Craps game", "description": "Inspired by the Color BASIC manual's dice and craps programs. Simulates rolling two dice with ASCII art dice faces on screen. Implements full craps rules: 7/11 on first roll wins, 2/3/12 loses, otherwise roll for point. Sound effects for rolls and results. Needs a random number generator (VSYNC-seeded).", "type": "demo", "status": "icebox", "priority": "low", "file": "src/craps/craps.fs", "created": "2026-03-09", "updated": "2026-06-16"}, {"id": 49, "summary": "Demo: Speed reading trainer", "description": "Inspired by the Color BASIC manual's speed reading program. Displays text one line at a time at a user-selected words-per-minute rate. Could use a stored passage (e.g. opening of a novel). Tests how fast you can read and comprehend. VSYNC-timed display updates.", "type": "demo", "status": "icebox", "priority": "low", "file": "src/speedread/speedread.fs", "created": "2026-03-09", "updated": "2026-06-16"}, {"id": 50, "summary": "Demo: Math quiz (timed)", "description": "Inspired by the Color BASIC manual's arithmetic and 'Beat the Computer' programs. Generates random math problems (addition, subtraction, maybe multiplication). Player must answer before a timer runs out. Tracks score and percentage correct. Sound feedback for right/wrong answers. VSYNC timing for countdown display.", "type": "demo", "status": "icebox", "priority": "low", "file": "src/mathquiz/mathquiz.fs", "created": "2026-03-09", "updated": "2026-06-16"}, {"id": 51, "summary": "VDG mode switching library (forth/lib/vdg.fs)", "description": "Reusable library for controlling the MC6847 VDG and SAM chip display modes. Words: set-sam-v ( v -- ) sets SAM V0-V2 display mode bits; set-sam-f ( offset -- ) sets SAM F0-F6 display offset; set-pia ( bits -- ) sets PIA $FF22 bits 7-3 preserving 2-0; reset-text ( -- ) restores default Alpha text mode. Encapsulates all the fiddly SAM/PIA register poking so graphics programs don't have to.", "type": "library", "status": "done", "priority": "medium", "file": "forth/lib/vdg.fs", "created": "2026-03-11", "updated": "2026-03-11"}, {"id": 52, "summary": "5x7 bitmap font library (forth/lib/font5x7.fs)", "description": "Reusable 5x7 pixel font for rendering text in graphics modes. 37 glyphs: space, A-Z, 0-9. 7 bytes per glyph with pixels in bits 7-3. Written to $6000 at init using fb pattern from Tetris. glyph-addr ( char -- addr ) maps ASCII to font data address. Reusable by any program needing text in non-Alpha VDG modes.", "type": "library", "status": "done", "priority": "medium", "file": "forth/lib/font5x7.fs", "created": "2026-03-11", "updated": "2026-03-11"}, {"id": 53, "summary": "Demo: VDG Mode Demo (src/vdg-modes/)", "description": "Cycles through all 11 MC6847 display modes: Alpha Internal, SG4, SG6, CG1-CG6, RG1-RG6. Mode table at $5800: 11 entries x 16 bytes with VRAM base, size, PIA/SAM values, mode name. Text modes write VDG chars directly; RG modes use font byte per row; CG modes nibble-expand font. Each mode shows a visual pattern (color bars, stripes, checkerboard) plus the mode name. Key press advances to next mode; loops forever. Depends on #51 (vdg.fs) and #52 (font5x7.fs).", "type": "demo", "status": "done", "priority": "medium", "file": "src/vdg-modes/vdg-modes.fs", "created": "2026-03-11", "updated": "2026-03-11"}, {"id": 54, "summary": "Demo: Digital Rain (Matrix effect)", "description": "Matrix-style falling green characters on black VDG text screen. 32 independent columns with random speeds, bright inverse-video heads and dim normal trails. Trail mutation and random spawning create an organic feel. SAM double-speed for fast updates. Uses rng.fs and screen.fs libraries.", "type": "demo", "status": "done", "priority": "medium", "file": "src/rain/rain.fs", "created": "2026-03-13", "updated": "2026-03-13"}, {"id": 55, "summary": "Demo: Tetris", "description": "Full SG4 semigraphics Tetris. 10x16 board, 7 standard pieces with rotation, gravity with speed-up, line clearing, scoring, next-piece preview, high score table. Zero-flicker draw-first-clean-stale rendering. Arrow keys move/rotate, space for hard drop. Key repeat with DAS timing. Uses rng.fs, screen.fs, print.fs, datawrite.fs libraries.", "type": "demo", "status": "done", "priority": "high", "file": "src/tetris/tetris.fs", "created": "2026-03-13", "updated": "2026-03-13"}, {"id": 56, "summary": "Lib: RG6 artifact-color pixel primitives (rg-pixel.fs)", "description": "Pixel primitives for RG6 mode (PMODE 4) with NTSC artifact coloring. Treats pixel pairs as artifact-color units (00=black, 11=white, 01=blue, 10=red) at effective 128x192 resolution. Words: rg-pset ( x y color -- ) plot artifact pixel, rg-pget ( x y -- color ) read pixel, rg-pcls ( -- ) clear to black, rg-hline ( x1 x2 y color -- ) fast horizontal line. VRAM at $3000, 6144 bytes, 32 bytes/row. Foundation for all Space Warp graphics.", "type": "library", "status": "done", "priority": "high", "file": "forth/lib/rg-pixel.fs", "created": "2026-03-13", "updated": "2026-03-13"}, {"id": 57, "summary": "Lib: Bresenham line drawing for RG6 (rg-pixel.fs)", "description": "Add rg-line ( x1 y1 x2 y2 color -- ) to rg-pixel.fs using Bresenham's algorithm. Draws lines in artifact color for maser beams, enemy fire, and tactical display borders. Must handle all octants correctly. Depends on #56.", "type": "library", "status": "done", "priority": "high", "file": "forth/lib/rg-pixel.fs", "created": "2026-03-13", "updated": "2026-03-13"}, {"id": 58, "summary": "Lib: Software sprite library (sprite.fs)", "description": "Software sprites for RG6 artifact-color mode. Sprite data format: width, height, then row bytes (2bpp artifact-color packed). spr-draw ( addr x y -- ) draws sprite with color 0 as transparent. spr-erase ( addr x y -- ) erases sprite footprint to black. Background save/restore for clean overdraw without flicker. Used for Endever, Jovians, bases, stars, triton missile ball. Depends on #56.", "type": "library", "status": "done", "priority": "high", "file": "forth/lib/sprite.fs", "created": "2026-03-13", "updated": "2026-03-13"}, {"id": 59, "summary": "RG6 artifact graphics test app (src/rg-test/)", "description": "Test application for RG6 artifact-color graphics. Exercises pixel plot, line draw, sprite draw/erase, and trig-based line angles. Fixed spr-erase→spr-erase-box rename. All tests passing at various angles, sprite draw/erase, and text rendering. Visual verification via XRoar with NTSC artifact display. Depends on #56-58.", "type": "test", "status": "done", "priority": "high", "file": "src/rg-test/rg-test.fs", "created": "2026-03-13", "updated": "2026-03-16"}, {"id": 60, "summary": "Lib: Sine/cosine lookup table for angle-based firing", "description": "8-bit sine/cosine lookup table for converting firing angles (0-360 degrees) to dx/dy vectors. 91-entry table (0-90 degrees) with quadrant mirroring. Fixed-point values scaled for tactical view dimensions. Used by masers and triton missiles for angle-to-direction conversion.", "type": "library", "status": "done", "priority": "high", "file": "forth/lib/trig.fs", "created": "2026-03-13", "updated": "2026-03-13"}, {"id": 93, "summary": "Optimize graphics primitives as kernel assembly", "description": "Move rg-pset, rg-line (Bresenham), spr-draw, spr-erase-box, and rg-char to 6809 assembly kernel primitives. ITC Forth overhead makes these ~30x slower than native. rg-pset alone is called per-pixel by lines, sprites, and fonts. Also page out ROMs ($FFDE) to reclaim $8000-$FEFF as RAM. Expected gains: rg-line from ~1500 to ~40 cycles/pixel, spr-draw from ~800 to ~50 cycles/pixel.", "type": "enhancement", "status": "done", "priority": "high", "file": "forth/kernel/kernel.asm", "created": "2026-03-15", "updated": "2026-03-15"}, {"id": 94, "summary": "fc.py: tokenizer captures CODE...;CODE blocks as raw asm text", "type": "feature", "status": "done", "priority": "high", "file": "forth/tools/fc.py", "created": "2026-03-15", "updated": "2026-03-15", "tags": ["fc.py", "CODE"]}, {"id": 95, "summary": "fc.py: parser builds code_definitions from CODE tokens", "type": "feature", "status": "done", "priority": "high", "depends_on": [94], "file": "forth/tools/fc.py", "created": "2026-03-15", "updated": "2026-03-15", "tags": ["fc.py", "CODE"]}, {"id": 96, "summary": "fc.py: preprocess_asm + assemble_code_words via lwasm", "type": "feature", "status": "done", "priority": "high", "file": "forth/tools/fc.py", "created": "2026-03-15", "updated": "2026-03-15", "tags": ["fc.py", "CODE"]}, {"id": 97, "summary": "fc.py: compiler integrates CODE words into binary layout", "type": "feature", "status": "done", "priority": "high", "depends_on": [94, 95, 96], "file": "forth/tools/fc.py", "created": "2026-03-15", "updated": "2026-03-15", "tags": ["fc.py", "CODE"]}, {"id": 98, "summary": "CODE word end-to-end test app", "type": "test", "status": "closed", "priority": "high", "depends_on": [97], "file": "src/code-test/code-test.fs", "created": "2026-03-15", "updated": "2026-03-15", "tags": ["fc.py", "CODE"]}, {"id": 99, "summary": "Migrate 5 graphics primitives from kernel to library CODE words", "description": "Moved rg-pset, rg-line, spr-draw, spr-erase-box, rg-char from kernel.asm to CODE words in their respective libraries (rg-pixel.fs, sprite.fs, rg-text.fs). Freed ~652 bytes of kernel ROM. Scratch variables remain in kernel RAM at $0050+ for CODE word EQU resolution.", "type": "feature", "status": "done", "priority": "medium", "depends_on": [97], "file": "forth/lib/rg-pixel.fs", "created": "2026-03-15", "updated": "2026-03-15", "tags": ["fc.py", "CODE", "kernel"]}, {"id": 100, "summary": "Font-art.fs: digit 7 looks like letter T", "description": "The 7 glyph in font-art.fs used centered stem (.#. / $30) for all rows below the top bar, making it identical to T. Fixed by shifting top two stem rows right (..# / $0C) to create a diagonal descent.", "type": "bug", "status": "done", "priority": "medium", "file": "forth/lib/font-art.fs", "created": "2026-03-15", "updated": "2026-03-15"}, {"id": 108, "summary": "Move VRAM from $5000 to $5200 for more app space", "description": "App binary exceeded $5000 (12288 byte limit). Moved VRAM base to $5200, giving 12800 bytes for app code. All game data addresses shifted up by $200 ($6800->$6A00, sprites $6900->$6B00, etc). CODE word buffer addresses updated.", "type": "enhancement", "status": "done", "priority": "high", "file": "forth/lib/rg-pixel.fs", "created": "2026-03-16", "updated": "2026-03-16"}, {"id": 116, "summary": "Add UNLOOP kernel primitive", "description": "UNLOOP ( -- ) (R: loop-sys -- ) removes DO/LOOP control parameters (index and limit) from the return stack without branching. Needed for early exit from loops via EXIT. Without it, EXIT inside a DO/LOOP corrupts the return stack. Implementation: LEAS 4,S then NEXT. Add CFA_UNLOOP to kernel.asm and 'unloop' to fc.py kernel_words(). Standard ANS Forth word.", "type": "enhancement", "status": "done", "priority": "medium", "file": "forth/kernel/kernel.asm", "created": "2026-03-16", "updated": "2026-03-22"}, {"id": 117, "summary": "Add ROT kernel primitive", "description": "ROT ( a b c -- b c a ) rotates top three stack items. Third most common stack operation after DUP and SWAP. Currently requires >R SWAP R> SWAP (4 words). Assembly: load 3 values from U, store back rotated, ~12 bytes.", "type": "enhancement", "status": "done", "priority": "high", "file": "forth/kernel/kernel.asm", "created": "2026-03-16", "updated": "2026-03-19"}, {"id": 118, "summary": "Add 2DUP kernel primitive", "description": "2DUP ( a b -- a b a b ) duplicates top two stack items. Currently written as OVER OVER. Assembly: LDD ,U / LDY 2,U / STD ,--U / STY ,--U or similar, ~10 bytes.", "type": "enhancement", "status": "done", "priority": "high", "file": "forth/kernel/kernel.asm", "created": "2026-03-16", "updated": "2026-03-19"}, {"id": 119, "summary": "Add +! kernel primitive", "description": "+! ( n addr -- ) adds n to the cell at addr. Extremely common for incrementing variables. Currently requires DUP @ ROT + SWAP ! (5 words). Assembly: pop addr and n, load cell, add, store back, ~10 bytes. Applied at 19 sites in spacewarp.fs + 3 in library files.", "type": "enhancement", "status": "done", "priority": "high", "file": "forth/kernel/kernel.asm", "created": "2026-03-16", "updated": "2026-03-19"}, {"id": 120, "summary": "Add >R R> R@ kernel primitives", "description": ">R ( n -- ) (R: -- n ) moves TOS to return stack. R> ( -- n ) (R: n -- ) moves return stack TOS to data stack. R@ ( -- n ) (R: n -- n ) copies return stack TOS. 6 bytes each, 24 bytes total kernel cost.", "type": "enhancement", "status": "done", "priority": "high", "file": "forth/kernel/kernel.asm", "created": "2026-03-16", "updated": "2026-03-19"}, {"id": 121, "summary": "Add 2DROP kernel primitive", "description": "2DROP ( a b -- ) drops top two stack items. Currently DROP DROP (2 words, 2 NEXT dispatches). Assembly: LEAU 4,U then NEXT, ~4 bytes. Applied at 9 sites in spacewarp.fs.", "type": "enhancement", "status": "done", "priority": "high", "file": "forth/kernel/kernel.asm", "created": "2026-03-16", "updated": "2026-03-19"}, {"id": 122, "summary": "Add PICK kernel primitive", "description": "PICK ( n -- x ) copies the nth stack item to TOS. 0 PICK = DUP, 1 PICK = OVER, etc. General-purpose deep stack access without return stack gymnastics. Assembly: LDD ,U (get n) / ASLB ROLA (n*2) / LDD D,U / STD ,U, ~8 bytes.", "type": "enhancement", "status": "done", "priority": "medium", "file": "forth/kernel/kernel.asm", "created": "2026-03-16", "updated": "2026-03-22"}, {"id": 123, "summary": "Add INVERT kernel primitive", "description": "INVERT ( n -- ~n ) bitwise complement. Complement to AND/OR. Assembly: LDD ,U / COMA / COMB / STD ,U, ~6 bytes.", "type": "enhancement", "status": "done", "priority": "medium", "file": "forth/kernel/kernel.asm", "created": "2026-03-16", "updated": "2026-03-22"}, {"id": 124, "summary": "Add XOR kernel primitive", "description": "XOR ( n1 n2 -- n3 ) bitwise exclusive or. Completes the bitwise trio with AND and OR. Assembly: LDD ,U++ / EORA ,U / EORB 1,U / STD ,U, ~8 bytes.", "type": "enhancement", "status": "done", "priority": "medium", "file": "forth/kernel/kernel.asm", "created": "2026-03-16", "updated": "2026-03-22"}, {"id": 125, "summary": "Add MIN and MAX kernel primitives", "description": "MIN ( n1 n2 -- min ) and MAX ( n1 n2 -- max ). Moved from app-level CODE words to kernel. Saves per-app overhead.", "type": "enhancement", "status": "done", "priority": "medium", "file": "forth/kernel/kernel.asm", "created": "2026-03-16", "updated": "2026-03-22"}, {"id": 126, "summary": "Add J kernel primitive", "description": "J ( -- n ) pushes the outer loop index in nested DO/LOOPs. The outer index is 4 bytes deep on the return stack (past the inner loop's index and limit). Assembly: LDD 4,S / STD ,--U, ~6 bytes.", "type": "enhancement", "status": "done", "priority": "medium", "file": "forth/kernel/kernel.asm", "created": "2026-03-16", "updated": "2026-03-22"}, {"id": 127, "summary": "Add +LOOP kernel primitive", "description": "+LOOP ( n -- ) like LOOP but increments index by n instead of 1. Enables counting by arbitrary steps and counting down. Requires signed overflow detection for correct termination across the limit boundary. More complex than LOOP — ~20 bytes.", "type": "enhancement", "status": "done", "priority": "medium", "file": "forth/kernel/kernel.asm", "created": "2026-03-16", "updated": "2026-03-22"}, {"id": 128, "summary": "Add ABS kernel primitive", "description": "ABS ( n -- |n| ) absolute value. Moved from Forth definition in rg-pixel.fs to kernel CODE word. Assembly: test sign, negate if negative.", "type": "enhancement", "status": "done", "priority": "low", "file": "forth/kernel/kernel.asm", "created": "2026-03-16", "updated": "2026-03-22"}, {"id": 129, "summary": "Add MOD and / kernel primitives", "description": "Not needed as separate primitives. /MOD gives both remainder and quotient; use /MOD SWAP DROP for division, /MOD DROP for modulus. Documented in kernel README.", "type": "enhancement", "status": "closed", "priority": "low", "file": "forth/kernel/kernel.asm", "created": "2026-03-16", "updated": "2026-03-23"}, {"id": 130, "summary": "Relocate VRAM to $0600, contiguous app space", "description": "VRAM moved from $4000 to $0600 (below app). App is now a single contiguous block at $2000 (~24K via CLOADM). No more --hole flag needed. fc.py --hole kept for backward compat but unused.", "type": "enhancement", "status": "done", "priority": "high", "file": "forth/lib/rg-pixel.fs", "created": "2026-03-16", "updated": "2026-03-16"}, {"id": 131, "summary": "Relocate kernel to $E000 via all-RAM mode", "description": "Kernel moved from $1000 to $E000 (ROM 2 region). Bootstrap at $0E00 enables all-RAM (STA $FFDF — NOT $FFDE), copies staged kernel from $1000 to $E000. Stacks at $DE00/$E000. 24K runtime RAM at $8000-$DDFF. Previous attempt failed because $FFDE clears TY (keeps ROM), $FFDF sets TY (all-RAM). XRoar works fine with -ram 64.", "type": "enhancement", "status": "done", "priority": "high", "file": "forth/kernel/kernel.asm", "created": "2026-03-16", "updated": "2026-03-16"}, {"id": 132, "summary": "Interactive boot animation docs (boot-animation.html)", "description": "Step-by-step HTML animation showing the DECB load, bootstrap, all-RAM, copy, and START sequence. Shows memory map with VRAM at $0600, 24K loadable app, 24K runtime RAM, kernel at $E000. Navigate with arrow keys or buttons.", "type": "docs", "status": "done", "priority": "medium", "file": "forth/kernel/boot-animation.html", "created": "2026-03-16", "updated": "2026-03-16"}, {"id": 133, "summary": "Add -ram 64 to all demo Makefiles", "description": "All demos need -ram 64 for XRoar since kernel is at $E000 (requires SAM all-RAM mode with 64K DRAM). Updated: typewriter, kaleidoscope, tetris, rain, rg-test. spacewarp already had it.", "type": "bugfix", "status": "done", "priority": "high", "file": "src/*/Makefile", "created": "2026-03-16", "updated": "2026-03-16"}, {"id": 134, "summary": "Fix rg-test: spr-erase renamed to spr-erase-box", "description": "rg-test.fs referenced spr-erase which was renamed to spr-erase-box in an earlier commit. Updated both references. Build and run verified.", "type": "bugfix", "status": "done", "priority": "medium", "file": "src/rg-test/rg-test.fs", "created": "2026-03-16", "updated": "2026-03-16"}, {"id": 137, "summary": "Kernel scratch variables for beam system (VAR_BEAM_*)", "description": "Add ~6 bytes of scratch variables to kernel.asm for the beam-trace/beam-draw-slice/beam-restore-slice CODE words: VAR_BEAM_BUF (2 bytes, path buffer pointer), VAR_BEAM_VRAM (2 bytes, VRAM address scratch), VAR_BEAM_CNT (2 bytes, pixel count scratch).", "type": "enhancement", "status": "done", "priority": "high", "file": "forth/kernel/kernel.asm", "created": "2026-03-17", "updated": "2026-03-18"}, {"id": 138, "summary": "Beam pixel-save library (forth/lib/beam.fs)", "description": "New library with three CODE words: beam-trace, beam-draw-slice, beam-restore-slice.", "type": "library", "status": "done", "priority": "high", "file": "forth/lib/beam.fs", "created": "2026-03-17", "updated": "2026-03-18", "depends": [137]}, {"id": 151, "summary": "Kernel: TYPE primitive ( addr len -- )", "description": "Add TYPE to kernel — loops over len bytes at addr calling EMIT for each. ~20 bytes at $E000. Enables string-based text output, saving app space vs char-by-char EMIT calls.", "type": "enhancement", "status": "done", "priority": "high", "file": "forth/kernel/kernel.asm", "created": "2026-03-18", "updated": "2026-03-18"}, {"id": 152, "summary": "Kernel: COUNT primitive ( c-addr -- addr+1 len )", "description": "Add COUNT to kernel — converts counted string (length byte + chars) to addr+len form. ~12 bytes at $E000.", "type": "enhancement", "status": "done", "priority": "high", "file": "forth/kernel/kernel.asm", "created": "2026-03-18", "updated": "2026-03-18"}, {"id": 153, "summary": "fc.py: S\" and .\" string literal support", "description": "Add S\" ... \" syntax to fc.py. Compiles inline string data in thread with BRANCH to skip over it, pushes addr+len at runtime. Add .\" as shorthand for S\" ... \" TYPE. New slit IR node. Breakeven at 4+ chars vs CHAR-by-CHAR.", "type": "enhancement", "status": "done", "priority": "high", "file": "forth/tools/fc.py", "created": "2026-03-18", "updated": "2026-03-18", "depends": [151]}, {"id": 154, "summary": "Library: rg-type ( addr len -- ) for RG6 text output", "description": "Add rg-type to rg-text.fs — Forth word that loops over string calling rg-emit for each byte. Keeps RG6-specific code out of kernel. Enables S\" ... \" rg-type pattern.", "type": "enhancement", "status": "done", "priority": "high", "file": "forth/lib/rg-text.fs", "created": "2026-03-18", "updated": "2026-03-18"}, {"id": 162, "summary": "Move font data to kernel as raw FCB bytes", "description": "Moved 59 glyphs (472 bytes) from font-art.fs Forth literals into kernel.asm as DOVAR + FCB data. init-font becomes: font-data $9000 472 CMOVE. Eliminated fp variable, fb, f8, f0 helper words. Saved 1,538 bytes of app space (21529 -> 19991). Kernel cost: 474 bytes. Font loads in <1ms vs visible pause before.", "type": "enhancement", "status": "done", "priority": "high", "file": "forth/kernel/kernel.asm", "created": "2026-03-19", "updated": "2026-03-19", "tags": ["kernel", "optimization"]}, {"id": 163, "summary": "Move sprite data to kernel as raw FCB bytes", "description": "init-sprites in spacewarp.fs costs ~394 bytes of app space to push-and-store 60 bytes of sprite pixel data via Forth literals. Moved 5 sprites into kernel.asm as DOVAR + FCB data (62 bytes kernel). init-sprites becomes: sprite-data SPR-SHIP 60 CMOVE. Saved 380 bytes of app space (21909 -> 21529). Kernel cost: 62 bytes from 6.6K headroom.", "type": "enhancement", "status": "done", "priority": "medium", "file": "forth/kernel/kernel.asm", "created": "2026-03-19", "updated": "2026-03-19", "tags": ["kernel", "optimization"]}, {"id": 164, "summary": "Add PROX-SCAN kernel primitive for spatial proximity queries", "description": "Generic kernel primitive: prox-scan ( cx cy radius array count -- bitmask ). Scans (x,y) byte pairs, returns bitmask of entries within Manhattan distance. ~70 bytes kernel code. Uses return stack for loop params, handles 8-bit overflow on distance sum.", "type": "enhancement", "status": "done", "priority": "medium", "file": "forth/kernel/kernel.asm", "created": "2026-03-19", "updated": "2026-03-19", "tags": ["kernel", "optimization"]}, {"id": 199, "summary": "Resize missile sprites from 5x5 to 3x3 and fix animation rate", "description": "Shrink missile sprites from 5x5 to 3x3 in kernel sprite-data. Update SPR-MSL2 address (offset changes from 48 to 41), init-sprites copy count (60→46), and all missile centering offsets (2→1). Fix missile animation rate from every-frame to every-2-frames for visible alternation.", "type": "enhancement", "status": "done", "priority": "medium", "file": "forth/kernel/kernel.asm", "created": "2026-03-21", "updated": "2026-03-21"}, {"id": 211, "summary": "Add MDIST kernel primitive and refactor call sites", "description": "MDIST ( addr1 addr2 -- d ) Manhattan distance between two (x,y) byte pairs. 7 call sites converted, 262 bytes saved. Remaining abs uses are bounding box checks or loose values.", "type": "optimization", "status": "done", "priority": "high", "file": "forth/kernel/kernel.asm", "created": "2026-03-22", "updated": "2026-03-22"}, {"id": 245, "summary": "fc.py: inline CONSTANT values as LIT (selective)", "description": "fc.py inline_constants() inlines CONSTANT references as LIT values. Initially selective (<=3 refs, MAX_INLINE_REFS=3, saved 262 bytes). Then raised to inline all constants (#246). 23 low-ref + 22 high-ref constants inlined. Each ref: 80cy->31cy (49cy saved). App savings from selective phase: 262 bytes.", "type": "feature", "status": "done", "priority": "high", "file": "forth/tools/fc.py", "created": "2026-03-27", "updated": "2026-03-28"}, {"id": 246, "summary": "fc.py: inline high-ref CONSTANTs when space available", "description": "MAX_INLINE_REFS raised to 999 (inline all). High-ref constants inlined: SHIP-POS(44 refs), JOV-POS(43), JOV-DMG(38), BASE-POS(16), BHOLE-POS(16), etc. Cost +324 bytes but saves ~49cy per reference across all paths. Combined with #245, all CONSTANT definitions eliminated from output.", "type": "optimization", "status": "done", "priority": "high", "file": "forth/tools/fc.py", "created": "2026-03-28", "updated": "2026-03-28"}, {"id": 264, "summary": "Bounce demo: HSYNC beam-chasing testbed with 4 balls", "description": "New demo at src/bounce/ — 4 bouncing balls in RG6 artifact-color mode with three rendering modes (0=free-running, 1=VSYNC only, 2=VSYNC+HSYNC beam-chasing). Time-sliced rendering (2 balls/frame, 30fps per ball). Font HUD shows blanking offset and mode. Up/down arrows adjust offset, 0/1/2 keys switch modes. Proved HSYNC beam-chasing technique before applying to Space Warp (#262). Includes README documenting findings and CoCo keyboard matrix reference.", "type": "feature", "status": "done", "priority": "low", "file": "src/bounce/bounce.fs", "created": "2026-03-30", "updated": "2026-03-30"}, {"id": 265, "summary": "Kernel: vsync CODE word + wait-past-row blanking offset fix", "description": "Converted vsync from Forth (BEGIN/UNTIL polling loop) to CODE word for tighter detection. Fixed wait-past-row blanking offset from 35 to 70 HSYNC lines — 70 matches the actual NTSC vertical blanking interval (262 total lines - 192 visible). Both in forth/lib/screen.fs.", "type": "enhancement", "status": "done", "priority": "medium", "file": "forth/lib/screen.fs", "created": "2026-03-30", "updated": "2026-03-30"}, {"id": 266, "summary": "Update docs/reference.html: fix keyboard matrix, add missing libraries", "description": "reference.html has the old wrong keyboard matrix (all arrows in C3). Fix to match corrected keyboard.fs and kernel KEY_TABLE. Add missing library sections: rg-pixel.fs, sprite.fs, beam.fs, trig.fs, sound.fs, dac.fs, screen.fs (wait-past-row, count-blanking). Update memory map for all-RAM configuration.", "type": "docs", "status": "done", "priority": "medium", "file": "docs/reference.html", "created": "2026-03-30", "updated": "2026-03-30"}, {"id": 267, "summary": "Add cross-references and headers to markdown working notes", "description": "Add research/exploratory header to COCO_INTERRUPTS.md. Link USERGUIDE.md and MARKETING.md from spacewarp/README.md. Cross-reference SPEC.md and AI_DIVERSITY_STRATEGY.md. Trim out-of-scope hardware spec from COCO_RENOVATION.md.", "type": "docs", "status": "done", "priority": "low", "file": "COCO_RENOVATION.md", "created": "2026-03-30", "updated": "2026-03-30"}, {"id": 330, "summary": "Screen capture MCP crash fix — use-after-free in non-ARC ObjC", "description": "Fixed crash in screen-capture-mcp C++ server. Root cause: SCShareableContent cache used raw ObjC pointers without ARC (project compiled without -fobjc-arc). Completion handler's autorelease pool could free SCWindow/SCDisplay objects while capture_window was iterating them. Fix: explicit CFRetain in completion handler, manual [content release] in each consumer function, serialized access with mutex. Removed 2-second cache (unnecessary for sequential MCP calls). Crash logs confirmed SIGSEGV in objc_msgSend from capture_window.", "type": "bugfix", "status": "done", "priority": "high", "file": "screen-capture-mcp (external)", "created": "2026-04-04", "updated": "2026-04-04"}, {"id": 332, "summary": "Move screen CODE words to kernel (vsync, wait-past-row, count-blanking)", "description": "Move 3 screen sync primitives from forth/lib/screen.fs into kernel.asm. These are hardware-only (PIA $FF00-$FF03), no app dependencies. Add CFA symbols to kernel map so fc.py resolves them as kernel words. Remove CODE blocks from screen.fs. Est. ~82 bytes reclaimed from app space.", "type": "optimization", "status": "done", "priority": "high", "file": "forth/kernel/kernel.asm", "created": "2026-04-04", "updated": "2026-04-04"}, {"id": 333, "summary": "Move rg-pixel CODE words to kernel (rg-pset, rg-line)", "description": "Move 2 RG6 pixel primitives from forth/lib/rg-pixel.fs into kernel.asm. Both use only kernel scratch vars (VAR_RGVRAM, VAR_LINE_*). General-purpose for any RG6 app. Est. ~429 bytes reclaimed from app space.", "type": "optimization", "status": "done", "priority": "high", "file": "forth/kernel/kernel.asm", "created": "2026-04-04", "updated": "2026-04-04"}, {"id": 334, "summary": "Move sprite CODE words to kernel (spr-draw, spr-erase-box)", "description": "Move 2 sprite primitives from forth/lib/sprite.fs into kernel.asm. Both use only kernel scratch vars (VAR_SPR_*, VAR_RGVRAM). General-purpose for any RG6 sprite app. Est. ~369 bytes reclaimed from app space.", "type": "optimization", "status": "done", "priority": "high", "file": "forth/kernel/kernel.asm", "created": "2026-04-04", "updated": "2026-04-04"}, {"id": 335, "summary": "Move rg-char CODE word to kernel", "description": "Move rg-char font rendering primitive from forth/lib/rg-text.fs into kernel.asm. Uses kernel config vars at $75-$7B (font base, glyph size, rows, bpr, row height). General-purpose for any text rendering. Est. ~75 bytes reclaimed from app space.", "type": "optimization", "status": "done", "priority": "high", "file": "forth/kernel/kernel.asm", "created": "2026-04-04", "updated": "2026-04-04"}, {"id": 336, "summary": "Move beam CODE words to kernel (beam-trace, beam-draw-slice, beam-restore-slice, beam-find-obstacle, beam-scrub-pos)", "description": "Move 5 beam system primitives from forth/lib/beam.fs and spacewarp.fs into kernel.asm. All use kernel scratch vars (VAR_BEAM_*, VAR_LINE_*, VAR_RGVRAM). beam-find-obstacle and beam-scrub-pos are pure buffer operations. General-purpose for any beam/line-of-sight system. Est. ~779 bytes reclaimed from app space.", "type": "optimization", "status": "done", "priority": "high", "file": "forth/kernel/kernel.asm", "created": "2026-04-04", "updated": "2026-04-04"}, {"id": 337, "summary": "Add KCODE directive to fc.py for kernel-space CODE words", "description": "New compiler directive KCODE...;KCODE that assembles CODE words into the kernel region ($E86A-$FEFF) instead of app space. Requires second origin counter in fc.py, kernel binary patching, and FVAR_* resolution for app-space variable references. Enables moving game-specific CODE words (~4185 bytes) out of app space. Phase 2 after library words are promoted to kernel primitives (#332-#336).", "type": "feature", "status": "done", "priority": "medium", "file": "forth/tools/fc.py", "created": "2026-04-04", "updated": "2026-04-05"}, {"id": 346, "summary": "Missile stuck at 0 velocity for headings >= 720", "description": "sin() normalization only subtracted 360 once, so angles >= 720 read garbage past the 91-byte SINTAB. Could produce dx=dy=0, freezing the missile in place. Fix: use /MOD 360 for proper modulo normalization.", "type": "fix", "status": "done", "priority": "high", "file": "forth/lib/trig.fs", "created": "2026-04-05", "updated": "2026-04-05"}, {"id": 350, "summary": "save-ship-bg to CODE word", "description": "save-ship-bg is a Forth wrapper (837cy) calling bg-save CODE (140cy). The Forth wrapper costs ~700cy in ITC overhead — CONSTANT lookups, C@ fetches, arithmetic. Converting to CODE saves ~500cy. Low risk, small effort.", "type": "optimization", "status": "done", "priority": "high", "created": "2026-04-06", "updated": "2026-04-07"}, {"id": 353, "summary": "Redesign Endever sprite — chevron with twin red engines", "description": "Replaced boring triangle with shaped chevron: nacelle gaps, twin red engine pixels at stern. Blue hull, more character.", "type": "enhancement", "status": "done", "priority": "low", "file": "forth/kernel/kernel.asm", "created": "2026-04-07", "updated": "2026-04-07"}, {"id": 354, "summary": "Redesign starbase sprite — 7x7 ring with spokes", "description": "Expanded base from 5 to 7 rows. Blue ring with blue spokes, hollow center. Shifted QCOUNTS from $80B0 to $80B4 to avoid overlap with MSL2 sprite data.", "type": "enhancement", "status": "done", "priority": "low", "file": "forth/kernel/kernel.asm", "created": "2026-04-07", "updated": "2026-04-07"}, {"id": 371, "summary": "Add U< kernel primitive", "description": "Unsigned less-than comparison. Standard Forth word, useful for boundary checks across all apps. Added to kernel as primitive #75.", "type": "enhancement", "status": "done", "priority": "medium", "file": "forth/kernel/kernel.asm", "created": "2026-04-09", "updated": "2026-04-09"}, {"id": 372, "summary": "Add 0MAX kernel primitive", "description": "Clamp to >= 0. Promoted from spacewarp Forth definition to kernel primitive #76. Removed Forth definition, 6 call sites now use kernel primitive. Saved 22 bytes in app.", "type": "enhancement", "status": "done", "priority": "medium", "file": "forth/kernel/kernel.asm", "created": "2026-04-09", "updated": "2026-04-09"}, {"id": 373, "summary": "Add 2* kernel primitive", "description": "Arithmetic shift left by 1. Added as kernel primitive #77. Used in jov-pos-addr (2 * → 2*), saved 4 bytes.", "type": "enhancement", "status": "done", "priority": "low", "file": "forth/kernel/kernel.asm", "created": "2026-04-09", "updated": "2026-04-09"}, {"id": 374, "summary": "Add WITHIN kernel primitive", "description": "Range test: ( n lo hi -- flag ). Standard Forth WITHIN using unsigned trick (n-lo u< hi-lo). Added as kernel primitive #80.", "type": "enhancement", "status": "done", "priority": "low", "file": "forth/kernel/kernel.asm", "created": "2026-04-09", "updated": "2026-04-09"}, {"id": 376, "summary": "Add 2/ kernel primitive", "description": "Arithmetic shift right by 1. Added as kernel primitive #78. Replaced 9 occurrences of 1 RSHIFT in spacewarp, saved 36 bytes.", "type": "enhancement", "status": "done", "priority": "low", "file": "forth/kernel/kernel.asm", "created": "2026-04-09", "updated": "2026-04-09"}, {"id": 377, "summary": "Add 0MIN kernel primitive", "description": "Clamp to <= 0. Mirror of 0MAX (#372). Added as kernel primitive #79.", "type": "enhancement", "status": "done", "priority": "low", "file": "forth/kernel/kernel.asm", "created": "2026-04-09", "updated": "2026-04-09"}, {"id": 380, "summary": "Add KEY_SCAN kernel subroutine", "description": "Extracted keyboard scan logic from CODE_KEY_NB into a KEY_SCAN subroutine callable via BSR/LBSR from CODE words. Returns ASCII in A, 0 if no key. Preserves X, U. Enables CODE words to scan keyboard without duplicating PIA logic.", "type": "enhancement", "status": "done", "priority": "medium", "file": "forth/kernel/kernel.asm", "created": "2026-04-09", "updated": "2026-04-09"}, {"id": 386, "summary": "Relocate kernel variables from $0050 to kernel space ($EF03+)", "description": "Moved 50 bytes of VAR_* variables from $0050 (BASIC direct page) to end of kernel at $EF03+. Variables are now copied to all-RAM with the rest of the kernel by the bootstrap. Eliminates DECB record at $0050, making binaries LOADM-safe from Disk BASIC. All VAR_* accesses were already extended addressing — no performance change.", "type": "enhancement", "status": "done", "priority": "high", "file": "forth/kernel/kernel.asm", "created": "2026-04-13", "updated": "2026-04-13"}, {"id": 387, "summary": "Replace hardcoded kernel variable addresses with KVAR-* constants", "description": "fc.py now injects KVAR-* Forth constants from kernel.map (e.g. KVAR-CUR, KVAR-RGVRAM, KVAR-RGFONT). Replaced all hardcoded $0050/$0057/$0075-$007B references in spacewarp.fs, bounce.fs, sprtest.fs, tetris.fs, rain.fs, typewriter.fs, and rg-pixel.fs with symbolic KVAR-* names. Addresses resolve automatically when kernel layout changes.", "type": "enhancement", "status": "done", "priority": "high", "file": "forth/tools/fc.py", "created": "2026-04-13", "updated": "2026-04-13"}, {"id": 388, "summary": "Dynamic kernel staging address in fc.py", "description": "Staging address for the kernel copy now packs right after the bootstrap ($0E19) instead of hardcoded $1000. Reclaims ~480 bytes of headroom before APP_BASE. fc.py patches the bootstrap's LDX source address and LDX #APP_BASE automatically. Prevents staged kernel overflow when KCODE words are appended.", "type": "enhancement", "status": "done", "priority": "medium", "file": "forth/tools/fc.py", "created": "2026-04-13", "updated": "2026-04-13"}, {"id": 390, "summary": "Top-level Makefile with DSK disk image target", "description": "New top-level Makefile: 'make' builds kernel + all demos, 'make dsk' creates build/demos.dsk with all 7 programs via Toolshed decb, 'make clean' removes artifacts. CoCo 8.3 filenames: BOUNCE, KALEIDSC, RAIN, TETRIS, RG-TEST, TYPEWRTR, SPACEWRP. Checks for decb on PATH with helpful install message.", "type": "feature", "status": "done", "priority": "medium", "file": "Makefile", "created": "2026-04-13", "updated": "2026-04-13"}, {"id": 392, "summary": "Add version constant to Forth kernel", "description": "Define KERN_VERSION in kernel.asm (e.g. EQU $0100 for 1.0) so it appears in kernel.map. fc.py and downstream projects can read it. Print or embed version in hello world output.", "type": "feature", "status": "done", "priority": "medium", "file": "forth/kernel/kernel.asm", "created": "2026-04-13", "updated": "2026-04-13"}, {"id": 393, "summary": "Add README and LICENSE to forth/", "description": "forth/ needs a top-level README.md covering: what it is, architecture (ITC, 6809), directory layout, build instructions, dependencies (lwasm, python3), hello world example. Add MIT LICENSE file. This makes forth/ a self-contained subproject that other repos (tiny-agent, space-warp) can reference.", "type": "docs", "status": "done", "priority": "medium", "file": "forth/README.md", "created": "2026-04-13", "updated": "2026-04-13"}, {"id": 394, "summary": "Verify forth/ is self-contained and builds independently", "description": "Ensure someone can clone just forth/ and build: kernel assembles, fc.py compiles hello.fs, combined.bin runs in XRoar. Check all paths are relative, no references outside forth/. Update any stale docs in kernel/README.md and tools/README.md.", "type": "task", "status": "done", "priority": "medium", "file": "forth/", "created": "2026-04-13", "updated": "2026-04-13"}, {"id": 395, "summary": "Hello world prints kernel version", "description": "Update hello.fs to display BARE NAKED FORTH followed by the kernel version (e.g. 1.0). Requires fc.py to expose KERN_VERSION as a Forth constant.", "type": "enhancement", "status": "done", "priority": "low", "file": "forth/hello/hello.fs", "created": "2026-04-13", "updated": "2026-04-13"}, {"id": 396, "summary": "Remove forth/ from tiny-agent, reference coco/forth", "description": "Delete the forth/ subdirectory from tiny-agent and update all Makefiles to reference ../coco/forth/. Assumes both repos are siblings under ~/github/.", "type": "task", "status": "done", "priority": "high", "created": "2026-04-13", "updated": "2026-04-13"}, {"id": 397, "summary": "Fix hardcoded kernel variable addresses in agent demos", "description": "Replace $0050/$00xx kernel variable references in agent demo .fs files with KVAR-* constants, same as done for coco demos (#387).", "type": "task", "status": "done", "priority": "high", "created": "2026-04-13", "updated": "2026-04-13"}, {"id": 398, "summary": "Rebuild and verify all 6 agent demos", "description": "Build all agent demos (rain, rain2, orbit, pong, critters, particles) against coco/forth kernel and verify they run in XRoar.", "type": "task", "status": "done", "priority": "high", "created": "2026-04-13", "updated": "2026-04-13"}, {"id": 399, "summary": "Remove src/spacewarp/ directory", "description": "Delete the entire src/spacewarp/ directory. Space Warp has its own repo now (space-warp). All game source, docs, marketing, sprites, archives, and tools live there. Also cleaned up leftover references: docs/reference.html memory map caption, src/sound/SOUND.md goal line, and .claude/settings.local.json dead permissions.", "type": "task", "status": "done", "priority": "high", "created": "2026-04-13", "updated": "2026-04-16"}, {"id": 400, "summary": "Remove Space Warp from top-level Makefile", "description": "Remove spacewarp from DEMOS list and the decb copy line for SPACEWRP.BIN on the disk image.", "type": "task", "status": "done", "priority": "high", "created": "2026-04-13", "updated": "2026-04-13"}, {"id": 401, "summary": "Clean CLAUDE.md — remove Space Warp content", "description": "Remove all game-specific sections: Current State (game status, app size, beam/slot scheduling), Combat Rebalance Design, Shield/Damage/Energy Model, Sprite Evaluation Tools, game-specific References (AI_DIVERSITY_STRATEGY, COMBAT_ANALYSIS, Star Trek Manual), and game-specific Feedback bullets (rnd masking, beam system, app binary overflow, maser edge noise, etc.). Keep kernel, tutorial, and general CoCo development content.", "type": "docs", "status": "done", "priority": "high", "created": "2026-04-13", "updated": "2026-04-13"}, {"id": 402, "summary": "Clean README.md — remove Space Warp content", "description": "Remove spacewarp from demo listing, remove v1.0 roadmap section, and any other Space Warp references. Realign README with Bare Naked Forth identity: kernel, tutorial, demos.", "type": "docs", "status": "done", "priority": "high", "created": "2026-04-13", "updated": "2026-04-13"}, {"id": 403, "summary": "Remove Space Warp issues from issues.jsonl", "description": "Delete all Space Warp-specific issues from issues.jsonl. Includes 45 explicit 'Space Warp:' prefixed issues plus combat/shield/sprite/Jovian issues that are purely game-specific. Keep issues that apply to the kernel, fc.py, libraries, or general infrastructure even if Space Warp motivated them.", "type": "task", "status": "done", "priority": "high", "created": "2026-04-13", "updated": "2026-04-13"}, {"id": 404, "summary": "Platform: Serial loader (bit-banged RS-232)", "description": "Bit-banged serial loader via PIA ($FF20/$FF22) for loading bytecode over RS-232 from a host PC. Enables iteration on real hardware without pulling the cartridge each cycle. Should integrate with fc.py output so cross-compiled binaries can be pushed over the wire directly.", "type": "platform", "status": "open", "priority": "medium", "created": "2026-04-16", "updated": "2026-06-16"}, {"id": 405, "summary": "Platform: ROM cartridge image", "description": "Burn kernel + loader to flash and boot from the pak slot. Non-destructive: pulling the cartridge restores a stock CoCo. Defines the final delivery mechanism from COCO_RENOVATION.md — 64K ROM for toolchain, 64K RAM reserved for user programs. Needs the serial loader (#404) first so we can iterate on the flashable image.", "type": "platform", "status": "open", "priority": "medium", "created": "2026-04-16", "updated": "2026-06-16"}, {"id": 406, "summary": "Platform: RP2350 co-processor", "description": "One RP2350 core sits on the 6809 bus, the other manages storage, networking, and services. Modernizes the CoCo without emulating it. Downstream of the ROM cartridge (#405) since the cart is the delivery vehicle for the co-processor interface. UPDATE 2026-05-06: a prototype board called \"Centipede\" — designed by Henry Strickland — implements the hardware side of this concept and is en route. Promotes this from speculative to concrete: once the board arrives, the project gets a real RP2350 co-processor target to design protocols, drivers, and on-board services against.", "type": "platform", "status": "icebox", "priority": "high", "created": "2026-04-16", "updated": "2026-06-16"}, {"id": 407, "summary": "Tutorial flow audit — re-read all 13 chapters against current kernel", "description": "The tutorial was written when the kernel was smaller. Since then we've added KCODE, beam/sprite libraries, ~30 new primitives, CODE blocks, sound lib, inline constants, and more. Walk through chapters 1–13 end-to-end, verify each example still builds, fix stale references, and smooth transitions where new material has made the old flow rough.\n\nClosed 2026-10-12 at partial scope under the close-at-80% rule. No progress notes were ever recorded here (last touched 2026-07-01), so the only audited work that can be traced is chapter 13: LOADM instead of CLOADM, ROM-mode addresses, tutorials/ paths, links to the demo gallery and DSK guide, committed as #574 (99dbc60). There is no evidence chapters 1-12 were rechecked. That remainder is filed as #575.", "type": "docs", "status": "done", "priority": "medium", "file": "tutorials/13-onto-your-coco/index.html", "created": "2026-04-16", "updated": "2026-10-12"}, {"id": 408, "summary": "Demo appendix — featured page per demo in tutorial", "description": "Add an appendix section to docs/tutorial.html featuring each demo (Tetris, Kaleidoscope, Rain, Bounce, RG-test, Typewriter, Calculator). Each page: screenshot, what it demonstrates, key toolchain features it exercises, performance notes, source listing or link. Companion to the embedded XRoar runner (#409).", "type": "docs", "status": "done", "priority": "medium", "file": "tutorials/demos/index.html", "created": "2026-04-16", "updated": "2026-07-01"}, {"id": 409, "summary": "Embed runnable XRoar (WASM) inside HTML docs", "description": "Click-to-run each demo inline in the tutorial and demo appendix. XRoar has a WebAssembly build; host the WASM + ROMs + compiled .bin files alongside the HTML so tutorial readers can play Tetris, run Kaleidoscope, type on the typewriter etc. without installing anything. Biggest lift in the docs track but the highest-leverage feature for promoting the toolchain.", "type": "docs", "status": "open", "priority": "high", "file": "docs/", "created": "2026-04-16", "updated": "2026-04-16"}, {"id": 410, "summary": "Host docs as a static website", "description": "Once XRoa
