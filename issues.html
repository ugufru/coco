LT is still a kernel primitive.\n- Fixed ch0: 'roughly 100 bytes of 6809 assembly' is now 'about 4 KB'.\n- make site re-run so site/tutorials carries the new bins and the ch0 fix.\nREMAINING: run ch2-11 examples in XRoar; read ch1-12 end to end for flow where newer material (KCODE, CODE blocks, inline constants, libraries) makes the old progression rough. The grep pass cannot catch that.\n\nCLOSED 2026-10-12.\n- Run-tested in XRoar coco2bus: all 12 rebuilt examples produce the expected screens (ch8 yorn and ch10 calc driven by osascript key input).\n- A full read of ch0-12 (subagent, verified by hand where it mattered) found 14 problems. FIXED here:\n  ch11 DIVIDER code was broken (HBAR got 2 of its 3 args, then OVER/DROP underflowed); rewritten with only DUP/SWAP/DROP and run-tested in XRoar.\n  ch9 tip said NEGATE/?DUP/U./. are not in the kernel; NEGATE and ?DUP are now kernel primitives and lib/print.fs has U. and . (user definitions shadow kernel words: tools/fc.py resolve checks word_cfa before kwords). Tip reworded. Also 'from Chapter 2' -> 'from Chapters 3 and 4'.\n  ch12 prose said the seed adds 7; the code adds 3 (both spots fixed).\n  ch1 'real hardware in Chapter 11' -> 13; run.sh listing now called a simplified version.\n  ch0 described token-threading via a kernel dispatch table; the kernel is ITC with bare CFA addresses. Reworded.\n  ch6 DIY '0 0 DO' question had no right answer (it runs 65,536 times); answer added. Rule box for I now says it works from called helpers too.\n  ch10 now says + and * need SHIFT on the CoCo keyboard.\n- make site re-run.\nREMAINDER filed as #577.", "type": "docs", "status": "done", "priority": "medium", "file": "tutorials/", "created": "2026-10-12", "updated": "2026-10-12"}, {"id": 576, "summary": "Rebuild stale demo binaries and build/demos.dsk against the current kernel", "description": "Found 2026-10-12: eleven tracked demo .bin files were deleted from the working tree (likely a make clean with no rebuild), and the rest were linked against a pre-2026-06-20 kernel. Commit 5977c58 (#535/#536, colored RG6 text) added VAR_RGCOLMASK and an ANDA to kernel/kernel.asm, which grew the kernel by 4 bytes; only colored-text.bin was rebuilt at the time. Fixed by PATH=~/bin:$PATH make dsk, which rebuilt the ROM-mode kernel, all 15 demos and build/demos.dsk (14 programs). Result: 13 .bin files grew by 4 bytes (vdg-modes by 12; the extra 8 bytes were not traced), exec is $2981 throughout, colored-text.bin and clock.bin came out byte-identical to the committed copies. Build verified; the rebuilt demos were NOT run in XRoar.", "type": "chore", "status": "done", "priority": "low", "file": "src/", "created": "2026-10-12", "updated": "2026-10-12"}, {"id": 577, "summary": "Tutorial polish: example files out of sync with prose, ch12 RND and screen mock, define-before-use wording", "description": "Remainder of #575 (tutorial audit, closed 2026-10-12). Lower-severity findings from the ch0-12 read that were not fixed there:\n1. Example .fs files do not match the prose programs. ch1 hello.fs prints HI but the prose (01-meet-your-stack/index.html ~156) says to save '65 EMIT HALT' and see A. ch2 title.fs prints COLOR FORTH with 11 dashes; prose (~185-204) prints BARE NAKED FORTH with 16. ch3 letter.fs defines COLOR/FORTH; prose (~144-172) defines BARE/NAKED/FORTH. ch11 screen.fs uses COLOR FORTH at col 10; prose (~157-190) uses BARE NAKED FORTH at col 8. Decide which side is canonical (the prose title 'BARE NAKED FORTH' is probably newer) and sync; rebuild the .bin files and re-run make site.\n2. ch12 (~62) says 'The CoCo has no clock, so we use the player's own keypress'. The kernel now has RNG/RND primitives (tools/fc.py ~111, kernel.asm ~1241-1287) and lib/rng.fs. At least mention RND; note RND only gives power-of-two ranges (kernel.asm ~1261), which is why 1-9 still needs /MOD.\n3. ch12 mid-game screen mock (~238-249) shows 'GUESS: 9', but .PROMPT's trailing spaces overwrite the digit on the next loop, and the mock omits the PRESS ANY KEY line that is never cleared. Correct the mock (check in XRoar).\n4. ch2 (~167) and ch3 (~194-198) state define-before-use as a hard rule; fc.py is two-pass and accepts forward references. Reword as Forth convention that a real Forth system enforces.\n5. ch8 (~180-185) implies KEY? is unavailable; it is a kernel word with non-standard effect ( -- char|0 ).\n6. ch9/10/12 examples still define NEGATE and ?DUP themselves (calc.fs:3-4, guess.fs:3-4). Harmless (user words shadow kernel words) and arguably good teaching; decide whether to keep.", "type": "docs", "status": "open", "priority": "low", "file": "tutorials/", "created": "2026-10-12", "updated": "2026-10-12"}, {"id": 578, "summary": "SG6 follow-up: confirm T1 has no SG6 on real hardware; port or retire tools/sg6_*.py", "description": "Remainder of #573 (closed 2026-10-12). XRoar shows that the CoCo 2B's MC6847T1 stays in SG4 with $FF22 bit 4 set (it uses that bit for lowercase), while a plain 6847 gives SG6 with blue/red (CSS=0) or magenta/orange (CSS=1). See coco-guides/vdg-modes.md, Semigraphics-6.\n1. Confirm on real hardware. On a CoCo 2B (T1), and if available a CoCo 1/2 with a plain 6847, run the probe: fill $0400-$04FF with $8C and $0500-$05FF with $CC, then set $FF22 bit 4 (and try CSS, bit 3). Top half of each cell lit in green/buff = SG4; a thin middle-third band in blue/red or magenta/orange = SG6. Record the result in vdg-modes.md and remove its 'Not yet confirmed on real hardware' line.\n2. Decide what to do with tools/sg6_art.py, sg6_deathstar.py, sg6_pittsburgh.py, sg6_sunset.py, sg6_weather.py and sg6_yoda.py (drawn 2026-09-17 on the wrong premise). Options: redraw as SG4 64x32 for the terminal (r2d2.py and src/vader show the format; SG4 gets 8 colours per cell at half the vertical resolution), keep them as plain-6847 SG6 art with the palette corrected, or delete them. Each currently carries a CORRECTION note in its docstring.", "type": "chore", "status": "open", "priority": "low", "file": "tools/", "created": "2026-10-12", "updated": "2026-10-12"}, {"id": 579, "summary": "SN76489 (GameMaster) music demo: Bach Badinerie, 3 voices + noise percussion", "description": "New demo in src/sound-sn76489/. Plays Bach's Badinerie (Orchestral Suite No. 2 in B minor, BWV 1067, last movement) on the SN76489 sound chip, as exposed by the GameMaster cartridge in XRoar (-cart gmc) and the xroar-waveshare-rp2350-pizero.\nHardware facts (from ~/github/xroar/src/gmc.c:183-207): a write to any odd address in $FF40-$FF5F (P2 select) goes to the SN76489, so use $FF41. Even addresses switch the GMC ROM bank. XRoar clocks the chip at 4 MHz (gmc.c:170). $FF41 is also the Becker port status, so this demo and the Becker terminal (src/terminal) cannot share a session.\nPlan: (1) hand-transcribe from the public-domain Bach-Gesellschaft score (IMSLP #01467, BWV1067.pdf); (2) write a Python converter that takes the transcription as 3 tone voices (flute melody, bass, one inner part), quantises to 60 Hz frames, converts notes to 10-bit SN76489 dividers (N = 4000000 / (32 * f)), and emits a compact 'wait N frames, write these bytes' stream; (3) add a light percussion pulse on the noise channel (Bach wrote none, so it is an arrangement choice); (4) write a Forth player that syncs to vsync and writes the stream to $FF41, with data spliced in via DATA[PY]; (5) optional SG4 visualiser.\nPiece chosen 2026-10-14 over the Brandenburg Concertos (too dense for 3 voices) as the most recognisable short fast Bach movement that suits percussion. A Three-Part Sinfonia (BWV 787-801) is the suggested second track, to be filed separately.\nProgress 2026-10-14: Mutopia has no BWV 1067 (its ftp/BachJS skips 1056 to 1068; search for Badinerie finds nothing), so Paul chose hand transcription. IMSLP downloads sit behind a captcha bot check, so the score PDF has to be fetched by hand. Pipeline built and running in XRoar with a 4-bar TEST PASSAGE (not Bach): src/sound-sn76489/sn76489.py (text score -> stream, format in its docstring), badinerie.py (score + drum pattern, writes build/badinerie.snd), badinerie.fs (vsync player, per-channel volume envelope in Forth, no CODE words), Makefile (make run adds -cart gmc). Verified: builds (1148 B app), banner shows, stream runs to the end and returns to BASIC. Not verified by me: the sound (XRoar has no WAV output). Next: transcribe the real notes, then tune peaks/envelopes by ear.\nProgress 2026-10-14 (2): full transcription in badinerie.py from BGA vol. 31, IMSLP #01467 pp. 15-16 (Paul downloaded the PDF; it is not checked in). Flute, violin II and continuo, both halves with repeats: 85.9 s, 456/238/372 note-ons. Pitches were read with a scratch notehead finder (local staff-line fit, because page 16 is scanned with a curve) plus visual checks of every ledger-line note; rhythms read by eye. Editorial: trills played plain, B17 grace note as a long appoggiatura, B8 flute C natural (print has no sign, bass is a marked C natural 4/2). 17 bass notes below B2 lifted an octave. Stream gained $E8 mark / $E9 repeat-once so each half is stored once: 2906 B stream, 3867 B app (ROM mode). Simulated walk of the stream gives the expected 5152 frames; runs in XRoar with -cart gmc. NOT yet heard: expect a few wrong notes from misreads; fixes are one-token edits in badinerie.py.\nFix 2026-10-14: first listen was silent. Cause: the kernel init leaves PIA0 CA2/CB2 and PIA1 CB2 as inputs, so the analog mux has no source and sound is disabled (xroar src/dragon/dragon.c update_sound_mux_source: source = CB2(PIA0)<<1 | CA2(PIA0); 2 = SOURCE_CART). badinerie.fs now runs cart-audio: $34->$FF01, $3C->$FF03, $3C->$FF23. Any future SN76489/GMC code needs the same; worth a lib word.\nClosed 2026-10-14: Paul listened in XRoar (-cart gmc) and confirmed it plays. Not checked note by note against a reference recording. Remainder filed: #581 cart-audio lib word, #582 arrangement polish (trills, envelopes, balance, loop), #583 visualiser, #584 Three-Part Sinfonia second track.", "type": "feature", "status": "done", "priority": "medium", "file": "src/sound-sn76489/", "created": "2026-10-14", "updated": "2026-10-14"}, {"id": 580, "summary": "YMF262 (OPL3) FM sound on the MEGA mini MPI (MMMPI): driver words + demo", "description": "Support the Yamaha YMF262 (OPL3) built into Ed Snider's (Zippster) MEGA mini MPI. No issue existed (checked 2026-10-14). Follows #579 (SN76489 / GameMaster Badinerie).\nHardware facts from the MEGAmini manual (https://thezippsterzone.com/wp-content/uploads/2018/12/MEGAmini-manual.pdf):\n- The OPL3 is a virtual MPI slot. Set /SCS to virtual slot 5 in the MPI register $FF7F (low nibble = 0100) before touching it. Preserve the /CTS bits (high nibble) and restore $FF7F afterwards so a CoCoSDC or disk cart in a real slot keeps working.\n- Ports (slot 5): $FF50 port 0 register select (read = status), $FF51 port 0 data, $FF52 port 1 register select, $FF53 port 1 data, $FF54 read or write = chip reset ('initial clear').\n- Chip clock 14.318 MHz. Needs 32 chip clocks (~2.2 us) after a register select before the data write: one NOP at 0.89 MHz, about 4 cycles at 1.79 MHz (Zippster's OPL3 article, thezippsterzone.com 2018-12-01). Forth is slow enough by itself; a CODE write word must keep the gap.\n- Cart-port audio: the MMMPI has an analog switch choosing which source drives the cartridge SND line. Extended features register $FF42 at virtual slot 16 ($FF7F low nibble = 1111), bits 2..0: 000-011 = slots 1-4, 100 = YMF262. Default is slot 1. The CoCo side then needs the same mux setup as #579's cart-audio word ($34->$FF01, $3C->$FF03, $3C->$FF23). The MMMPI also has a stereo line-out jack (amplified devices only) carrying the OPL3 directly.\n- Note $FF50-$FF5B are UART B registers at virtual slot 6 and $FF40-$FF45 are the extended MPI registers at slot 16: the same addresses mean different things depending on $FF7F.\nTesting: XRoar (~/github/xroar) has no OPL3 or MMMPI emulation (checked 2026-10-14), so this needs real hardware, or emulator support added in the xroar project (out of scope here).\nScope: (1) lib words: slot select/restore, opl! ( reg data -- ) for both register arrays, reset, audio routing; (2) small demo (a scale, then a few FM patches); (3) optionally an OPL3 back end for the src/sound-sn76489 score format, so the Badinerie can play as FM.\nReferences: MEGAmini manual (above); Yamaha YMF262 datasheet (archive.org/details/yamaha-ymf-262-opl-3); Programmer's Guide to Yamaha YMF262/OPL3 (fit.vutbr.cz/~arnost/opl/opl3.html); exileinparadise.com MEGA mini MPI page.", "type": "feature", "status": "open", "priority": "medium", "file": "lib/", "created": "2026-10-14", "updated": "2026-10-14"}, {"id": 581, "summary": "lib/sn76489.fs: SN76489 chip words and song stream player", "description": "Remainder of #579. The kernel init leaves PIA0 CA2/CB2 and PIA1 CB2 as inputs, so cartridge sound is muted; src/sound-sn76489/badinerie.fs has a private cart-audio word ($34->$FF01, $3C->$FF03, $3C->$FF23; mux source = CB2(PIA0)<<1 | CA2(PIA0), 2 = cartridge per xroar src/dragon/dragon.c:1366). Move it (plus sn! for $FF41 and a silence word) into a lib file, e.g. lib/sn76489.fs, and use it from badinerie.fs. #580 (OPL3 on the MEGA mini MPI) needs the same CoCo-side routing. Consider a matching word that restores the DAC route on exit. Scope widened 2026-10-14 at the user's request: the library also carries the player (the stream walker, mark/repeat, per-channel envelope with sn-lvl/sn-dmask/sn-floor tables) so a demo is just its song data, banner and main loop. Public words: sn!, sn-silence, cart-audio, sn-tone, sn-vol, sn-noise, sn-start, sn-frame, sn-play. Stream format stays as documented in src/sound-sn76489/sn76489.py. DONE 2026-10-14: lib/sn76489.fs written (chip words + player), badinerie.fs and src/jukebox use it; user heard both play in XRoar. reference.html section left to #589.", "type": "chore", "status": "done", "priority": "low", "file": "lib/", "created": "2026-10-14", "updated": "2026-10-14"}, {"id": 582, "summary": "Badinerie arrangement polish: trills, envelopes, balance, loop mode", "description": "Remainder of #579. In src/sound-sn76489: (1) realise the trills now played plain (bars A8, A10, B11, B14, B16 in badinerie.py) as short 32nd alternations; (2) tune PEAKS in badinerie.py and lvl/dmask/floor in badinerie.fs by ear (flute vs violin II vs bass balance, decay speed); (3) drum pattern variety (e.g. drop hats in the quiet B-section piano passages B2-B10 and B18-B20 where the score marks piano); (4) optional loop until BREAK (Paul replayed it several times by relaunching). Also listen for transcription slips: pitches were read by script plus visual checks and nobody has compared against a reference performance; fixes are single-token edits.", "type": "feature", "status": "open", "priority": "low", "file": "src/sound-sn76489/", "created": "2026-10-14", "updated": "2026-10-14"}, {"id": 583, "summary": "Badinerie visualiser: SG4 per-voice bars or piano roll", "description": "Remainder of #579. The demo shows a static text banner. Add a light visual driven by the player state: three SG4 level bars from lvl (one colour per voice) or a scrolling piano roll. Budget: the player loop runs once per vsync in plain Forth; measure with fc.py --cycles before adding per-frame drawing.", "type": "feature", "status": "open", "priority": "low", "file": "src/sound-sn76489/", "created": "2026-10-14", "updated": "2026-10-14"}, {"id": 584, "summary": "Second SN76489 track: a Bach Three-Part Sinfonia (BWV 787-801)", "description": "Remainder of #579. The Sinfonias are natively three voices, one per tone channel, so no reduction is needed. Mutopia has them (Inventions collection) with public-domain or CC MIDI, so this one can be imported from MIDI rather than hand transcribed: add a MIDI-to-score path alongside sn76489.py. No percussion (contemplative pieces); suggested No. 2 in C minor or No. 11 in G minor. Needs a track select in the player or a second binary. DONE 2026-10-14 via #595: Sinfonias 2 (BWV 788) and 11 (BWV 797) imported from Mutopia MIDI with midi2sng.py and play in the jukebox (src/jukebox), which serves as the track select.", "type": "feature", "status": "done", "priority": "low", "file": "src/sound-sn76489/", "created": "2026-10-14", "updated": "2026-10-14"}, {"id": 585, "summary": "Badinerie: replay on a key press instead of quitting to BASIC", "description": "src/sound-sn76489/badinerie.fs played the piece once and then called exit-basic. Change: when the song ends the player silences the chip, shows 'ANY KEY  PLAY AGAIN / BREAK  QUIT', waits for all keys to be released and then for a new key. Any key restarts from the top (stream pointer, wait, tick, repeat state and channel levels all reset); BREAK (KEY? = 3) quits to BASIC. BREAK during playback still quits at once. Requested 2026-10-14 ('play it again sam'). This covers the replay half of the 'loop until BREAK' item in #582; automatic looping without a key press is not done. DONE 2026-10-14: user confirmed replay on the CoCo Zero (jukebox, which uses the same any-key / BREAK prompt as badinerie.fs).", "type": "feature", "status": "done", "priority": "low", "file": "src/sound-sn76489/badinerie.fs", "created": "2026-10-14", "updated": "2026-10-14"}, {"id": 586, "summary": "lib/decb.fs: bespoke DECB disk file READ library (WD17xx, no ROM)", "description": "Our own Forth library to read files from a DECB (RS-DOS) floppy without Disk BASIC or its $0600-$0DFF workspace (that range is our RG6 VRAM reservation). No third-party code: ~/github/DECB_Disk_File_Library (a 6809 asm library) is a REFERENCE ONLY for the WD17xx command sequence, the HALT/NMI transfer, and the FAT/directory rules; do not copy it. Design (agreed 2026-10-14): Forth everywhere except where timing matters. CODE words: sector-read ( buf track sector drive -- status ) moving 256 bytes from the WD17xx data register ($FF4B) using the DRQ/HALT technique with INTRQ ending the transfer via NMI; save/restore the $0109 NMI trampoline around transfers. Forth: drive select/motor latch ($FF40), restore/seek commands ($FF48 command/status, $FF49 track, $FF4A sector), filename parse NAME.EXT:D into 8+3, FAT read (track 17 sector 2, 68 granules, each 9 sectors, $C0-$C9 = last granule with sector count), directory search (track 17 sectors 3-11, 32-byte entries, last-sector byte count), sequential open-read / read-byte / close-read and load-file ( addr name -- len ). Errors returned as numbers. Test in XRoar with a disk controller cart against a .dsk built with ~/bin/decb. Write support is #587; song-file use is #588. DONE 2026-10-14: lib/decb.fs reads files with no Disk BASIC code or RAM: CODE words _dk-nmi-on/_dk-nmi-off/_dk-read (HALT transfer, NMI exit), everything else Forth (latch, restore/seek with retries, name parse, FAT, directory, dk-entry, dk-open, dk-open-fname, dk-getc, dk-load, dk-load-open with a size cap, error 9 too big). src/decb-test passes all checks under -cart rsdos and under an mpi; the jukebox loads songs with it. Not done: CoCo 3 NMI vector (#593), write side (#587).", "type": "feature", "status": "done", "priority": "medium", "file": "lib/decb.fs", "created": "2026-10-14", "updated": "2026-10-14"}, {"id": 587, "summary": "lib/decb.fs: DECB disk file WRITE support", "description": "Follow-on to #586 (read side). Add sector-write (CODE, DRQ/HALT like sector-read), free-granule allocation from the FAT, and sequential open-write / write-byte / close-write plus a save-file ( addr len name -- err ). Data sectors first, then FAT, then directory entry last, so an abandoned or failed write never publishes a partial file. Refuse to overwrite an existing file (or add an explicit kill/delete word). Check write-protect status. ~/github/DECB_Disk_File_Library is a behavioural reference only, no copied code.", "type": "feature", "status": "open", "priority": "low", "file": "lib/decb.fs", "created": "2026-10-14", "updated": "2026-10-14"}, {"id": 588, "summary": "SN76489 player: load songs (.SNG) from disk instead of embedding them", "description": "Depends on #586. Song streams (format in src/sound-sn76489/sn76489.py) are relocatable: the player only holds a pointer and the repeat mark is captured at run time. Build raw .SNG files (no DECB header) plus the player onto build/songs.dsk with decb, have the player load a chosen song into the heap ($5A00, ~7.5 KB free below TRIG_BASE) using lib/decb.fs, then play it; ideally list the .SNG files on the disk as a menu and return to it after the play-again prompt (#585). Hardware note: the FDC ($FF40, $FF48-$FF4B) and the GameMaster SN76489 (odd addresses $FF40-$FF5F) overlap, so with a Multi-Pak select the disk slot via $FF7F to load, then the GameMaster slot to play (same $FF7F handling as #580). XRoar test needs an mpi cart with both a disk cart and gmc; confirm XRoar supports that combination. If direct SD card file access lands first (no .dsk), use that instead. DONE 2026-10-14: src/jukebox lists .SNG files via dk-entry, loads into $5A00 (max $1E00), plays with sn-play, switching the Multi-Pak I/O slot at $FF7F (disk-io 0, sound-io 1; ROM slot stays on the disk cart). make run uses -cart mpi -mpi-load-cart 0=rsdos -mpi-load-cart 1=gmc. User confirmed it plays. One unexplained early run auto-picked song A without a key press; not reproduced after cleanup.", "type": "feature", "status": "done", "priority": "low", "file": "src/sound-sn76489/", "created": "2026-10-14", "updated": "2026-10-14"}, {"id": 589, "summary": "reference.html: document lib/sn76489.fs words", "description": "Remainder of #581. lib/sn76489.fs (SN76489 chip words sn!, sn-silence, cart-audio, sn-tone, sn-vol, sn-noise; player sn-start, sn-frame, sn-play; envelope tables sn-lvl, sn-dmask, sn-floor) is covered by the auto-generated lib/README.md but has no section in reference.html, which is the official library reference. Add one with a short usage example (song sn-play, and the sn-start + vsync + sn-frame loop) and a pointer to the stream format in src/sound-sn76489/sn76489.py. Consider moving sn76489.py itself to tools/ once a second song or demo uses it. FOLDED 2026-10-26 into #637, which brings the whole library reference up to date in one pass.", "type": "docs", "status": "closed", "priority": "low", "file": "reference.html", "created": "2026-10-14", "updated": "2026-10-26"}, {"id": 590, "summary": "Badinerie: crisper percussion (short gated hits instead of long noise decays)", "description": "User feedback 2026-10-14: the drums sound like 'children marching through autumn leaves'. Cause: the hats already use the brightest SN76489 noise (white, rate N/512) but the player's envelope decays channel 3 by one 2 dB step per frame from attenuation 9-11, so each hat is ~100 ms of hiss; the kick (white, N/2048, attenuation 3) is ~200 ms of low crunch. Fix: add an optional gate (in frames) to drum events in sn76489.py stream(), emitting a channel-3 off ($FF) that many frames after the hit, and give hats a 1-2 frame gate at a louder level and the kick a ~3 frame gate. Keeps the per-channel envelope untouched. Related polish (fewer hats in piano passages) stays in #582. DONE 2026-10-14: drum hits gated (hats 2 frames, kick 3 frames) via an optional gate field in sn76489.py drums; user: 'sounds a bit better'. Periodic-noise kick not tried; stays with #582 polish.", "type": "feature", "status": "done", "priority": "low", "file": "src/sound-sn76489/badinerie.py", "created": "2026-10-14", "updated": "2026-10-14"}, {"id": 591, "summary": "kernel: PICK off by one (0 PICK returned n, not DUP)", "description": "Found 2026-10-14 while building the jukebox (#588): lib/decb.fs dk-entry used 2 PICK and hung. CODE_PICK in kernel/kernel.asm loaded the cell at U + 2n, but U still points at the n cell itself, so n PICK returned the item one shallower than documented (0 PICK returned n, 1 PICK returned the old top). reference.html and the kernel comment both promise 0 PICK = DUP, 1 PICK = OVER. Nothing in the repo used the kernel PICK (tutorials/12 defines its own PICK word for the guessing game), so nothing depended on the bug. Fix keeps the primitive at 6 bytes so no kernel address moves and committed demo binaries stay valid: LDB 1,U / INCB / ASLB / LDD B,U. The 8-bit signed offset limits n to 0-62, noted in the comment and reference.html. Rebuild both kernels (make, make allram). DONE 2026-10-14: verified on target (11 22 33 2 PICK gives 11, 0 PICK gives the top); both kernels rebuilt, kernel.map symbols unchanged. The jukebox hang that led here was actually #592, but the PICK bug was real.", "type": "bug", "status": "done", "priority": "high", "file": "kernel/kernel.asm", "created": "2026-10-14", "updated": "2026-10-14"}, {"id": 592, "summary": "fc.py: warn when a definition shadows a kernel primitive or an earlier word", "description": "Found 2026-10-14 (#588). src/jukebox/jukebox.fs defined a menu word `pick` (wait for a key). Names are case-insensitive and fc.py resolves every reference against the whole program at the end, not in definition order, so that later `pick` silently replaced the kernel PICK everywhere, including inside lib/decb.fs (dk-entry uses 2 PICK), which then sat waiting for a keypress. No error, no warning; it took a bisection to find. Fix: have fc.py warn (or error) when a colon definition, VARIABLE, CONSTANT, DATA or CODE name collides case-insensitively with a kernel primitive or with any earlier definition, naming both sites. Consider whether resolution should become definition-order (classic Forth) instead. Known existing shadow to check before turning it into an error: tutorials/12-the-guessing-game defines its own PICK. Done 2026-10-26: tokenize() now tags each token with its file:line (class Tok, a str subclass), and parse() takes the kernel word names and warns on stderr when a colon definition, VARIABLE, CONSTANT, +FIELD/CFIELD:/FIELD:, CODE, KCODE or DATA[PY name is a kernel primitive's or was defined earlier, naming both sites. The same site twice (one file INCLUDEd twice, e.g. lib/screen.fs and lib/vdg.fs in several demos) does not warn. Kept as warnings, not errors, because some shadows are deliberate: lib/rg-text.fs and src/bounce replace the kernel rg-char (the only warnings left in a full demo build), and tutorial 9/10/12 build their own NEGATE and ?DUP, which chapter 9 explains. Resolution stays whole-program rather than definition-order; the warning covers the trap without changing what any program compiles to (every demo rebuilt byte-identical). Tutorial 12's PICK renamed CHOOSE (guess.fs, index.html, with a paragraph on why); guess.bin rebuilt and run in XRoar to CORRECT. build/tutorial.dsk rebuilt (the tracked one predated the #575 binaries). Documented in tools/README.md, reference.html (compiler tip), chapter 9's tip and CLAUDE.md.", "type": "bug", "status": "done", "priority": "medium", "file": "tools/fc.py", "created": "2026-10-14", "updated": "2026-10-26"}, {"id": 593, "summary": "lib/decb.fs: CoCo 3 support (NMI vector at $FEFD)", "description": "Remainder of #586. _dk-nmi-on/_dk-nmi-off patch the CoCo 1/2 RAM NMI trampoline at $0109. On a CoCo 3 the trampoline is at $FEFD (GIME vector RAM, which must be enabled), detected in the reference library by $FFFE holding $8C1B. Add the detection, test under xroar -machine coco3, and make sure the transfer runs at normal speed ($FFD8) for WD timing. Also worth measuring: dk-load copies each sector through dk-buf with CMOVE; reading full sectors straight into the destination would roughly halve load time. Finding 2026-10-15: src/jukebox (lib/decb.fs unchanged, patching only the $0109 trampoline) loads songs fine on XRoar -machine coco3 with an MPI and the rsdos cart (make run3 in src/jukebox), so on that setup the CoCo 3's $FEFD NMI vector reaches $0109. The NMI part of this issue may be unnecessary; confirm on real CoCo 3 hardware before closing. Faster loads are still open.", "type": "feature", "status": "open", "priority": "low", "file": "lib/decb.fs", "created": "2026-10-14", "updated": "2026-10-15"}, {"id": 594, "summary": "Jukebox as a self-contained autorun disk for the CoCo Zero", "description": "Put JUKEBOX.BIN on build/songs.dsk ahead of the .SNG files so a CoCo Zero with autorun on (run drive 0's first program, see ~/github/xroar-waveshare-rp2350-pizero AUTORUN.md) boots straight into the menu. Read from that project's source (lib/coco_machine/src/cart_gmc.h, coco_machine.cpp; read only): with a disk in, the SN76489 answers at the odd latch mirrors ($FF41 etc.), the latch at $FF40 and the WD at $FF48-$FF4B go to the FDC, $FF60-$FFBF is open bus so the jukebox's $FF7F writes are ignored, and reads complete instantly with NMI after the 256th byte. So no Multi-Pak is needed there. Copy the disk to the card as /coco/dsk/JUKEBOX.DSK. Makefile: songs.dsk now depends on jukebox.bin instead of the other way round. DONE 2026-10-14: user confirmed the jukebox runs on the CoCo Zero from /coco/dsk/JUKEBOX.DSK in drive 0, with sound and disk sharing the bus and no Multi-Pak.", "type": "feature", "status": "done", "priority": "low", "file": "src/jukebox/Makefile", "created": "2026-10-14", "updated": "2026-10-14"}, {"id": 595, "summary": "Song pack: MIDI to .SNG importer and 4-9 more jukebox songs", "description": "User request 2026-10-14: 4-9 more songs for the jukebox, from free MIDI transcriptions rather than hand transcription. Plan: a dependency-free MIDI reader in src/sound-sn76489 (midi2sng.py) that maps notes onto the three SN76489 tone channels (top voice ch0, bass ch2, an inner voice ch1; polyphony beyond three is reduced), times events in 60 Hz frames from the MIDI tempo map, and writes the existing stream format via sn76489.py. Sources: Mutopia Project (public domain or CC licensed, MIDI alongside LilyPond); record each piece's Mutopia id, license and URL. Each .SNG must fit the jukebox's $1E00 (7680 byte) load area. Add the songs to build/songs.dsk. Covers #584 (a Bach Sinfonia via MIDI). DONE 2026-10-14: src/sound-sn76489/midi2sng.py (own SMF reader, tempo map to 60 Hz frames, nearest-pitch channel allocation, inner notes dropped beyond three) and make songs. Eight public-domain Mutopia Bach MIDIs in src/sound-sn76489/midi (SOURCES.md has URLs and licences): Inventions 4, 8, 10, 13; Sinfonias 2, 11; WTC I Prelude 1; Air BWV 1068. Inventions 1 and 6 skipped (CC BY-SA). All on the jukebox disk with the Badinerie, 9 songs; user confirmed all play on the CoCo Zero. Not done: per-song envelope (the Air is all held notes), bass below B2 still lifted an octave; see #582.", "type": "feature", "status": "done", "priority": "medium", "file": "src/sound-sn76489/", "created": "2026-10-14", "updated": "2026-10-14"}, {"id": 596, "summary": "Jukebox sometimes picks a song with no key pressed (unconfirmed)", "description": "Seen twice in XRoar (2026-10-14, under -cart mpi with rsdos + gmc): straight after the menu drew, it went to LOADING without a key being sent by the session (once song A with one song listed, once song C, INVENT04, with nine). The user may have pressed the key; not confirmed. If real, suspects: KEY? (kernel KEY_SCAN masks only the joystick comparator bit, so a joystick fire button or a stray row bit reads as a key: row bit 1 in column 0 maps to H, which is in range once 8+ songs are listed), or a key event XRoar replays on focus. fresh-key in src/jukebox/jukebox.fs waits for release then press, so a held key is not the cause. Reproduce with no human at the keyboard, then capture which code KEY? returned.", "type": "bug", "status": "open", "priority": "low", "file": "src/jukebox/jukebox.fs", "created": "2026-10-14", "updated": "2026-10-15"}, {"id": 597, "summary": "Write SNG-FORMAT.md: spec for the .SNG song stream", "description": "The .SNG format (SN76489 song stream played by lib/sn76489.fs, produced by src/sound-sn76489/sn76489.py and midi2sng.py, loaded by src/jukebox) was documented only in the sn76489.py docstring and a short comment in lib/sn76489.fs. Write src/sound-sn76489/SNG-FORMAT.md as the standalone spec: byte codes, chip command encoding, the player's interpretation (volume bytes set an envelope level; envelope tables), mark/repeat semantics and limits, timing model, relocatability, size limits, an annotated real excerpt. Point the code comments at it. reference.html coverage stays with #589. Format v2 ideas (header with title and envelope) are not part of this. Done 2026-10-14: SNG-FORMAT.md written (byte codes, chip command layout, pitch formula, envelope tables and defaults, timing and command order, one-level repeats, ending, size and placement, a worked decode of the first and last bytes of BADINERI.SNG, tools, and v2 ideas suggesting a reserved $EA-$EF byte as a version mark). Pointers added in sn76489.py, lib/sn76489.fs and src/sound-sn76489/README.md. User reviewed and approved.", "type": "docs", "status": "done", "priority": "low", "file": "src/sound-sn76489/SNG-FORMAT.md", "created": "2026-10-14", "updated": "2026-10-14"}, {"id": 598, "summary": "lib/vgm.fs: play VGM files on the SN76489, and VGM support in the jukebox", "description": "Play VGM (Video Game Music) files on the SN76489 directly, alongside our own .SNG format (src/sound-sn76489/SNG-FORMAT.md, which stays as the compact format for our songs). VGM is the common export for SN76489 music (Sega Master System / Game Gear logs, Furnace and DefleMask tracker exports). Plan: a new lib/vgm.fs built on sn! from lib/sn76489.fs, and the jukebox (src/jukebox) listing and playing .VGM files as well as .SNG. Format notes (from memory, check against the VGM spec before coding): header magic 'Vgm ' at $00; all header fields are 32-bit little-endian, so byte-swap on the 6809; SN76489 clock at $0C; loop offset at $1C (relative to $1C); data offset at $34 (relative to $34) from version 1.50, data at $40 before that. Commands: $50 dd = write dd to the SN76489 (send via sn!); $61 nnnn = wait n samples at 44.1 kHz; $62 = wait 735 (one 60 Hz frame); $63 = wait 882 (one 50 Hz frame); $7n = wait n+1 samples; $66 = end. Accumulate waits as a sample count and play one 60 Hz frame per 735 samples, so 50 Hz tunes come out right. Skip other chips' commands by their spec lengths (Game Gear stereo $4F dd and YM2413 $51 aa dd turn up in real SMS files). No envelope: VGM writes every volume change, so the player sends volume bytes straight to the chip, unlike sn-frame. Looping: VGM loops forever from the loop offset; the jukebox should play to the end, play the looped section once more, and stop. Pitch: most VGMs are clocked at 3579545 Hz and our chip runs at 4 MHz, so unchanged playback is about 2 semitones sharp. Track the last latched register (VGM can send a lone data byte), rebuild each 10-bit tone divider and scale it by 4000000/clock (about 1.117), clamped to 1023. Noise rates cannot be corrected; the SMS noise LFSR also differs a little from the original chip. .vgz (gzip) is out of scope on the CoCo: decompress on the host. Size is the main risk: 2 bytes per chip write and no automatic fade make VGMs much bigger than .SNG (often tens of KB). First version: load whole into RAM at the jukebox's $5A00 load area and refuse files that do not fit. Streaming from disk with dk-getc (lib/decb.fs) would lift the limit, but _dk-read halts the CPU and a track step or rotational wait can stall for up to about 200 ms; streaming with read-ahead is a follow-up issue, not this one. Measure real VGM file sizes early to see how many fit. Test material should be ours or freely licensed (e.g. a tune made in Furnace), not copyrighted game music checked into the repo. PROGRESS 2026-10-23: lib/vgm.fs written. lib/sn76489.fs's field-sync handler now calls the per-frame step through a vector (_sn-step): _sn-use-sng installs the .SNG step (the old handler body, now a subroutine) and lib/vgm.fs's _vgm-use the VGM one, so sn-irq-on, sn-hold, sn-vsync, sn-over?, sn-frames, sn-lvl and sn-atten serve both formats; _sn-step1 runs the step once from Forth (vgm-frame, vgm-skip). Timing: a frame runs only the commands strictly inside its 735 samples (an earlier version ran one frame early at exact-frame waits; caught by the model). Pitch scale m = 4000000 / (clock>>8) in 8.8 (286 for 3579545) via a 32/16 divide CODE word; divider x m / 256 rounded, clamped 1023; vgm-pitch reads the last sent divider. GD3 English title and author decoded to ASCII. Measured: the Badinerie as VGM is 24.3 KB for 86 s (about 280 B/s, 3.7x the .SNG). Jukebox: lists .SNG and .VGM, dispatches start/skip/info on vgm?; program grew to $5D1A so song-buf moved $5800 -> $5E00, song-max $2500 -> $1F00 (about 28 s of VGM). Test material: src/sound-sn76489/sng2vgm.py renders a .SNG through a model of the player into a 3.58 MHz VGM with loop and GD3; the jukebox disk carries BADINERI.VGM (first 20 s). src/vgm-test prints the player state after a 600-frame seek; matched expect.py exactly in XRoar. A Python model of the step matched the .SNG player on all 2401 frames (levels exact, dividers within 1). CLOSED 2026-10-23: user confirmed in the jukebox that BADINERI.VGM sounds like BADINERI.SNG. It is only the first 20 s, looped once (0:40 against the full 1:28), because the whole song as VGM (24 KB) does not fit the jukebox's 7.9 KB buffer. Not done here, filed as #629 (stream VGM from disk to lift the ~28 s size limit) and #630 (reference.html section for lib/vgm.fs). Not tested: real third-party VGM rips (none in the repo; only our own test material may be checked in), 50 Hz files, and the $67 data-block / other-chip skipping paths, which only the Python model exercises in thought, not on hardware.", "type": "feature", "status": "done", "priority": "medium", "file": "lib/vgm.fs", "created": "2026-10-14", "updated": "2026-10-23"}, {"id": 599, "summary": "Jukebox: volume control while playing (up/down arrows)", "description": "User request after running the jukebox on a CoCo Zero on a big TV: a volume control that works during playback, up arrow louder, down arrow quieter. Plan: a master attenuation in lib/sn76489.fs (VARIABLE sn-atten, 0 loudest to 15 off) added to every level the envelope writes in _sn-envelope, clamped to 15, so it scales all four channels and needs no change to the .SNG format. The jukebox reads the arrow keys (KEY? returns $1C up, $1D down, kernel/kernel.asm KEY_TABLE) and steps sn-atten by 1. Pausing playback is not part of this (see the transport issue). Done 2026-10-15: sn-atten in lib/sn76489.fs (master attenuation added to every level the envelope writes, clamped to 15); the jukebox steps it with the up/down arrows, holding repeats, and shows a volume bar. Tested in XRoar (down arrow) and confirmed by the user ('working very nicely'). Arrow keys from a real keyboard on the CoCo Zero are in the follow-up issue.", "type": "feature", "status": "done", "priority": "medium", "file": "lib/sn76489.fs", "created": "2026-10-15", "updated": "2026-10-15"}, {"id": 600, "summary": "SNG v2 header: title, composer and duration", "description": "The jukebox player screen needs a song title, an author and the length to show a time index and progress bar. .SNG v1 (src/sound-sn76489/SNG-FORMAT.md) has no metadata. Add an optional v2 header, as the spec's v2 notes proposed: first byte $EA (reserved in v1, and no v1 file starts with it), a version byte, the length in frames (16-bit big-endian, repeats included), then a counted title string and a counted composer string, then the v1 stream unchanged. lib/sn76489.fs gets words to read the fields and sn-start skips the header, so v1 files still play. sn76489.py and midi2sng.py write the header; titles for the MIDI imports come from a list next to midi/SOURCES.md. Update SNG-FORMAT.md. Envelope settings in the header are not part of this. Done 2026-10-15: v2 header ($EA, version 2, length in frames, counted title, counted composer) documented in SNG-FORMAT.md; sn76489.py header()/frames(), midi2sng.py writes it (titles from midi/TITLES.txt or --title/--composer), badinerie.py too; lib/sn76489.fs sng-v2?, sng-frames, sng-title, sng-composer, sng-body, and sn-start skips the header so v1 files still play. All nine songs rebuilt with headers. Confirmed by the user.", "type": "feature", "status": "done", "priority": "medium", "file": "src/sound-sn76489/SNG-FORMAT.md", "created": "2026-10-15", "updated": "2026-10-15"}, {"id": 601, "summary": "Jukebox: transport controls and radio-style continuous play", "description": "Turn the jukebox from pick-a-song into a player: songs play one after another and wrap around, radio-station style, with no menu between them. Transport keys follow Winamp's: Z previous, X play (restarts if already playing), C pause/resume, V stop, B next, left/right arrows rewind/fast-forward 5 seconds, BREAK quits. Needs a fast seek in lib/sn76489.fs (sn-skip, run n frames of events without the envelope); rewind is restart plus skip, since the stream only runs forward. Pause silences the chip and stops calling sn-frame. The player keeps a frame counter for the time index. Done 2026-10-15: COCO.FM plays every .SNG in order and wraps; Z X C V B prev/play/pause/stop/next, left/right 5 s seek (sn-skip forward, restart plus skip back), BREAK quits. Tested in XRoar (B, C, X, V) and confirmed by the user. Real-keyboard checks of the arrows and BREAK are in the follow-up issue.", "type": "feature", "status": "done", "priority": "medium", "file": "src/jukebox/jukebox.fs", "created": "2026-10-15", "updated": "2026-10-15"}, {"id": 602, "summary": "Jukebox: 90s MP3-player screen in CG2 128x64 4-colour", "description": "User wants the jukebox to look like a 90s MP3 player (Winamp) with the laid-back feel of the Poolside FM app, on CG2 (128x64, 4 colours, colour set 0: green, yellow, blue, red). Show the song title (scrolling when too long, as Winamp did), the author, the elapsed time, a progress bar, the volume, live channel level bars, and the transport buttons with the active one lit. Plan: CG2 VRAM at $0600 (1536 bytes, inside the kernel's RG6 reservation), a small 3x5 font in a 4x6 cell so one glyph row is one CG byte (32 columns by 10 rows), and doubled digits for the time. Redraw only what changed each frame so playback does not drop frames. Depends on the SNG v2 header for the title, author and length, and on the transport issue. Done 2026-10-15: CG2 128x64 screen (title bar, play icon, big clock, length, level bars, scrolling title, composer, progress bar, track, volume bar, wide Winamp-style buttons with key letters), drawn with the new lib/cg-tiny.fs (3x5 font, one CG byte per glyph row, doubled glyphs). Rows 61-63 left empty for overscan. Also corrected CG2's VRAM size to 2048 in coco-guides/vdg-modes.md. Confirmed by the user.", "type": "feature", "status": "done", "priority": "medium", "file": "src/jukebox/jukebox.fs", "created": "2026-10-15", "updated": "2026-10-15"}, {"id": 603, "summary": "Jukebox: M key toggles the colour set", "description": "User request: a key (M) that switches the jukebox screen between the VDG's two colour sets, CSS 0 (green, yellow, blue, red) and CSS 1 (buff, cyan, magenta, orange). It is one bit, $FF22 bit 3; the pixel values stay the same, so every colour swaps for its CSS 1 partner. The user also plans to change the global palette colours (CoCo Zero side), so wider colour selection is a separate conversation and not part of this. Done 2026-10-15: M flips $FF22 bit 3. Grew into palette themes: on a machine with $FFB0-$FFBF palette registers (CoCo 3, CoCo Zero, detected by write/read of register 12) the jukebox writes colour set 0 as 'night' and colour set 1 as 'Poolside', sets the CoCo 3 CG border registers 9/11, and restores the palette on quit (stock approximations if it read as never written). Stock CoCo 1/2 maps the roles onto the fixed VDG colours. Tested in XRoar coco2bus and coco3 (make run3, RGB monitor), confirmed by the user.", "type": "feature", "status": "done", "priority": "low", "file": "src/jukebox/jukebox.fs", "created": "2026-10-15", "updated": "2026-10-15"}, {"id": 604, "summary": "SN76489 player on the 60 Hz field-sync IRQ, for steady timing", "description": "User report: the jukebox's sound updates have a lot of jitter. Cause: src/jukebox steps the song (sn-frame) once per pass of its main loop after vsync, and passes that redraw the clock, buttons or scrolling title overrun a frame, so the next step lands late. Fix: run the per-frame player step from an IRQ on PIA0 CB1 (field sync, 60 Hz, present on every CoCo, the CoCo 3 and CoCo Zero included), as a 6809 handler in lib/sn76489.fs that does what sn-frame does. The user suggested the CoCo 3 GIME timer; field sync was chosen because it exists on the CoCo 1/2 too and is exactly the songs' frame rate; the GIME timer is only worth it for a tick finer than 60 Hz. The handler patches the $010C IRQ trampoline (restored on off). The main loop waits on a tick counter the handler bumps (sn-vsync), since the handler clears the field-sync flag that vsync polls. IRQs go off around disk access, since lib/decb.fs needs them masked. Seeks and starts hold the player (sn-hold) so the handler never sees half-changed state. The polled sn-frame / sn-play stay for programs that do not want an IRQ (badinerie.fs). Done 2026-10-15: lib/sn76489.fs sn-irq-on/sn-irq-off install a 6809 handler on the $010C IRQ trampoline for PIA0 CB1 field sync; sn-hold, sn-vsync, sn-ticks, sn-over?, sn-frames. The jukebox uses it, with the IRQ off around disk access and quit. Tested in XRoar coco2bus and coco3 (clock keeps real time, next/pause/resume), confirmed by the user ('working very nicely').", "type": "feature", "status": "done", "priority": "medium", "file": "lib/sn76489.fs", "created": "2026-10-15", "updated": "2026-10-15"}, {"id": 605, "summary": "Jukebox: check arrows and BREAK on a real keyboard and the CoCo Zero", "description": "Follow-up to #599 and #601. Scripted key presses (osascript) reach XRoar for letters but not for arrows or Escape, so the up/left/right arrows and BREAK in src/jukebox were never confirmed by a test. Try them on a real keyboard in XRoar and on the CoCo Zero: up/down step the volume (hold to repeat), left/right seek 5 s, BREAK quits to BASIC with the palette restored. Also listen for the #604 timing on the CoCo Zero. CLOSED 2026-10-26: user confirmed the jukebox keys work.", "type": "test", "status": "done", "priority": "medium", "file": "src/jukebox/jukebox.fs", "created": "2026-10-15", "updated": "2026-10-26"}, {"id": 606, "summary": "Jukebox: palette themes for a CoCo 3 on a composite TV", "description": "Follow-up to #603. The themes table in src/jukebox/jukebox.fs holds GIME RGB values. A CoCo 3 on a composite monitor or TV reads the same palette bytes as composite colours (hue and intensity), so the night and Poolside themes come out as different colours there; XRoar's coco3 defaults to composite, hence make run3 uses -tv-input rgb. The CoCo Zero uses the RGB meaning. Add a composite table and a way to choose it (a key, or a setting), if a real CoCo 3 on a TV is a target.", "type": "feature", "status": "open", "priority": "low", "file": "src/jukebox/jukebox.fs", "created": "2026-10-15", "updated": "2026-10-15"}, {"id": 607, "summary": "reference.html: lib/cg-tiny.fs and the new lib/sn76489.fs words", "description": "Docs follow-up to #602 and #604, alongside #589 (reference.html for lib/sn76489.fs). Document lib/cg-tiny.fs (cg-base, cg-ink, cg-paper, cg-at, cg-emit, cg-type, cg-big, cg-fill, cg-colour, cg-mix; the icon glyphs at [ \\ ] ^ _ `) and the sn76489 additions (sn-atten, sn-skip, sng-v2?, sng-frames, sng-title, sng-composer, sng-body, sn-irq-on, sn-irq-off, sn-hold, sn-vsync, sn-ticks, sn-over?, sn-frames) in reference.html. lib/README.md is already regenerated. FOLDED 2026-10-26 into #637, which brings the whole library reference up to date in one pass.", "type": "docs", "status": "closed", "priority": "low", "file": "reference.html", "created": "2026-10-15", "updated": "2026-10-26"}, {"id": 608, "summary": "Song library: import the remaining Three-Part Sinfonias (BWV 787-801)", "description": "The 15 Sinfonias are written in exactly three voices, so they fit the SN76489's three tone channels with nothing dropped; the user wants three-part music especially. We have Nos. 2 (BWV 788) and 11 (BWV 797). Mutopia has directories for all 15 (https://www.mutopiaproject.org/ftp/BachJS/BWV787 to BWV801). Import every one whose LilyPond source says Public Domain (the library is PD only: Inventions 1 and 6 were skipped as CC BY-SA 3.0), record each in src/sound-sn76489/midi/SOURCES.md and TITLES.txt, and raise the jukebox's 16-song limit (max-songs in src/jukebox/jukebox.fs) so the disk's songs all play. Done 2026-10-15: all 15 Sinfonias imported (all Public Domain, 0 notes dropped), each with a researched .perf; max-songs raised to 48. The user listened to every song and confirmed they sound more natural.", "type": "feature", "status": "done", "priority": "medium", "file": "src/sound-sn76489/midi/", "created": "2026-10-15", "updated": "2026-10-15"}, {"id": 609, "summary": "midi2sng performance layer: tempo shaping, terraced dynamics, voice balance", "description": "Every Mutopia MIDI we have is flat: one tempo event for the whole piece and one velocity for every note (measured 2026-10-15), so all expression has to be added by us. Add a per-song performance file read by src/sound-sn76489/midi2sng.py and baked into the stream (waits and volume bytes), needing no player change: a final ritardando (on by default), broadening at marked bars, terraced dynamics by bar range (Baroque forte/piano by section), echo (softer repeat), per-voice balance by bar range (bring the voice with the subject forward), and light strong-beat accents. Per-song envelopes in the header, vibrato and the periodic-noise bass are separate later steps. Done 2026-10-15: the Performance class in midi2sng.py reads midi/NAME.perf with tempo, rit, broaden, dyn, ramp, voice, lead, accent and pickup; documented in src/sound-sn76489/PERFORMANCE.md. User listened and confirmed. Per-song envelopes, vibrato and the noise-channel bass are filed as #615, #616 and #617.", "type": "feature", "status": "done", "priority": "medium", "file": "src/sound-sn76489/midi2sng.py", "created": "2026-10-15", "updated": "2026-10-15"}, {"id": 610, "summary": "Song library: research and write a performance for each track", "description": "User direction: research each track and apply dynamics and voicing that are traditional and authentic for it, so the listening is not monotonous. For each piece, from its score and performance practice: the sections and cadences, where the subject or theme enters in which voice, the character and a fitting tempo, where a broadening belongs, and terraced dynamics. Write it as the piece's performance file (the midi2sng performance layer) with a short note on the reasoning and sources. Start with the Sinfonias. Done 2026-10-15: every one of the 30 MIDI imports has a researched .perf (tempo sources and reasoning in each file's comments). User listened to them all and confirmed. Caveat left in the files: per-recording tempo data was thin for the Air, Prelude in C and Badinerie, so those tempos are partly judgment.", "type": "feature", "status": "done", "priority": "medium", "file": "src/sound-sn76489/midi/", "created": "2026-10-15", "updated": "2026-10-15"}, {"id": 611, "summary": "Song library: import eight three-voice fugues, with performance files", "description": "User asked for fugues. Surveyed every Bach fugue on Mutopia (2026-10-15) by licence, notes dropped by midi2sng and stream size. Importing the ones that are Public Domain, drop little or nothing, and fit the jukebox's 7680-byte limit: WTC I Fugues 3 (BWV 848, 0.4% dropped), 6 (BWV 851, 2.4%), 8 (BWV 853), 10 (BWV 855, two voices), 11 (BWV 856); WTC II Fugue 1 (BWV 870, 0.8%); Fugue in C major BWV 952; Art of Fugue, the three-voice mirror fugue (Mutopia 'Contrapunctus XVI a 3, rectus and inversus'). Each gets a researched midi/NAME.perf (#610 approach). Left out: WTC I C minor (BWV 847), F minor (857) and II E major (878) are CC BY-SA; the Musical Offering Ricercar a 3 (12 KB), Art of Fugue VIII a 3 and the canons (8-14 KB) and WTC I G major (8.6 KB) are too big for the load area; four- and five-voice fugues drop 6-33% of their notes. The fugues go on a second song disk (drive 1). Done 2026-10-15: nine fugues imported to build/fugues.dsk (drive 1): WTC1F03, WTC1F06, WTC1F08, WTC1F10, WTC1F11, WTC2F01, FUGUE952, AOF3A, AOF3B, each with a .perf. User listened and confirmed. The pieces too big for the load area are #618.", "type": "feature", "status": "done", "priority": "medium", "file": "src/sound-sn76489/midi/", "created": "2026-10-15", "updated": "2026-10-15"}, {"id": 612, "summary": "Jukebox: play songs from every drive that has a disk", "description": "The song library no longer fits one 35-track DECB disk (the Sinfonias, Inventions and the rest leave about 18 KB free; the fugues need about 40 KB). The user agreed to span drives if they are available: scan drives 0-3 for .SNG files, skip a drive with no disk quickly, remember each song's drive, and load from it. make run puts the fugue disk in drive 1. Track numbers run across all drives. Done 2026-10-15: scan covers drives 0-3 (scan-drive does dk-select dk-ready?, which samples the index pulse because READY is tied on), names entries remember the drive, load selects it. 31 tracks across two disks; startup about 8 s. User played every song and confirmed.", "type": "feature", "status": "done", "priority": "medium", "file": "src/jukebox/jukebox.fs", "created": "2026-10-15", "updated": "2026-10-15"}, {"id": 613, "summary": "Performance files: a pickup command so bar numbers match the score", "description": "midi2sng.py's performance layer (#609) counts bars from MIDI tick 0. Two imported fugues start on an upbeat: the Art of Fugue mirror fugue a 3 (AOF3A/AOF3B, a quarter-note pickup) and WTC I Fugue 11 (WTC1F11, an eighth-note pickup). LilyPond's MIDI starts on the pickup, so their .perf files (written for #611) number bars by the MIDI, which is offset from the score, and the headers explain the offset. accent (downbeats) would land on the wrong beat in those pieces, so it is not used there. Add 'pickup DURATION' (e.g. 'pickup 4' or 'pickup 8') that shifts bar 1 to the first full bar, document it in PERFORMANCE.md, and renumber those three files to the score's bars. Update 2026-10-15: the pickup command itself was implemented under #614 (midi2sng.py and PERFORMANCE.md) and the Badinerie uses it. What remains is renumbering AOF3A.perf, AOF3B.perf and WTC1F11.perf to the score's bars with pickup, then re-checking that their dyn and lead marks land on the same music. Moved 2026-10-16 (#626, #627): the song library is now in ~/github/coco-fm-bach, where this continues as its issue 4. Closed here because coco no longer carries the library.", "type": "feature", "status": "done", "priority": "low", "file": "src/sound-sn76489/midi2sng.py", "created": "2026-10-15", "updated": "2026-10-16"}, {"id": 614, "summary": "Performances for the last seven songs, and require one for every song", "description": "User direction 2026-10-15: every song added to the project must give the piece the respect it deserves, i.e. ship with a researched performance (tempo from respected recordings, terraced dynamics at cadences, subject entries brought forward, broadening and a closing ritardando where they belong; see src/sound-sn76489/PERFORMANCE.md). Seven songs had none: Inventions 4, 8, 10 and 13, the Air BWV 1068, the WTC I Prelude in C (these only got midi2sng's defaults) and the hand-made Badinerie (fixed voice levels, no shaping). Do: research and write midi/NAME.perf for the six MIDI imports; move badinerie.py onto the performance layer (repeats unrolled so the second pass can differ, e.g. an echo; needs the pickup command of #613, so add it now); make midi2sng.py refuse a song with no performance file unless --draft is given; record the rule in CLAUDE.md and PERFORMANCE.md. Done 2026-10-15: performances written for INVENT04/08/10/13, AIR and PRELUDE1; badinerie.py moved onto the performance layer via badinerie.perf with repeats written out and echoed; midi2sng.py refuses a song without a .perf unless --draft; rule recorded in CLAUDE.md and PERFORMANCE.md. User listened and confirmed.", "type": "feature", "status": "done", "priority": "medium", "file": "src/sound-sn76489/", "created": "2026-10-15", "updated": "2026-10-15"}, {"id": 615, "summary": "Per-song note envelope in the SNG header", "description": "Every song uses the player's one decay envelope (lib/sn76489.fs), which makes slow sustained pieces sound plucked; the Air (midi/AIR.perf, quarter = 36) is the clearest case, its long notes fade before they end. Idea: add an envelope field (decay rate and floor) to the v2 header (src/sound-sn76489/SNG-FORMAT.md, sn76489.py header()), let the .perf set it, and have the player read it at sn-start. Needs a header version bump or a reserved byte; keep v1 and v2 songs playing.", "type": "feature", "status": "open", "priority": "low", "file": "src/sound-sn76489/", "created": "2026-10-15", "updated": "2026-10-15"}, {"id": 616, "summary": "Vibrato for long notes", "description": "Long held notes on the SN76489 are perfectly static. A gentle vibrato (small periodic change of the tone divider after a note has sounded for a while) could make slow pieces like the Air and the Sinfonia slow movements sing. Could be done in the player (per-frame divider wobble, costs IRQ time) or baked into the stream by midi2sng.py (costs bytes). Measure both before choosing. Was listed as a later step in #609.", "type": "feature", "status": "open", "priority": "low", "file": "src/sound-sn76489/", "created": "2026-10-15", "updated": "2026-10-15"}, {"id": 617, "summary": "Bass below B2 via the periodic-noise channel", "description": "The tone divider is 10 bits, so at 4 MHz the lowest note is about B2 (122 Hz); sn76489.py stream() lifts anything lower an octave. That puts the Prelude in C's closing pedal notes inside the texture instead of under it, and affects other bass lines. The SN76489's noise channel in periodic mode, clocked from tone channel 2, gives a pitch 1/15 (or 1/16) of channel 2's, reaching well below B2 at the cost of channel 2. Investigate whether a song can trade a voice for a real bass, how XRoar's gmc models it, and how midi2sng.py would assign it. Was listed as a later step in #609.", "type": "feature", "status": "open", "priority": "low", "file": "src/sound-sn76489/", "created": "2026-10-15", "updated": "2026-10-15"}, {"id": 618, "summary": "Load area too small for the bigger fugues", "description": "The jukebox loads a song into a 7680 B area, which excludes Bach pieces that are otherwise good fits: the Musical Offering Ricercar a 3 (about 12 KB), Art of Fugue Contrapunctus VIII a 3 and the canons (8-14 KB) and WTC I G major fugue (8.6 KB). Options: raise the load limit (about $2300 more looks possible, check the jukebox's memory map in src/jukebox/jukebox.fs), or stream the song from disk a sector at a time while it plays. Found during #611. Update 2026-10-15 (for #620): first step, in 32K ROM mode: move the jukebox's names table out of the binary to $0E00 (free RG6 reservation above the CG2 screen at $0600-$0DFF), raise max-songs to 99, and let a song use $5800-$7CFF (9472 B; first $5500, moved up when the #623 rotation code grew the program to $565A). That admits the Art of Fugue movements just over 7680 B. Still too big: the Fugue of BWV 565 (about 13.8 KB) and anything larger; those need the upper 32K of a 64K machine (watch out: CoCo 3 BASIC runs from RAM at $8000+) or streaming. Done 2026-10-15: song area $5800-$7CFF (9472 B), song list at $0E00, 99 songs; the largest song (P5GIGUE, 9218 B) loads and plays. The Fugue of BWV 565 (about 14 KB) still does not fit: filed as #624.", "type": "feature", "status": "done", "priority": "low", "file": "src/sound-sn76489/", "created": "2026-10-15", "updated": "2026-10-15"}, {"id": 619, "summary": "Jukebox finds no songs on the CoCo Zero: dk-ready? needs the index pulse", "description": "After #612 the jukebox scans drives 0-3 and skips a drive unless dk-ready? (lib/decb.fs) sees the WD279x index bit (Type I status bit 1) toggle as the disk turns. That works in XRoar, but the CoCo Zero's controller is a minimal register-level model (xroar-waveshare-rp2350-pizero lib/coco_machine/src/coco_machine.cpp:443, fdc_handle_command) with no rotation: after Force Interrupt its status is only $04 or $00, so the index bit never changes and every drive reads as empty. Reported by the user 2026-10-15: 'no .sng files on any drive' with JUKEBOX.DSK in drive 0 and FUGUES.DSK in drive 1. Fix: when no index pulse is seen, fall back to a quick probe, a Read Sector of sector 1 on the current track with NMI off, polled with a short timeout: DRQ means a disk is there (then Force Interrupt), finishing without DRQ (the Zero reports NOT READY $80 at once for an empty drive) or timing out means no disk. XRoar with a disk never reaches the probe; XRoar with an empty drive pays the short timeout only. Done 2026-10-15: _dk-probe added to lib/decb.fs and called by dk-ready? when no index pulse is seen. XRoar still finds 31 tracks; the user confirmed 31 tracks on the CoCo Zero with JUKEBOX.DSK in drive 0 and FUGUES.DSK in drive 1.", "type": "bug", "status": "done", "priority": "high", "file": "lib/decb.fs", "created": "2026-10-15", "updated": "2026-10-15"}, {"id": 620, "summary": "Song library: fill two more disks with Bach, including the Toccata in D minor and Sheep May Safely Graze", "description": "User direction 2026-10-15: 'fill two more disks with bach music including the tocatta and also sheep may safely graze'. Toccata = Toccata (and Fugue) in D minor, BWV 565; Sheep May Safely Graze = 'Schafe koennen sicher weiden' from Cantata BWV 208. Use the established process (#595, #608-#614): Public Domain Mutopia editions only (CC BY-SA skipped), recorded in src/sound-sn76489/midi/SOURCES.md and TITLES.txt, each with a researched .perf (PERFORMANCE.md), at most three voices plus noise, and each .sng within the jukebox load area (song-max $1E00 = 7680 B in src/jukebox/jukebox.fs, see #618). The new songs go on disks 3 and 4 (drives 2 and 3) built by src/jukebox/Makefile; the jukebox's max-songs (48, names table 12 B per song) must be raised to cover all four disks. Done 2026-10-15: 64 new songs, each with a researched .perf written by six research agents (tempo from recordings, structure from the Mutopia score, repeats written out with the new 'play' command, part priority with the new 'parts' command). Toccata BWV 565 plays alone (play 1-30.5); Sheep May Safely Graze plays the da capo with soprano and bass always kept. Disks: songs.dsk 25 (adds the Duetti), fugues.dsk 20 (adds the WTC preludes and the organ trio sonata), bach3.dsk 26, bach4.dsk 24: 95 songs, about 199 minutes. Held back: Partita 1 Gigue and Bist du bei mir (#622). Titles and attributions corrected from the research (Petzold, J. M. Bach, anonymous Notebook pieces, guitar versions of BWV 997 and 999). User listened and said 'this is good'.", "type": "feature", "status": "done", "priority": "medium", "file": "src/sound-sn76489/midi/", "created": "2026-10-15", "updated": "2026-10-15"}, {"id": 621, "summary": "midi2sng: follow time signature changes and allow tempo per section", "description": "Found while writing src/sound-sn76489/midi/TRIO4A.perf (#620, organ Trio Sonata No. 4 BWV 528, first movement: an Adagio in 4/4 then a Vivace in 3/4). Two limits in src/sound-sn76489/midi2sng.py: (1) read_midi keeps only the first time signature, so bars after a change are counted in the old metre and a .perf has to convert score bar numbers by hand (TRIO4A.perf carries a table: score bar n is position 5 + 0.75(n-5)); (2) the perf 'tempo' command replaces every tempo in the MIDI, flattening a written Adagio-to-Vivace change, so TRIO4A rebuilds the Adagio with 'broaden 1-4.125 0.3333'. Fix: read the full time-signature map and convert ticks to score bars through it; let 'tempo' take an optional bar ('tempo 96 4 at 5') or scale the MIDI's own tempo map. Then rewrite TRIO4A.perf in plain score bars and check it builds the same music. Moved 2026-10-16 (#626, #627): the song library is now in ~/github/coco-fm-bach, where this continues as its issue 5. Closed here because coco no longer carries the library.", "type": "feature", "status": "done", "priority": "low", "file": "src/sound-sn76489/midi2sng.py", "created": "2026-10-15", "updated": "2026-10-16"}, {"id": 622, "summary": "Song library: two held-back pieces need better sources (Partita 1 Gigue, Bist du bei mir)", "description": "Held back from #620. The Mutopia edition of Partita No. 1 in B-flat major, BWV 825, Gigue (https://www.mutopiaproject.org/ftp/BachJS/BWV825/ , file 16title-hub.mid, Public Domain) writes the running middle-voice triplets out only in bar 1; from bar 2 on they appear as whole-note chords marked 'simile', and the MIDI plays exactly that (bar 2 is a held E-flat and B-flat for four beats). So the song would have the leaping quarter notes over sustained chords and none of the triplets that define the piece. A researched performance file was written (quarter = 156, both repeats; it is kept outside the repo in the session scratchpad as P1GIGUE.perf and needs rewriting into src/sound-sn76489/midi/P1GIGUE.perf). To do: generate the triplets from the chords following bar 1's pattern (a small script that edits the MIDI, or a 'simile' expansion in a corrected source), check against a published score, then add P1GIGUE to midi/, TITLES.txt, SOURCES.md and BACH4 in src/jukebox/Makefile. Also held back: Bist du bei mir, BWV 508 (by G. H. Stoelzel, from his opera Diomedes, 1718, copied into the Anna Magdalena Notebook). The only Public Domain Mutopia edition (https://www.mutopiaproject.org/ftp/BachJS/BWV508/BistDuBeiMir/) is a trumpet transcription of the vocal line alone, in C major, with no bass, so on the chip it is a bare melody. A researched performance file exists (quarter = 56, from Kirkby/Hogwood 2:30, Ameling/Leonhardt 2:21, Battle 2:24; scratchpad BISTDU.perf). Find a PD edition with the continuo (or voice and keyboard), then add it with composer 'G. H. Stoelzel'. Moved 2026-10-16 (#626, #627): the song library is now in ~/github/coco-fm-bach, where this continues as its issue 6. Closed here because coco no longer carries the library.", "type": "feature", "status": "done", "priority": "low", "file": "src/sound-sn76489/midi/", "created": "2026-10-15", "updated": "2026-10-16"}, {"id": 623, "summary": "Jukebox: radio rotation, a shuffled order with no song repeating too soon", "description": "User direction 2026-10-15: 'there cannot be a static order. each song must flow to the next. it's like a radio station, so no song should repeat too often, especially the popular ones.' The jukebox (src/jukebox/jukebox.fs) plays the 95 songs in disk order and wraps. Plan: a shuffle bag. The play order is a permutation of the songs; each song plays once per round (95 songs, about 3.5 hours), so the popular ones (Toccata, Air, Badinerie, Sheep May Safely Graze, Minuet in G, Cello Suite 1 Prelude) come round no more often than any other. When a round ends, reshuffle so none of the last quarter of the old round opens the new one. Flow: avoid two songs from the same set back to back (same first two letters of the 8.3 name: INVENT, SINFON, CS1/CS3, WTC and so on). Songs still run into each other without stopping; Z goes back through the round, B goes on. The seed comes from the kernel RNG stirred by frame counts during the disk scan and by key timing; on an emulator or the CoCo Zero those can repeat from one power-on to the next (the RP2350's TRNG is not visible to the 6809). Done 2026-10-15: shuffle bag in src/jukebox/jukebox.fs (order table at $1300, first-round, new-round, flow, advance, retreat); a Python simulation of six rounds found no repeat closer than 28 songs and one same-set neighbour in 570 plays. The user confirmed the shuffle on the CoCo Zero. Not done: the seed on an untouched CoCo Zero or emulator power-on comes only from disk timing and key presses, so it may open the same way each time; a TRNG register from the CoCo Zero (RP2350) would fix that, which is a change in that project.", "type": "feature", "status": "done", "priority": "medium", "file": "src/jukebox/jukebox.fs", "created": "2026-10-15", "updated": "2026-10-15"}, {"id": 624, "summary": "Jukebox: room for songs over 9.5 KB (the Fugue of BWV 565)", "description": "Remainder of #618. The jukebox loads a song into $5800-$7CFF (9472 B) in 32K ROM mode; the program ends near $565A. The Fugue of the Toccata and Fugue in D minor, BWV 565 (score bars 30.5-143 of src/sound-sn76489/midi/TOCCATA.mid) comes to about 14 KB, and the Musical Offering Ricercar a 3, Art of Fugue VIII and WTC I fugues 15, 20 and 24 are 8.6-13 KB. Options: (1) keep the song in the upper 32K of a 64K machine and set SAM TY only while the IRQ player and the header readers touch it (mask interrupts in that window; beware the CoCo 3, whose BASIC runs from RAM at $8000 and up, so it needs MMU blocks instead); (2) stream from disk while playing (hard: disk reads use NMI and the IRQ player is off during them); (3) a denser stream format (SNG v3: drop repeated volume bytes). Once there is room, add FUGUE565 with 'play 30.5-143' and a researched .perf (the Toccata's agent noted the Adagissimo, Presto and Molto Adagio marks belong to the Fugue's coda, bars 127-143). Moved 2026-10-16 (#626, #627): the song library is now in ~/github/coco-fm-bach, where this continues as its issue 2. Closed here because coco no longer carries the library.", "type": "feature", "status": "done", "priority": "medium", "file": "src/jukebox/jukebox.fs", "created": "2026-10-15", "updated": "2026-10-16"}, {"id": 625, "summary": "Jukebox: name the song disks BACH0-BACH3 after their drive", "description": "User request 2026-10-15: 'we need to name the dsk files bach0 bach1 bach2 and bach3 to make it more obvious what they are and also make them easier to find in the directory'. The four images built by src/jukebox/Makefile were songs.dsk, fugues.dsk, bach3.dsk and bach4.dsk (on the CoCo Zero card JUKEBOX.DSK, FUGUES.DSK, BACH3.DSK, BACH4.DSK). Rename to build/bach0.dsk to bach3.dsk, the number being the drive, and BACH0.DSK to BACH3.DSK on the card; rename the Makefile's list variables to match (BACH2, BACH3 for drives 2 and 3); update src/jukebox/README.md; on the card remove the old four names and point coco/drives.txt (which mounted JUKEBOX.DSK in drive 0) at BACH0-BACH3. Done 2026-10-15: Makefile builds build/bach0.dsk to bach3.dsk; the card holds BACH0.DSK to BACH3.DSK with the old names removed, and coco/drives.txt mounts them in drives 0 to 3. The user confirmed the CoCo Zero boots with all four disks.", "type": "chore", "status": "done", "priority": "medium", "file": "src/jukebox/Makefile", "created": "2026-10-15", "updated": "2026-10-15"}, {"id": 626, "summary": "Copy the Bach jukebox and song library to their own project, ~/github/coco-fm-bach", "description": "User direction 2026-10-16: the Bach collection (four disks, 95 songs) gets its own project at ~/github/coco-fm-bach, where the user will curate, correct and document it. Everything Bach is copied over: src/jukebox (the COCO.FM player) and src/sound-sn76489 (midi2sng.py, sn76489.py, the Badinerie, midi/ with the .mid/.perf pairs, SOURCES.md, TITLES.txt, PERFORMANCE.md, SNG-FORMAT.md). Coco keeps its copies; nothing is removed here. The new project does not vendor a toolchain: it builds against a sibling checkout of coco (../coco), using its kernel, tools/fc.py and the six libs lib/screen.fs, bye.fs, vdg.fs, cg-tiny.fs, sn76489.fs and decb.fs. Test: the new project builds bach0.dsk to bach3.dsk byte for byte identical to coco's src/jukebox build at commit 8b02f45. The music issues still open here (582, 596, 605, 606, 613, 615, 616, 617, 621, 622, 624) are carried into the new project's tracker and closed here with a pointer. Done 2026-10-16: user confirmed coco-fm-bach builds its four disks.", "type": "feature", "status": "done", "priority": "medium", "file": "src/jukebox", "created": "2026-10-16", "updated": "2026-10-16"}, {"id": 627, "summary": "Slim coco's music to the Badinerie: the jukebox becomes a one-song demo", "description": "User direction 2026-10-16: coco should not carry the Bach media. The 95-song library now lives in ~/github/coco-fm-bach (#626), with the research in ~/github/bach-research; both were checked to hold every file. In coco: remove src/sound-sn76489/midi/ (190 .mid/.perf files, TITLES.txt, SOURCES.md) and the Makefile 'songs' rule; src/jukebox stays as the demo of the COCO.FM player, building one disk with JUKEBOX.BIN and BADINERI.SNG (the hand transcription of #579). Kept: badinerie.py/.perf/.fs, sn76489.py, midi2sng.py (badinerie.py uses its performance layer, and it still converts a MIDI file), PERFORMANCE.md, SNG-FORMAT.md, and lib/sn76489.fs, lib/decb.fs, lib/cg-tiny.fs. Docs (jukebox README, sound-sn76489 README, PERFORMANCE.md, SNG-FORMAT.md, CLAUDE.md music section) point at coco-fm-bach for the library. Test: make run in src/jukebox plays the Badinerie from drive 0. Done 2026-10-16: user confirmed make run in src/jukebox plays the Badinerie from drive 0.", "type": "chore", "status": "done", "priority": "medium", "file": "src/jukebox", "created": "2026-10-16", "updated": "2026-10-16"}, {"id": 628, "summary": "Upgrade mistune to 3.3.3 (Dependabot alert)", "description": "GitHub Dependabot alert 1 (https://github.com/ugufru/coco/security/dependabot/1, seen on the 2026-10-16 push): tools/requirements.txt pins mistune==3.3.2, and the fix is 3.3.3 or later. mistune is the markdown parser used only by tools/build-site.py (#539/#541) to build site/. Keep the exact pin (the file pins it so the generated site is reproducible) and move it to mistune==3.3.3. Test: build the site with 3.3.2 and with 3.3.3 in throwaway venvs and diff the output. Done 2026-10-16: pin moved to mistune==3.3.3. The site built with 3.3.2 and with 3.3.3 (throwaway venvs) is byte for byte identical, 27 pages; both report the same 2 pre-existing validation problems. User approved the commit and push.", "type": "chore", "status": "done", "priority": "medium", "file": "tools/requirements.txt", "created": "2026-10-16", "updated": "2026-10-16"}, {"id": 629, "summary": "lib/vgm.fs: stream VGM files from disk instead of loading them whole", "description": "Remainder of #598. The jukebox loads a whole file into $5E00-$7CFF (song-max $1F00, 7936 bytes), and VGM runs about 280 bytes a second (measured: the Badinerie as VGM is 24.3 KB for 86 s, 3.7x its .SNG), so only about 28 s fits; most real Master System tunes with intros and loops will not. Stream instead: read ahead with dk-getc (lib/decb.fs) into a ring buffer the field-sync step (lib/vgm.fs _vgm-use @step) consumes. Problems to solve: _dk-read halts the CPU and needs IRQs masked (the jukebox calls sn-irq-off around disk use, see >disk/>sound in src/jukebox/jukebox.fs), a track step or rotational wait can stall up to about 200 ms, so the buffer must cover that plus refill time at 280 B/s; the loop offset means seeking back in the file; the Multi-Pak I/O slot has to flip between disk and GameMaster ($FF7F) for every refill. Header and GD3 tag (at the end of the file) need reading separately. Test with src/sound-sn76489/sng2vgm.py on the whole Badinerie (24 KB).", "type": "feature", "status": "open", "priority": "medium", "file": "lib/vgm.fs", "created": "2026-10-23", "updated": "2026-10-23"}, {"id": 630, "summary": "reference.html: document lib/vgm.fs", "description": "Remainder of #598. lib/vgm.fs (vgm?, vgm-start, vgm-frame, vgm-skip, vgm-play, vgm-frames, vgm-title, vgm-author, vgm-pitch) is in the auto-generated lib/README.md but has no section in reference.html, the official library reference. Cover: the commands handled and skipped, 60 Hz frame timing (a frame runs the commands strictly inside its 735 samples), pitch scaling by 4000000/clock, loop played once more then stop, volumes rewritten each frame with sn-atten, the shared field-sync handler in lib/sn76489.fs (_sn-step vector), and the size cost (about 280 B/s). Do it alongside #589 and #607, which cover lib/sn76489.fs. FOLDED 2026-10-26 into #637, which brings the whole library reference up to date in one pass.", "type": "docs", "status": "closed", "priority": "low", "file": "reference.html", "created": "2026-10-23", "updated": "2026-10-26"}, {"id": 631, "summary": "vgmstrip.py: cut a VGM down to its SN76489 part so it fits the jukebox", "description": "User request 2026-10-24: a jukebox disk from a folder of VGM rips (first case: Michael Jackson's Moonwalker, Mega Drive). Measured: Mega Drive VGMs are 3-548 KB unpacked, nearly all YM2612 FM writes and DAC sample data ($67 blocks and $8n sample writes), while lib/vgm.fs (#598) plays only the SN76489 and the jukebox holds 7936 bytes. Keeping only the $50 writes and merging every wait ($61/$62/$63/$7n/$8n) shrinks 35 of the 40 Moonwalker tracks to 0.3-6.7 KB. Plan: src/sound-sn76489/vgmstrip.py in.vgm/.vgz out.vgm [--max-bytes N]: keep $50 writes, merged waits, the loop point (remapped), the GD3 tag, SN76489 clock and feedback fields; zero the other chips' clocks; with --max-bytes cut at a frame boundary, drop the loop and end with silence. Plus a way to build a disk: jukebox first (CoCo Zero autorun), then the stripped songs under 8.3 names. Rips are not checked in; the disk goes to a gitignored build dir. Known limit: the result is only the PSG part of a Mega Drive track (the FM melody is gone); Master System and Game Gear rips are all-SN76489 and lose nothing. ON HOLD 2026-10-24: not started. The user asked whether YM2612 support is needed instead (the SN76489 part of a Mega Drive track lacks the melody); the next direction was AY and Orchestra-90 libraries and the sound tour (#632-#634). Mega Drive playback could later go through the Symphony-12's AY chips.", "type": "feature", "status": "open", "priority": "medium", "file": "src/sound-sn76489/vgmstrip.py", "created": "2026-10-24", "updated": "2026-10-24"}, {"id": 632, "summary": "lib/ay8910.fs: AY-3-8910 / YM2149 words for the CoCo PSG and the Symphony-12", "description": "User request 2026-10-24: libraries for every sound option we have, and a demo that exercises them all (#634). The CoCo Zero (~/github/xroar-waveshare-rp2350-pizero, lib/coco_machine/src/psg_ay8910.h, SETTINGS.md; read only) emulates: CoCo PSG (a YM2149): $FF5E latches a register, $FF5F writes it, $FF5D bit 0 picks the clock (0 = 2 MHz, 1 = 1 MHz). Symphony-12 (Speech Systems, four AY-3-8910s, 12 voices, chips 0-1 left and 2-3 right): a 6821 PIA at $FF60-$FF63, port A the chips' data bus, port B two bits per chip (bits 1-0 chip 0 ... 7-6 chip 3): 11 latch, 10 write, 01 read, 00 idle; clocked at 14.31818 MHz / 16 = 894886 Hz. Its chip 0 is shared with the CoCo PSG in the emulator. Tone f = clock / (16 * TP), 12-bit TP; noise 5-bit; mixer R7 active low; levels R8-R10 (bit 4 = envelope); envelope period R11-R12, shape R13. Plan: a selection (CoCo PSG, or a mask of Symphony-12 chips so one write can reach several), ay! ( data reg -- ) as a CODE word doing the PIA latch/write pulses, and ay-tone, ay-vol, ay-noise, ay-mix, ay-env, ay-silence, ay-init. Left out: the Deluxe CoCo's AY-3-8913 at $FF38/$FF39 (off by default on the CoCo Zero, deluxe_psg, because on a CoCo 2 those addresses mirror PIA1) and the Tandy Speech/Sound Cartridge (not emulated yet, PIZERO-249). Stock XRoar emulates neither the CoCo PSG nor the Symphony-12, so they can only be heard on the CoCo Zero. PROGRES
