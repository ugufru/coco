S 2026-10-24: lib/ay8910.fs written (ay!, ay-chips/ay-chip/ay-psg, ay-tone, ay-vol, ay-noise, ay-mix, ay-env, ay-silence, ay-psg-slow, ay-init). ay! is a CODE word: CoCo PSG register to $FF5E and data to $FF5F; Symphony-12 register on port A, latch pulse on port B (11 per selected chip, then 00), data on port A, write pulse (10, then 00); port A only changes while port B is idle. ay-chips takes a mask so one write reaches several chips. Used by src/sound-tour (#634); untestable in stock XRoar, needs the CoCo Zero. UPDATE 2026-10-24: user heard keys 4 and 5 as noise, in XRoar on the Mac (not the CoCo Zero). Cause: stock XRoar has no AY cartridge, and the GameMaster in make run's Multi-Pak decodes odd addresses in $FF40-$FF5F, so CoCo PSG writes to $FF5F reached its SN76489 (and $FF5E its bank latch). Verified the library is right: an XRoar -ui null -trace of the tour's PSG and Symphony-12 sections gave 39,334 AY bus writes identical to a Python model, and those writes rendered through the CoCo Zero's own psg_ay8910.h on the host (scratch harness) sounded fine to the user. Fix: ay-found? ( -- f ) writes $9F then $BF to register 2 and reads each back (_ay-rd@, a CODE word: PSG latch + read $FF5F; Symphony-12 latch, port A to inputs, port B 01, read $FF60, port A back to outputs), then writes $FF; all three bytes are SN76489 'channel off' commands, so the probe is harmless on a GameMaster. ay-init only silences chips that answer. Checked against the CoCo Zero code on the host: found exactly the enabled chips for all four coco_psg/symphony12 combinations. Only AY in stock XRoar: -machine deluxecoco ($FF38/$FF39), needs ROMs not installed here. CLOSED 2026-10-24 on the user's word. Not heard on a CoCo Zero yet: filed as #635. reference.html docs: #636.", "type": "feature", "status": "done", "priority": "medium", "file": "lib/ay8910.fs", "created": "2026-10-24", "updated": "2026-10-24"}, {"id": 633, "summary": "lib/orch90.fs: Orchestra-90CC stereo DAC words", "description": "Part of the sound-options request (#634). Tandy's Orchestra-90CC has two 8-bit DACs, left at $FF7A and right at $FF7B, write only (XRoar src/orch90.c; the CoCo Zero has it on by default, PIZERO-148, coco_machine.cpp orch_owns). Plan: orch! ( left right -- ) for raw samples (unsigned, $80 = centre), orch-silence, and orch-play ( incL incR n -- ): a CODE loop that synthesises one wavetable voice per side (direct digital synthesis, 16-bit phase, the high byte indexing a 256-byte signed table from lib/wavetable.fs) for n samples at a fixed rate set by its cycle count, IRQs masked. Measure the loop with fc.py --cycles and derive the Hz-to-increment factor from it rather than estimating. XRoar has -cart orch90, so this can be tested in the emulator. PROGRESS 2026-10-24: lib/orch90.fs written (orch!, orch-silence, orch-wave, orch-play, orch-hz>inc, orch-frames). orch-play measured at 79 cycles a sample with fc.py --cycles (a straight-line copy of the loop body), so 11328 Hz on a CoCo 2; it indexes the wavetable with LDB A,X from the table's middle, as A is signed (a half-cycle phase shift, inaudible). Used by src/sound-tour. CLOSED 2026-10-24 on the user's word; heard in XRoar (-cart orch90) as part of the tour. reference.html docs: #636.", "type": "feature", "status": "done", "priority": "medium", "file": "lib/orch90.fs", "created": "2026-10-24", "updated": "2026-10-24"}, {"id": 634, "summary": "Sound tour demo: one tune on every sound option (1-bit, DAC, SN76489, CoCo PSG, Symphony-12, Orchestra-90)", "description": "User request 2026-10-24: 'create libraries and a new sound demo that exercises all of our sound generation options'. New src/sound-tour: a menu on the text screen, one key per option and one to play them all in turn, the same short public-domain phrase played on each so the voices can be compared: the 1-bit output ($FF22 bit 1, snd-tone1 in lib/sound.fs), the 6-bit DAC (lib/sound.fs square/triangle/saw), the SN76489 / GameMaster (lib/sn76489.fs: melody, bass and noise), the CoCo PSG (lib/ay8910.fs, #632, with its hardware envelope), the Symphony-12 (#632: chords across its four chips, in stereo), and the Orchestra-90CC (lib/orch90.fs, #633: one voice left, one right). Each section sets the sound multiplexer itself (DAC for the internal outputs, cartridge for the GameMaster and AY). Not covered, nothing to drive yet: YMF262/OPL3 (#580, and not in the CoCo Zero), the Speech/Sound Cartridge (PIZERO-249), YM2612 (no CoCo hardware). Testing: XRoar has the GameMaster and the Orchestra-90 (-cart gmc, -cart orch90); the AY sections need the CoCo Zero, so the build makes a .dsk too. PROGRESS 2026-10-24: src/sound-tour built (sound-tour.fs, tour.py, Makefile with make run in XRoar via a Multi-Pak holding gmc and orch90, and make dsk for the CoCo Zero). Phrase: the Ode to Joy opening, 30 notes, 768 frames (12.8 s a device). Measured loop costs: snd-tone1 42 + 14p cycles a period, snd-saw 36 + 7p a sample; worst tuning 2.7 cents (1-bit) and 8.3 cents (DAC saw). Found: fc.py strips parenthesised text inside .\" strings as a comment, so menu text avoids parentheses. 1-bit section seen running to the end in XRoar. UPDATE 2026-10-24: keys 4 and 5 now probe (ay-found?) and show NO COCO PSG FOUND / NO SYMPHONY-12 FOUND for 1.5 s instead of writing into the GameMaster; seen in XRoar. Symphony-12 chords raised to the bass's level (15 - bl): rendered loudness rms 217 against the PSG's 231, was 177. Another parenthesised string (YM2149) caught and reworded. CLOSED 2026-10-24 on the user's word. Keys 1, 2, 3 and 6 played in XRoar; 4 and 5 verified by trace and host render only, hearing them on the CoCo Zero is #635.", "type": "feature", "status": "done", "priority": "medium", "file": "src/sound-tour/sound-tour.fs", "created": "2026-10-24", "updated": "2026-10-24"}, {"id": 635, "summary": "Hear the sound tour's AY sections on a CoCo Zero", "description": "Remainder of #632 and #634. src/sound-tour keys 4 (CoCo PSG) and 5 (Symphony-12, stereo) have only been checked off the hardware: an XRoar trace of the program's AY bus writes matched a Python model exactly, and those writes rendered through the CoCo Zero's psg_ay8910.h on the Mac sounded fine to the user; ay-found? was checked against ayb_write/ayb_read on the host. Stock XRoar has no AY cartridge, so they can only be heard on the CoCo Zero: boot src/sound-tour/build/sound-tour.dsk (make dsk), press 4 and 5. Listen for: pitch matching keys 3 and 6, the melody's envelope decay, chords and the left/right split on the Symphony-12 (stereo jumper on), and level against the PSG. If it sounds wrong there but the host render does not, the CoCo Zero project's session should look at its real-time AY path; one thing to try from this side is skipping unchanged register writes (the tour rewrites every level every frame, about 1500 writes a second). CLOSED 2026-10-26: user played sound-tour.dsk on the CoCo Zero, keys 4 and 5: 'it sounds good'.", "type": "test", "status": "done", "priority": "medium", "file": "src/sound-tour/sound-tour.fs", "created": "2026-10-24", "updated": "2026-10-26"}, {"id": 636, "summary": "reference.html: document lib/ay8910.fs and lib/orch90.fs", "description": "Remainder of #632 and #633. Both libraries are in the auto-generated lib/README.md but not in reference.html. Cover for ay8910.fs: the two cartridges and their addresses, chip selection by mask (ay-chips), the Symphony-12 latch/write/read protocol on its PIA, ay-found? and why it must come first (a GameMaster decodes the CoCo PSG's odd addresses), periods (125000 / Hz at 2 MHz, 55930 / Hz on the Symphony-12), mixer bits and envelope shapes. For orch90.fs: orch-play's direct digital synthesis at 79 cycles a sample (11328 Hz on a CoCo 2), orch-hz>inc's range, and that IRQs are masked while it plays. Alongside #589, #607 and #630. FOLDED 2026-10-26 into #637, which brings the whole library reference up to date in one pass.", "type": "docs", "status": "closed", "priority": "low", "file": "reference.html", "created": "2026-10-24", "updated": "2026-10-26"}, {"id": 637, "summary": "reference.html: bring the library reference up to date", "description": "User request 2026-10-26. reference.html (last changed 2026-10-14) is the official library reference; lib/README.md (generated by tools/gen-lib-readme.py) is current, but reference.html has no section for 9 of the 30 libraries: sn76489.fs, cg-tiny.fs, vgm.fs, ay8910.fs, orch90.fs, decb.fs, font-art.fs, prox.fs, bye.fs. Folds in #589, #607, #630 and #636. Plan: follow the existing per-library section format; group the sound chips (sn76489, vgm, ay8910, orch90) with the existing sound sections, covering addresses, the cartridge multiplexer (cart-audio), the shared field-sync handler, ay-found?, and the measured timings. Verify: every word each file's Provides: line lists appears in its section; the page's anchors and table of contents resolve; served over HTTP and fetched with curl (no browser). PROGRESS 2026-10-26: nine sections written into reference.html (572 lines), in the existing ref-section format, each beside its nearest relative: Program Exit (bye.fs) after Screen Utilities, Artifact-Safe Font (font-art.fs) after Bitmap Font, Tiny CG Text (cg-tiny.fs) after CG Mode Text Rendering, Proximity Query (prox.fs) after the sprite/beam sections, DECB Disk Files (decb.fs) after Becker Port, and SN76489 / VGM / AY-3-8910 / Orchestra-90 after Asynchronous Sound, the SN76489 section opening with a note on cartridge sound (cart-audio, which emulators have which chip). font-art follows its source (59 glyphs $20-$5A, 472 bytes to font-base); lib/README.md's generated description of it (37 glyphs at $6000) is stale, from the comment above glyph-addr/init-font. Checked: every Provides word has a row in its section; div and table tags balance (58/58, 54/54); served over HTTP and fetched with curl, 200. No em dashes in the new text. Not checked: how it looks in a browser. ALSO 2026-10-26: tools/gen-lib-readme.py looked reference.html descriptions up by word name alone, so libraries sharing a word (font5x7.fs and font-art.fs both define init-font and glyph-addr) got each other's text; that is where lib/README.md's stale '37 glyphs at $6000' for font-art came from. Now keyed by (lib file, word): each row belongs to the nearest preceding <p class=\"lib-path\">INCLUDE lib/X<\/p>, falling back to the first row of that name anywhere (kernel primitives described inside a library's section). Word names are HTML-unescaped (orch-hz&gt;inc). Checked against the old generator: the same 63 pre-existing source/reference drift warnings, words without descriptions 13 -> 11, and font5x7/font-art now each show their own. Also fixed the Bitmap Font section's init-font row: it said $6000; the code copies to font-base ($5800 ROM mode, $9000 all-RAM). CLOSED 2026-10-26 on the user's word. Remainder filed as #638: the 63 pre-existing source/reference drift warnings and the 11 words with no description.", "type": "docs", "status": "done", "priority": "medium", "file": "reference.html", "created": "2026-10-26", "updated": "2026-10-26"}, {"id": 638, "summary": "Library docs: settle the 63 source/reference.html description mismatches and 11 undescribed words", "description": "Remainder of #637. python3 tools/gen-lib-readme.py warns, for 63 words, that the description comment in the .fs source differs from the reference.html row (source wins in lib/README.md), e.g. wavetable.fs gen-sine and gen-sine-hq; these predate #637 (the old generator gave the same 63). It also lists 11 words with no description from either place, mostly async-sound.fs voice variables (snd-env, snd-frames, snd-inc, snd-phase, snd-rm-count, snd-rm-period, snd-rm-sign, snd-seed, snd-slide, snd-wave-base, snd-wave-mode, freq>inc). Go through the warnings and make each pair agree (fix whichever is wrong), and describe the rest, until the generator runs clean.", "type": "docs", "status": "open", "priority": "low", "file": "tools/gen-lib-readme.py", "created": "2026-10-26", "updated": "2026-10-26"}, {"id": 639, "summary": "Refresh ROADMAP.md, add roadmap.jsonl, and build issues.html", "description": "User request 2026-10-26: 'update the roadmap and look at the issues.html'. ROADMAP.md was last changed 2026-10-12 (#553) and says nothing of the sound work since (#579-#638: SN76489, jukebox, VGM, AY, Orchestra-90, sound tour, library reference). The project has no issues.html and no roadmap.jsonl. Plan: refresh ROADMAP.md against the tracker's statuses; add roadmap.jsonl (rank, id, why, added) as the short ranked next-work list; copy the issues skill's issues_html.py into tools/ so the project is self-contained, add a make target, build issues.html and commit it; verify the inlined snapshot against the .jsonl files and fetch over HTTP with curl (no browser). PROGRESS 2026-10-26: ROADMAP.md refreshed against the tracker: 'where things stand' rewritten; Track 1 drops #407 (done) and adds #539, #577, #537, #638; Track 2 names the CoCo Zero as where work meets hardware and lists #635 and #605; Track 3 adds fc.py #592; Track 4 (sound) rewritten around the October work, open #629, #631 (on hold), #580, #615-#617, #582/#583, #596/#606, #587/#593 plus the async-sound items; new Track 5 for the terminal (#558, #559, #561, #562, #578); 'suggested next move' points at roadmap.jsonl. roadmap.jsonl ranks 7: #635, #605, #409, #551, #592, #467, #629, each with its reason. tools/issues_html.py copied from the issues skill; make issues builds issues.html (375 issues, 7 roadmap entries). Checked: inlined snapshot matches both .jsonl files with ids in order and no roadmap entry on a closed issue; issues.html, issues.jsonl and roadmap.jsonl fetch 200 over HTTP. CLAUDE.md and RESOURCES.md tables gain roadmap.jsonl and issues.html; CLAUDE.md's stale-doc warning (ROADMAP.md undecided on #551, fixed by #553) replaced by a Roadmap note. Not checked: the page in a browser. Then #635 and #605 passed on the CoCo Zero (user, 2026-10-26), were closed and taken off roadmap.jsonl, which now ranks #409, #551, #592, #467, #629; ROADMAP.md Track 2 updated to match. CLOSED 2026-10-26 on the user's word ('commit and push').", "type": "docs", "status": "done", "priority": "medium", "file": "ROADMAP.md", "created": "2026-10-26", "updated": "2026-10-26"}, {"id": 640, "summary": "Demos: put the October demos on demos.dsk and in the appendix, and give every demo a README", "description": "User request 2026-10-26: 'are all the demos sorted? documented, and included in the demo.dsk?' They were not. Audit: the 14 older demos are built by the root Makefile (DEMOS), on build/demos.dsk and in the demo appendix (tutorials/demos/index.html). colored-text is built and in the appendix but not on the disk. jukebox, sound-sn76489 (the Badinerie), sound-tour and terminal are in none of the three. hello, fujinet-time, rg-test and decb-test have no README. Out of scope: decb-test and vgm-test are test programs (they stay off the disk and out of the appendix, but get READMEs), and src/vader has no CoCo program (Claude draws it through the terminal). Plan: add the four to DEMOS and the dsk target with the Badinerie's .SNG and .VGM so the jukebox finds a song on the same disk, and colored-text to the disk; root make demos builds only the .bin of each demo (a demo.mk 'bin' target), so it still needs no decb; appendix entries for the five, each saying what hardware it needs (GameMaster, Orchestra-90, CoCo Zero for the AY chips, Becker port and bridge for the terminal); READMEs for the four. Verify: make demos and make dsk from clean, decb dir of the disk, the jukebox run from demos.dsk finding its songs, the appendix served and fetched with curl. DONE 2026-10-26, pending the user's look. Found: a DECB disk is 68 granules and every binary carries its kernel, so all programs plus the jukebox's songs do not fit one disk (demos.dsk was full at 63 with the October demos added). So: demos.dsk keeps its 14 and adds COLORTXT and TERMINAL (16, 13 granules free); new build/sound.dsk (make sound-dsk, in make dsks) has SOUNDTUR first for CoCo Zero autorun, SOUND, SOUND1B, SNDASYNC, BADINERI, JUKEBOX, BADINERI.SNG and .VGM (34 free). Root DEMOS adds sound-sn76489, sound-tour, jukebox, terminal; make demos calls each demo's new 'bin' target (make/demo.mk) so the jukebox's disk is not built and decb is not needed; make clean calls each demo's clean (it guessed calc.bin and badinerie.bin wrong) and removes sound.dsk. 17 tracked demo binaries rebuilt: they predated the kernel PICK fix (#591). Appendix (tutorials/demos): 19 entries, new Claude Code Terminal under Text & Interaction and a Cartridge Sound section (Badinerie, Sound Tour, COCO.FM Jukebox), each with a 640x512 XRoar capture and a 'Needs:' line; intro says demos.dsk or sound.dsk. Disk guide (tutorials/dsk-workflow) updated for 16 programs and a Sound Disk section. READMEs written for hello, fujinet-time, rg-test, decb-test; appendix links for rg-test and fujinet-time now say 'source & README'. site/ regenerated (validation clean). Verified: make clean then make dsk sound-dsk rebuilds both disks byte-identical; jukebox run from sound.dsk in XRoar (Multi-Pak rsdos + gmc) finds both songs and plays (TRACK 02/02, 1:26); appendix, images and site copies fetch 200 over HTTP; every appendix image exists. Note: the old make clean also deletes the tracked build/tutorial.dsk (restored from git; still true). CLOSED 2026-10-26 on the user's word. Remainder filed as #641.", "type": "docs", "status": "done", "priority": "medium", "file": "Makefile", "created": "2026-10-26", "updated": "2026-10-26"}, {"id": 641, "summary": "make clean deletes the committed disk images", "description": "Remainder of #640. The root Makefile's clean target removes build/demos.dsk, build/sound.dsk and build/tutorial.dsk, and all three are tracked in git (build/ is ignored, the images are force-added because a clone should have them). After make clean a working tree shows them deleted until make dsk / sound-dsk / tutorial-dsk runs again; tutorial.dsk is built from the committed tutorial binaries, so it is easy to forget. Decide: either clean leaves the tracked images alone (a separate distclean removes them), or keep it and say so in the disk build guide (tutorials/dsk-workflow).", "type": "chore", "status": "open", "priority": "low", "file": "Makefile", "created": "2026-10-26", "updated": "2026-10-26"}, {"id": 642, "summary": "README.md: bring it up to date with October's work", "description": "User request 2026-10-26: 'update the readme with the latest changes'. README.md (title 'CoCo Forth, Version 1.2') predates October: the cartridge sound libraries (SN76489 and VGM, AY-3-8910, Orchestra-90), the sound tour, the jukebox, the DECB disk reader, the complete library reference, the two demo disks (demos.dsk and the new sound.dsk), issues.html and roadmap.jsonl. Version stays 1.2 (user held off on a release 2026-10-26). Update the parts that describe what exists; keep its structure and voice; no em dashes in new text. PROGRESS 2026-10-26: added a 'Since 1.2 (unreleased)' note on the cartridge sound chips, the sound tour, jukebox, Badinerie, lib/decb.fs and the complete reference; directory layout now names the sound and disk libraries (30 in lib/, index lib/README.md), the October demos, tutorials/, reference.html, both demo disks, ROADMAP.md/roadmap.jsonl and issues.jsonl/issues.html; Load from Disk adds make dsk / make sound-dsk and what the cartridge demos need; the Hello World example is now src/hello/hello.fs as it is (prints BARE NAKED FORTH 1.2 from KERN-VERSION, BREAK to BASIC; checked line by line). Kernel count corrected 81 -> 84 primitives (87 CFAs in kernel.map minus font-data, sprite-data, sin-data), in README.md and CLAUDE.md. No em dashes in new text; version stays 1.2. CLOSED 2026-10-26 on the user's word.", "type": "docs", "status": "done", "priority": "medium", "file": "README.md", "created": "2026-10-26", "updated": "2026-10-26"}], "roadmap": [{"rank": 1, "id": 409, "why": "Biggest lever in Track 1: runnable XRoar in the docs turns reading into playing, and every demo and tutorial chapter benefits. Independent of #551, so it can go at once. (The hardware checks ahead of it, #635 and #605, passed on 2026-10-26.)", "added": "2026-10-26"}, {"rank": 2, "id": 551, "why": "The north star (on-device self-hosting). Its first spike, the postfix assembler's indexed-postbyte encoder diffed against lwasm, carries the project's biggest unknown, so start retiring it rather than polishing around it.", "added": "2026-10-26"}, {"rank": 3, "id": 467, "why": "Bulk polish of every demo, now including the jukebox and sound tour. High value but large and divisible, so it follows the gating items.", "added": "2026-10-26"}, {"rank": 4, "id": 629, "why": "VGM streaming from disk: without it only about 28 seconds of a VGM fits, which caps what VGM support is worth. Also the way to unblock real game rips (#631).", "added": "2026-10-26"}]}</script>
<script>
(function () {
  var STATUS_ORDER = ['open', 'in-progress', 'done', 'deferred', 'wontfix'];
  var PRIORITY_ORDER = ['high', 'medium', 'low'];
  var TAG_PILL_LIMIT = 20;   // the rest hide behind a "+N more" toggle
  // Themes are the coarse grouping: one per issue, from a fixed vocabulary,
  // unlike the free-form tags. Order is the order they are worked in.
  var THEME_ORDER = ['trust', 'kit', 'input', 'experience', 'platform', 'storage', 'devices'];
  var LIVE = ['open', 'in-progress'];
  var KEY = 'issues-view:' + location.pathname;
  // Longest alternative first: "jsonl" must win over "json".
  var PATH_RE = /\b((?:[\w.-]+\/)*[\w.-]+\.(?:jsonl|json|md|html|css|js|ts|tsx|jsx|py|rb|go|rs|java|c|h|cpp|sh|toml|ya?ml|cfg|ini|txt|bas|dsk|png))(:\d+(?:-\d+)?)?/g;

  var issues = [];
  var active = { status: [], type: [], tag: [], theme: [] };
  var q = document.getElementById('q');
  var list = document.getElementById('list');
  var count = document.getElementById('count');
  var empty = document.getElementById('empty');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function rank(v, order) {
    var i = order.indexOf(v);
    return i === -1 ? order.length : i;
  }

  function markup(text) {
    return String(text).split('\n\n').map(function (para) {
      return '<p>' + esc(para).replace(PATH_RE, '<code>$&</code>').replace(/\n/g, '<br>') + '</p>';
    }).join('');
  }

  function summaryOf(i) { return i.summary || i.title || '(untitled)'; }
  function tagsOf(i) { return i.tags || i.labels || []; }

  function card(i) {
    var status = i.status || '?', priority = i.priority || '?', type = i.type || '?';
    var el = document.createElement('article');
    el.className = 'card';
    el.id = 'i' + i.id;
    el.dataset.status = status;
    el.dataset.type = type;
    el.dataset.tags = tagsOf(i).join(' ');
    el.dataset.theme = i.theme || '';
    el.innerHTML =
      '<header><button class="row" aria-expanded="false">' +
      '<span class="id">#' + esc(i.id) + '</span>' +
      '<span class="summary">' + esc(summaryOf(i)) + '</span>' +
      '<span class="chips">' +
        '<span class="chip st-' + esc(status) + '">' + esc(status) + '</span>' +
        '<span class="chip pr-' + esc(priority) + '">' + esc(priority) + '</span>' +
        '<span class="chip ty">' + esc(type) + '</span>' +
        (i.theme ? '<span class="chip th">' + esc(i.theme) + '</span>' : '') +
      '</span><span class="caret" aria-hidden="true"></span></button></header>' +
      '<div class="body" hidden><div class="desc">' +
      markup(i.description || '(no description)') + '</div><footer>' +
      tagsOf(i).map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') +
      '<span class="meta"><code>' + esc(i.file || '-') + '</code> &middot; created ' +
      esc(i.created || '?') + ' &middot; updated ' + esc(i.updated || '?') +
      '</span></footer></div>';
    el.querySelector('.row').addEventListener('click', function () {
      setOpen(el, el.querySelector('.body').hidden);
    });
    return el;
  }

  function setOpen(el, open) {
    el.querySelector('.row').setAttribute('aria-expanded', open);
    el.querySelector('.body').hidden = !open;
  }

  // The roadmap stores only rank, id and why. Everything shown here is joined
  // from the tracker, so an entry pointing at a missing or finished issue is
  // visibly wrong rather than quietly stale.
  function drawRoadmap(plan, byId) {
    if (!plan.length) return;
    var host = document.getElementById('plan');
    plan.slice().sort(function (a, b) { return (a.rank || 0) - (b.rank || 0); })
      .forEach(function (e) {
        var issue = byId[e.id];
        var li = document.createElement('li');
        li.className = 'step';
        var head, warn = '';
        if (!issue) {
          head = '#' + esc(e.id) + ' is not in the tracker';
          warn = 'no such issue';
          li.className += ' bad';
        } else {
          head = '<a href="#i' + esc(e.id) + '">#' + esc(e.id) + ' ' +
                 esc(summaryOf(issue)) + '</a> <span class="chip st-' +
                 esc(issue.status) + '">' + esc(issue.status) + '</span>';
          if (LIVE.indexOf(issue.status) === -1) {
            warn = 'already ' + issue.status + ', take it off the roadmap';
            li.className += ' bad';
          }
        }
        li.innerHTML = '<span class="rank">' + esc(e.rank || '?') + '.</span>' +
          '<span class="what">' + head +
          '<span class="why">' + esc(e.why || '') + '</span>' +
          (warn ? '<span class="warn">' + esc(warn) + '</span>' : '') + '</span>';
        var link = li.querySelector('a');
        if (link) {
          link.addEventListener('click', function () {
            var target = document.getElementById('i' + e.id);
            if (target) { target.hidden = false; setOpen(target, true); }
          });
        }
        host.appendChild(li);
      });
    document.getElementById('roadmap').hidden = false;
  }

  function pills(host, filter, values, counts, limit) {
    var hidden = (limit && values.length > limit) ? values.length - limit : 0;
    document.getElementById(host).innerHTML = values.map(function (v, idx) {
      var extra = hidden && idx >= limit;
      return '<button class="pill' + (extra ? ' extra' : '') + '"' +
        (extra ? ' hidden' : '') +
        ' data-filter="' + filter + '" data-value="' + esc(v) + '">' +
        esc(v) + (counts ? ' <span class="n">' + counts[v] + '</span>' : '') + '</button>';
    }).join('') + (hidden
      ? '<button class="morebtn" data-host="' + host + '">+' + hidden + ' more</button>'
      : '');
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({ active: active, q: q.value }));
    } catch (e) {}
  }

  function apply() {
    var needle = q.value.trim().toLowerCase();
    var shown = 0;
    [].forEach.call(list.children, function (el) {
      var ok =
        (!active.status.length || active.status.indexOf(el.dataset.status) !== -1) &&
        (!active.type.length || active.type.indexOf(el.dataset.type) !== -1) &&
        (!active.theme.length || active.theme.indexOf(el.dataset.theme) !== -1) &&
        (!active.tag.length || active.tag.some(function (t) {
          return el.dataset.tags.split(' ').indexOf(t) !== -1;
        })) &&
        (!needle || el.textContent.toLowerCase().indexOf(needle) !== -1);
      el.hidden = !ok;
      if (ok) shown++;
    });
    empty.hidden = shown !== 0;
    count.textContent = shown + ' of ' + issues.length + ' shown';
    [].forEach.call(document.querySelectorAll('.pill'), function (p) {
      p.setAttribute('aria-pressed', active[p.dataset.filter].indexOf(p.dataset.value) !== -1);
    });
    save();
  }

  function draw(data, plan, note) {
    issues = data.slice().sort(function (a, b) {
      return rank(a.status, STATUS_ORDER) - rank(b.status, STATUS_ORDER) ||
             rank(a.priority, PRIORITY_ORDER) - rank(b.priority, PRIORITY_ORDER) ||
             (a.id || 0) - (b.id || 0);
    });

    var counts = {}, byId = {};
    STATUS_ORDER.forEach(function (s) { counts[s] = 0; });
    issues.forEach(function (i) {
      counts[i.status] = (counts[i.status] || 0) + 1;
      byId[i.id] = i;
    });

    list.innerHTML = '';
    issues.forEach(function (i) { list.appendChild(card(i)); });
    drawRoadmap(plan || [], byId);

    pills('f-status', 'status', STATUS_ORDER.filter(function (s) { return counts[s]; }), counts);
    pills('f-type', 'type', unique(issues.map(function (i) { return i.type || '?'; })));

    var themeCounts = {};
    issues.forEach(function (i) {
      if (i.theme) themeCounts[i.theme] = (themeCounts[i.theme] || 0) + 1;
    });
    var themes = THEME_ORDER.filter(function (t) { return themeCounts[t]; })
      .concat(Object.keys(themeCounts).filter(function (t) {
        return THEME_ORDER.indexOf(t) === -1;
      }).sort());
    document.getElementById('f-theme').parentNode.hidden = !themes.length;
    pills('f-theme', 'theme', themes, themeCounts);
    // A project can accumulate hundreds of tags, most of them used once.
    // Showing every one buries the results, so lead with the most used and
    // keep the long tail behind a toggle.
    var tagCounts = {};
    issues.forEach(function (i) {
      tagsOf(i).forEach(function (t) { tagCounts[t] = (tagCounts[t] || 0) + 1; });
    });
    var tagNames = Object.keys(tagCounts).sort(function (a, b) {
      return tagCounts[b] - tagCounts[a] || (a < b ? -1 : a > b ? 1 : 0);
    });
    pills('f-tag', 'tag', tagNames, tagCounts, TAG_PILL_LIMIT);

    [].forEach.call(document.querySelectorAll('.pill'), function (p) {
      p.addEventListener('click', function () {
        var l = active[p.dataset.filter], i = l.indexOf(p.dataset.value);
        if (i === -1) l.push(p.dataset.value); else l.splice(i, 1);
        apply();
      });
    });

    [].forEach.call(document.querySelectorAll('.morebtn'), function (b) {
      b.addEventListener('click', function () {
        var host = document.getElementById(b.dataset.host);
        var extras = host.querySelectorAll('.pill.extra');
        var show = extras.length && extras[0].hidden;
        [].forEach.call(extras, function (p) { p.hidden = !show; });
        b.textContent = show ? 'fewer' : '+' + extras.length + ' more';
      });
    });

    var open = (counts.open || 0) + (counts['in-progress'] || 0);
    document.getElementById('lede').innerHTML =
      issues.length + ' issues, ' + open + ' of them still open' +
      ((plan && plan.length) ? ', ' + plan.length + ' on the roadmap' : '') +
      '. Read from <code>issues.jsonl</code>.';
    if (note) {
      var n = document.getElementById('note');
      n.textContent = note;
      n.hidden = false;
    }

    try {
      var s = JSON.parse(localStorage.getItem(KEY) || '{}');
      if (s.active) active = s.active;
      if (s.q) q.value = s.q;
    } catch (e) {}

    apply();

    if (location.hash) {
      var target = document.querySelector(location.hash);
      if (target && target.classList.contains('card')) {
        target.hidden = false;
        setOpen(target, true);
        target.scrollIntoView();
      }
    }
  }

  function unique(a) {
    return a.filter(function (v, i) { return a.indexOf(v) === i; }).sort();
  }

  q.addEventListener('input', apply);
  document.getElementById('reset').addEventListener('click', function () {
    active = { status: [], type: [], tag: [], theme: [] };
    q.value = '';
    apply();
  });
  document.getElementById('expand').addEventListener('click', function () {
    [].forEach.call(list.children, function (c) { if (!c.hidden) setOpen(c, true); });
  });
  document.getElementById('collapse').addEventListener('click', function () {
    [].forEach.call(list.children, function (c) { setOpen(c, false); });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
    if (e.key === 'Escape' && document.activeElement === q) { q.value = ''; apply(); }
  });

  function lines(text) {
    return text.split('\n').filter(function (l) { return l.trim(); }).map(JSON.parse);
  }

  function grab(name) {
    return fetch(name, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(lines);
  }

  // The live files first. Browsers refuse a file:// fetch, so fall back to the
  // snapshot baked in at build time and say which one is on screen. A missing
  // roadmap.jsonl is not an error: the section just stays hidden.
  grab('issues.jsonl')
    .then(function (data) {
      grab('roadmap.jsonl')
        .catch(function () { return []; })
        .then(function (plan) { draw(data, plan); });
    })
    .catch(function () {
      var snap = JSON.parse(document.getElementById('snapshot').textContent);
      draw(snap.issues, snap.roadmap,
        'Showing the snapshot saved when this page was last built, because the browser would ' +
        'not read the .jsonl files from disk. To see them live, serve the directory ' +
        '(python3 -m http.server) and open it over http, or rebuild this page.');
    });
})();
</script>
</body>
</html>
