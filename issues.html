r is embedded (#409), publish docs/ as a static site (GitHub Pages likely). Includes tutorial, reference, demo appendix, and any guides. Point a domain or use the default github.io URL. Needs asset paths audited so the site works outside the repo layout.", "type": "docs", "status": "done", "priority": "high", "file": "docs/", "created": "2026-04-16", "updated": "2026-07-19"}, {"id": 411, "summary": "Replace tutorial illustrations with bespoke artwork", "description": "The current tutorial uses placeholder illustrations. Replace with human-generated bespoke images that match the tone of the project (playful, confident, retro-modern). Owner: Paul. Tracked here for visibility and so references can be swapped in the HTML as artwork arrives.", "type": "docs", "status": "open", "priority": "low", "file": "docs/", "created": "2026-04-16", "updated": "2026-06-16"}, {"id": 412, "summary": "Document the DSK build and distribution workflow", "description": "We already build build/demos.dsk via `make dsk` (Toolshed decb). Document the full workflow so someone else can reproduce it: installing Toolshed, running `make dsk`, verifying the image, loading on a real CoCoSDC or DriveWire, LOADM syntax. Part of delivering the distribution story — formerly listed as the SD card platform roadmap item, reframed as docs since the build pipeline already exists.", "type": "docs", "status": "done", "priority": "medium", "file": "tutorials/dsk-workflow/index.html", "created": "2026-04-16", "updated": "2026-07-01"}, {"id": 413, "summary": "Working-with-Claude guide — the modern Bare Naked Forth workflow", "description": "Standalone guide documenting the development loop: write Forth on a modern machine, cross-compile with fc.py, test in XRoar, deploy to real iron — with Claude Code as the collaborator throughout. Shows the practical flow (issues.jsonl tracking, measure-don't-estimate cycle counts, auto-launch XRoar for testing, kernel vs app trade-offs). Part promotional, part how-to — demonstrates a new kind of bespoke embedded workflow.", "type": "docs", "status": "done", "priority": "medium", "file": "tutorials/working-with-claude/index.html", "created": "2026-04-16", "updated": "2026-07-01"}, {"id": 414, "summary": "Reference doc audit — primitives, libraries, KCODE, variables", "description": "Review docs/reference.html end-to-end against ground truth. Verify every kernel primitive in kernel.asm is documented with correct stack effect. Verify all library words across forth/lib/*.fs are present and accurate. Document the KCODE directive (kernel-space CODE words). Document how CODE words can use FVAR-* (app-space) and KVAR-* (kernel-space) constants to reference variables. Fix any stale or missing entries. Also bumped base font-size to 17px and gave .stack-effect an explicit bold weight with the Menlo font stack so stack diagrams read clearly on macOS.", "type": "docs", "status": "done", "priority": "high", "file": "docs/reference.html", "created": "2026-04-16", "updated": "2026-04-16"}, {"id": 415, "summary": "Create legends/companies.md for CoCo companies and publishers", "description": "Add a new document in legends/ that catalogs CoCo-era companies and publishers, their founders/key people, and products. Initial categories: hardware manufacturers, game publishers, application publishers, OS-9 ecosystem vendors, magazines, and community organizations. Cross-link from legends/README.md and legends/whos-who.md.", "type": "docs", "status": "done", "priority": "medium", "file": "legends/companies.md", "created": "2026-04-20", "updated": "2026-04-20"}, {"id": 416, "summary": "Create legends/whos-who.md - comprehensive CoCo contributor roster", "description": "Alphabetical roster of every identified individual from the CoCo community with brief bios, known products, and cross-references to companies.md. Starts from existing README entries and grows as research progresses.", "type": "docs", "status": "done", "priority": "medium", "file": "legends/whos-who.md", "created": "2026-04-20", "updated": "2026-04-20"}, {"id": 417, "summary": "Restructure legends/README.md as CoCo Hall of Fame", "description": "Reframe the main legends document from a flat roster into a curated hall of fame. Retain subgroup and genre callouts with narrative context, then defer the full roster to whos-who.md. Preserve interesting references, relationships, contributions, and milestones as first-class sections.", "type": "docs", "status": "done", "priority": "medium", "file": "legends/README.md", "created": "2026-04-20", "updated": "2026-04-20"}, {"id": 418, "summary": "Research CoCo productivity/application software authors", "description": "Identify and document authors behind major CoCo productivity titles: Telewriter-64/128 (Cognitec), VIP Writer/Calc/Library, Color SCRIPSIT, AutoTerm, Simply Better, spreadsheets, terminal programs. Capture primary source citations (Rainbow ads, author interviews) where possible. Add to companies.md and whos-who.md.", "type": "docs", "status": "done", "priority": "low", "file": "legends/", "created": "2026-04-20", "updated": "2026-04-20"}, {"id": 419, "summary": "Research OS-9 ecosystem vendors and application authors", "description": "Catalog commercial OS-9 software and hardware vendors on CoCo: Microware (Ken Kaplan, Terry Ritter), Burke & Burke (Chris Burke - PowerBoost, CoCoXT), Hyper-I/O (Stephen Goldberg), Frank Hogg Labs, and OS-9 application authors (Wayne Campbell, Robert Gault, Bob van der Poel). Add to companies.md and whos-who.md.", "type": "docs", "status": "done", "priority": "low", "file": "legends/", "created": "2026-04-20", "updated": "2026-04-20"}, {"id": 420, "summary": "Research Rainbow Magazine columnists and contributors", "description": "Expand coverage of Rainbow Magazine beyond Lonnie Falk and Dale Puckett. Identify regular columnists, technical editors, and recurring authors across the magazine's 1981-1993 run. Candidate names to verify: Jim Reed, Wayne Day, Cray Augsburg, Jerry Semones, Dan Keen. Verify dates and roles against Rainbow archives.", "type": "docs", "status": "done", "priority": "low", "file": "legends/", "created": "2026-04-20", "updated": "2026-04-20"}, {"id": 421, "summary": "Research CoCoFEST organizers and modern community pillars", "description": "Document the Glenside Color Computer Club (long-running CoCoFEST host), Tony Podraza's role, modern CoCoFEST organizers, and current-era community pillars including the CoCo Crew Podcast hosts and CoCoTalk! livestreamers. Add to whos-who.md.", "type": "docs", "status": "done", "priority": "low", "file": "legends/", "created": "2026-04-20", "updated": "2026-04-20"}, {"id": 422, "summary": "Research Tandy/Microsoft CoCo ROM and BASIC authors", "description": "Identify the specific Microsoft engineers who wrote Color BASIC, Extended Color BASIC, Disk Extended Color BASIC, and Super ECB. Identify the Tandy/Radio Shack hardware engineers behind CoCo 1, CoCo 2, and CoCo 3. Primary sources likely include Tandy press archives and Microsoft historical records.", "type": "docs", "status": "done", "priority": "low", "file": "legends/", "created": "2026-04-20", "updated": "2026-04-20"}, {"id": 459, "summary": "Research international CoCo community - Dragon, Australia, UK", "description": "Document international contributors: Dragon 32/64 developers (UK, shared 6809 architecture), Australian CoCo community beyond Nick Marentes and Bob Devries, and any European demo scene or magazine figures. Cross-platform Dragon/CoCo software authors deserve special attention.", "type": "docs", "status": "icebox", "priority": "low", "file": "legends/", "created": "2026-04-20", "updated": "2026-06-16"}, {"id": 460, "summary": "Research DriveWire and modern CoCo toolchain authors", "description": "Identify authors and maintainers of DriveWire 4, GCC 6809, Brett Gordon's toolchain work, Toolshed, and other modern cross-development infrastructure. Names to confirm: Aaron Wolfe, Jim Hathaway, Brett Gordon.", "type": "docs", "status": "icebox", "priority": "low", "file": "legends/", "created": "2026-04-20", "updated": "2026-06-16"}, {"id": 461, "summary": "Research pre-XRoar CoCo emulator lineage", "description": "Document the history of CoCo emulation before XRoar became dominant. Jeff Vavasour's Color Computer Emulator was the first widely used. Nathan Woods wrote the original MAME CoCo driver. Capture version history and credit chain.", "type": "docs", "status": "icebox", "priority": "low", "file": "legends/", "created": "2026-04-20", "updated": "2026-06-16"}, {"id": 426, "summary": "Research independent CoCo hardware designers", "description": "Expand hardware coverage beyond current entries. Tony DiStefano (Disto - Super Controller, 512K upgrades), Chris Hawks (Hawksoft peripherals), Frank Hogg (Frank Hogg Labs - TC-9), and the J&M disk controller team. Verify founders and flagship products.", "type": "docs", "status": "done", "priority": "low", "file": "legends/", "created": "2026-04-20", "updated": "2026-04-20"}, {"id": 427, "summary": "Create legends/references.md - source citations for Hall of Fame", "description": "Running bibliography of primary and secondary sources behind every attribution in legends/ docs. Each claim in companies.md and whos-who.md should be traceable back to a source entry. Covers online archives (colorcomputerarchive.com, archive.org), books (Tandy's Little Wonder by Swygert, 1993), community histories (Coco Chronicles), interviews (Boyle/Kalish, Phillips/Lavinsky), and personal sites (mellowood.ca, lcurtisboyle.com).", "type": "docs", "status": "done", "priority": "medium", "file": "legends/references.md", "created": "2026-04-20", "updated": "2026-04-20"}, {"id": 462, "summary": "Promote rng/rnd to kernel primitives", "description": "Move the RNG from forth/lib/rng.fs into kernel.asm. Add VAR_SEED kernel variable, a CODE_RNG primitive ( -- ) that advances seed = seed*25173+13849, and a CODE_RND primitive ( n -- 0..n-1 ) for power-of-two ranges. Expose via fc.py kernel_words() as 'rng' and 'rnd', plus KVAR-SEED for direct access. Drop rng.fs (or keep the file as a thin compatibility shim). Estimated ~25 bytes of kernel. Benefits: every app gets a fast RNG without INCLUDE; demos (Tetris, Rain, Kaleidoscope) save Forth dispatch overhead on every random call. IMPLEMENTED 2026-05-05: added VAR_SEED storage, CODE_RNG and CODE_RND primitives (CODE_RND inlines the LCG advance for one-call randomness). fc.py exposes rng/rnd/kvar-seed; rng.fs reduced to a single-line shim mapping the legacy `seed` name to kvar-seed. Kernel +91 bytes (both ROM and all-RAM variants). tetris/rain/kaleidoscope rebuilt cleanly against the new kernel.", "type": "enhancement", "status": "done", "priority": "medium", "file": "forth/kernel/kernel.asm", "created": "2026-04-16", "updated": "2026-05-05"}, {"id": 463, "summary": "FujiNet support: lib/fujinet.fs with RTC (FN-TIME)", "description": "Add a Forth library that talks to the CoCo FujiNet cartridge. Scope this issue: dw-write / dw-read CODE words that wrap the FujiNet cart's bit-banger ROM vectors at $F9FE / $FA00 (mirroring the calling convention used by fujinet-lib/coco/src/bus/dwread.c and dwwrite.c — X=buffer, Y=length, carry-out=success). Plus fn-ready (DriveWire $E2,$00 ping handshake) and fn-time (sends $23, reads 6 bytes [year-1900, mm, dd, hh, mm, ss]). CODE words must save the kernel S register (which lives at $DFxx, inside the ROM-mapped overlay) and switch to a temp stack via PC-relative addressing before flipping SAM TY to ROM mode (STA $FFDE) for the JSR, then restore all-RAM (STA $FFDF) and S after. This is the same stack-relocation pattern documented in src/sound/SOUND.md — sound's audio path is broken for unrelated PIA reasons but the call/return mechanism is proven. Demo: src/fujinet-time/fujinet-time.fs displays YYYY.MM.DD HH:MM:SS on the VDG screen. Future issues will add network/disk APIs.", "type": "enhancement", "status": "done", "priority": "medium", "file": "forth/lib/fujinet.fs", "created": "2026-04-20", "updated": "2026-04-21"}, {"id": 464, "summary": "Demo: future-retro analog+digital clock backed by FujiNet RTC", "description": "src/clock/clock.fs — showcase demo for the FujiNet RTC library. RG6 (256x192, 3-color artifact palette). Composition: large centered analog face (~120px diameter) with white circle outline, 12 white tick marks (longer at 12/3/6/9), no numerals; hour hand (thick white, ~1/3 radius), minute hand (thin white, ~2/3 radius), second hand (thin red, ~3/4 radius) sweeping smoothly at vsync rate; small filled white center pin. Digital block below: HH:MM:SS with red colon that pulses on the second, date YYYY.MM.DD on the line above. Small 'FUJI' badge in a corner with a red dot that flashes briefly on each successful FN sync. Time source: query fn-time once at boot, then advance locally via 60Hz vsync counter (NTSC is actually 59.94Hz, ~1s drift per 17min). Resync every ~5min (configurable) absorbs drift. Animation: beam.fs trace/draw/restore for flicker-free hand redraw — no full double buffer needed. Math: trig.fs for sin/cos. Strokes: rg-pixel.fs (rg-line). Text: rg-text.fs / font-art.fs. Hand angles from 12: hour=(h*30+m/2), minute=(m*6+s/10), second=(s*6+vsync_in_sec/10).", "type": "demo", "status": "done", "priority": "high", "file": "src/clock/clock.fs", "created": "2026-04-21", "updated": "2026-04-22"}, {"id": 465, "summary": "Clock: double-buffer to eliminate hand-tick flicker", "description": "src/clock/clock.fs currently does erase-all + redraw-all-hands inline on the visible VRAM, which spans more than one vblank window and produces a brief flicker each second. Switch to true double-buffering: allocate a second 6KB RG6 VRAM at $A000-$B7FF (clear of font at $9000 and kernel at $E000), keep both buffers initialised with face + ticks + pin + label chars, then per second-tick render new hands and digital readout to the back buffer and flip SAM-F at vsync. Each VRAM needs its own set of 3 beam-path buffers (SC/MN/HR) since each buffer's previous hand state is independent. Display stays at 60fps even though the render itself can span 2-3 frames; flip is instant. Cost: ~6KB extra RAM (have it), ~150 bytes extra beam state, more complex init. End result: zero visible flicker on tick.", "type": "enhancement", "status": "done", "priority": "medium", "file": "src/clock/clock.fs", "created": "2026-04-22", "updated": "2026-04-22"}, {"id": 466, "summary": "Clock: sub-vsync precision for vps calibration", "description": "src/clock/clock.fs adaptive vsync calibration uses 16-bit integer vps, which truncates the fractional part of vps-cnt/real-sec. That leaves up to ~0.5 sec/min residual drift between FN syncs. Fix: scale vps and vs-cnt by 16 (4 fractional bits). INITIAL-VPS becomes 960. tick-frame increments vs-cnt by 16 instead of 1. New helper scaled-div computes (a*16)/b safely without 16-bit overflow by splitting a into quot+rem first (vps-cnt up to ~4000 would overflow if directly multiplied by 16). EWMA blending unchanged (just operates at higher precision). Drops residual drift to ~0.03 sec/min — invisible.", "type": "enhancement", "status": "done", "priority": "medium", "file": "src/clock/clock.fs", "created": "2026-04-22", "updated": "2026-04-22"}, {"id": 467, "summary": "Audit + polish all demos to be exceptional and bullet-proof", "description": "These demos are showcase examples of bare-naked Forth as a development environment for the CoCo Renovation project. They should be exceptional. Audit each src/* demo and file specific sub-issues for any defect, rough edge, or missed polish. Demos in scope: bounce, calculator, clock, fujinet-time, kaleidoscope, rain, rg-test, sound (broken-known), tetris, typewriter, vdg-modes. Audit dimensions: (1) timing/sync correctness (no drift, no flicker, no tearing); (2) input handling (debounce, edge cases, key release); (3) graceful error handling (no crashes on missing devices like FN); (4) visual quality (artifact-color hygiene, composition, overlap-free animation); (5) clean exits (HALT vs spin); (6) documentation header in each .fs (purpose, build, load, controls). Each defect gets a distinct sub-issue.", "type": "audit", "status": "open", "priority": "high", "file": "src/", "created": "2026-04-22", "updated": "2026-04-22"}, {"id": 468, "summary": "bounce: missing Build/Load documentation header", "description": "bounce.fs describes Controls but lacks Build: and Load: documentation. Users won't know how to compile and run it. Add standard header:\n\nBuild:   make\nLoad:    LOADM\"BOUNCE\":EXEC", "type": "polish", "status": "done", "priority": "medium", "file": "src/bounce/bounce.fs", "created": "2026-04-22", "updated": "2026-04-26"}, {"id": 469, "summary": "bounce: infinite AGAIN loop without exit sequence", "description": "bounce.fs line 212 uses BEGIN...AGAIN with no exit condition. The demo runs forever with no way to cleanly exit. Should add a quit key (e.g. BREAK) or document that users must close XRoar / power-cycle the CoCo.", "type": "polish", "status": "done", "priority": "low", "file": "src/bounce/bounce.fs", "created": "2026-04-22", "updated": "2026-04-28"}, {"id": 423, "summary": "bounce: doesn't restore text mode on exit", "description": "bounce.fs switches to RG mode (rg-init at line 92) but never calls reset-text before exiting. If the program halts, the screen stays in RG mode instead of VDG text. Should restore VDG text mode for a clean exit.", "type": "polish", "status": "done", "priority": "medium", "file": "src/bounce/bounce.fs", "created": "2026-04-22", "updated": "2026-04-28"}, {"id": 424, "summary": "calculator: missing Build/Load documentation header", "description": "calc.fs has no Build: or Load: instructions at the top. Add standard header.", "type": "polish", "status": "done", "priority": "medium", "file": "src/calculator/calc.fs", "created": "2026-04-22", "updated": "2026-04-26"}, {"id": 425, "summary": "calculator: FLASH-AT busy-wait uses hardcoded iteration count", "description": "calc.fs line 239: `2000 0 DO LOOP` is a hardcoded delay loop (~2ms on ~0.9 MHz CPU). Timing-dependent and non-portable across CoCo speeds. Better: count VSYNC frames or use a kernel-provided delay primitive. DONE 2026-05-08: replaced `2000 0 DO LOOP` busy-wait in FLASH-AT with `6 0 DO vsync LOOP` (six 60Hz frames ≈ 100ms). Frame-paced so the flash duration is identical at SAM 0.89 MHz and 1.78 MHz instead of dropping by half.", "type": "polish", "status": "done", "priority": "low", "file": "src/calculator/calc.fs", "created": "2026-04-22", "updated": "2026-05-08"}, {"id": 470, "summary": "kaleidoscope: missing Build/Load documentation header", "description": "kaleidoscope.fs has no Build: or Load: instructions. Add standard header.", "type": "polish", "status": "done", "priority": "medium", "file": "src/kaleidoscope/kaleidoscope.fs", "created": "2026-04-22", "updated": "2026-04-26"}, {"id": 471, "summary": "kaleidoscope: infinite loop with no exit path", "description": "kaleidoscope.fs line 124 uses 0 UNTIL (infinite loop). No quit key or exit condition. Same pattern as bounce/rain. Add a quit key or document explicitly.", "type": "polish", "status": "done", "priority": "low", "file": "src/kaleidoscope/kaleidoscope.fs", "created": "2026-04-22", "updated": "2026-04-28"}, {"id": 428, "summary": "kaleidoscope: doesn't restore text mode on exit", "description": "kaleidoscope.fs calls set-sam-f and set-sam-v to switch video modes but never restores VDG text. Screen stays in graphics mode if the program halts. Should call reset-text before HALT.", "type": "polish", "status": "done", "priority": "medium", "file": "src/kaleidoscope/kaleidoscope.fs", "created": "2026-04-22", "updated": "2026-04-28"}, {"id": 429, "summary": "rain: missing Build/Load documentation header", "description": "rain.fs lacks Build: and Load: instructions. Add standard header.", "type": "polish", "status": "done", "priority": "medium", "file": "src/rain/rain.fs", "created": "2026-04-22", "updated": "2026-04-26"}, {"id": 430, "summary": "rain: infinite loop with no exit path", "description": "rain.fs line 192 uses 0 UNTIL (infinite). No quit key. Add a quit key or document explicitly. DONE 2026-05-08: added `KEY? IF KEY $03 = IF cls-black exit-basic THEN THEN` inside the main loop so BREAK exits cleanly to BASIC. INCLUDEd lib/bye.fs (which provides exit-basic). Header updated from \"Close XRoar to exit\" to \"Press BREAK to exit (returns to BASIC OK prompt in ROM mode)\".", "type": "polish", "status": "done", "priority": "low", "file": "src/rain/rain.fs", "created": "2026-04-22", "updated": "2026-05-08"}, {"id": 431, "summary": "rg-test: missing Build/Load documentation header", "description": "rg-test.fs lacks Build: and Load: instructions. Add standard header.", "type": "polish", "status": "done", "priority": "medium", "file": "src/rg-test/rg-test.fs", "created": "2026-04-22", "updated": "2026-04-26"}, {"id": 432, "summary": "rg-test: blocking KEY at end can hang on stuck-key edge case", "description": "rg-test.fs line 164: `KEY DROP` between tests is fine for interactive use but blocks on undefined keys. Consider `KEY?` polling with a fallback timeout for batch / automated testing scenarios. DONE 2026-05-08: introduced `wait-key` helper that polls KEY? then reads the key — if BREAK ($03), early-exits to BASIC; otherwise consumes and returns. Replaced all five `KEY DROP` between-test prompts with `wait-key`. The poll-then-consume pattern responds immediately to a held BREAK, and any test stage can now be skipped with BREAK without aborting the demo at the very end.", "type": "polish", "status": "done", "priority": "low", "file": "src/rg-test/rg-test.fs", "created": "2026-04-22", "updated": "2026-05-08"}, {"id": 433, "summary": "sound: stub references non-existent SND_PLAY symbol", "description": "src/sound/sound.fs CODE word JSRs SND_PLAY which is not defined in the kernel. Demo cannot build cleanly today. Either remove the demo (preferred until sound works) or restore as a clearly-marked EXPERIMENTAL placeholder. Audio path is broken at PIA level under all-RAM mode — see src/sound/SOUND.md for full investigation notes. SUPERSEDED 2026-05-05 by #482 (replace stub with working snd-tone CODE word in ROM mode).", "type": "bug", "status": "closed", "priority": "high", "file": "src/sound/sound.fs", "created": "2026-04-22", "updated": "2026-05-05"}, {"id": 434, "summary": "tetris: missing Build/Load documentation header", "description": "tetris.fs has excellent doc but lacks Build: and Load: instructions at the top. Add standard header.", "type": "polish", "status": "done", "priority": "medium", "file": "src/tetris/tetris.fs", "created": "2026-04-22", "updated": "2026-04-26"}, {"id": 435, "summary": "typewriter: missing Build/Load documentation header", "description": "typewriter.fs describes key behavior but lacks Build: and Load: instructions. Add standard header.", "type": "polish", "status": "done", "priority": "medium", "file": "src/typewriter/typewriter.fs", "created": "2026-04-22", "updated": "2026-04-26"}, {"id": 436, "summary": "typewriter: clarify exit behavior in doc header", "description": "typewriter.fs uses BEGIN/AGAIN with the only exit being BREAK key ($03) calling 'halt' (line 94). The exit path works but is undocumented in the file's header — readers need to scan to find it. Add a 'Press BREAK to exit' line to the doc header. DONE 2026-05-08: added a prominent \"Press BREAK to exit (returns to BASIC OK prompt in ROM mode).\" line to the typewriter.fs header right after the description, before the full key-behaviour list. The all-RAM-mode caveat is included since exit-basic only works while the BASIC ROMs are alive.", "type": "polish", "status": "done", "priority": "low", "file": "src/typewriter/typewriter.fs", "created": "2026-04-22", "updated": "2026-05-08"}, {"id": 437, "summary": "vdg-modes: missing Build/Load documentation header", "description": "vdg-modes.fs lacks Build: and Load: instructions. Add standard header.", "type": "polish", "status": "done", "priority": "medium", "file": "src/vdg-modes/vdg-modes.fs", "created": "2026-04-22", "updated": "2026-04-26"}, {"id": 438, "summary": "vdg-modes: doesn't restore text mode on exit", "description": "vdg-modes.fs cycles through 11 display modes but line 228 calls HALT without reset-text. Screen stays in whatever mode was last shown. Should restore VDG text for a clean exit.", "type": "polish", "status": "done", "priority": "medium", "file": "src/vdg-modes/vdg-modes.fs", "created": "2026-04-22", "updated": "2026-04-28"}, {"id": 439, "summary": "fujinet-time: standardize Build/Load header format", "description": "fujinet-time.fs has Build:/Load: instructions inline in the header (lines 7-8) but not in the same format other demos use. Once all demos adopt a standard header (issues 421/424/426/429/431/434/435/437), align this one too.", "type": "polish", "status": "done", "priority": "low", "file": "src/fujinet-time/fujinet-time.fs", "created": "2026-04-22", "updated": "2026-04-26"}, {"id": 440, "summary": "fujinet.fs: fn-ready spins forever when no FN attached", "description": "forth/lib/fujinet.fs fn-ready calls fn-ping in a UNTIL loop with no timeout. If no FujiNet is present (or DW server isn't responding), apps that call fn-ready or fn-time at boot hang indefinitely with no visual feedback. Add a fn-ready/N variant with a max retry count and a fail flag, or document that callers should poll fn-ping themselves with their own timeout. Currently the clock demo and any future FN demo will hang at boot if FN absent. Resolved by commit 8e1d9a4 (Clock: fall back to fake-time when FujiNet RTC is absent).", "type": "enhancement", "status": "done", "priority": "high", "file": "forth/lib/fujinet.fs", "created": "2026-04-22", "updated": "2026-04-26"}, {"id": 441, "summary": "clock: graceful fallback when FujiNet absent", "description": "src/clock/clock.fs calls sync-from-fn at boot. If FN isn't reachable the demo hangs forever inside fn-ready (depends on issue 440). Even if a fn-ready timeout exists, the clock should DECIDE what to do on failure — best options: (a) fall back to a placeholder time and show 'NO RTC' badge, (b) display an error screen, (c) retry every N seconds in the background. Without one of these, removing the FN cart bricks the demo. Resolved by commit 8e1d9a4 (falls back to fake-time when FujiNet RTC absent).", "type": "enhancement", "status": "done", "priority": "high", "file": "src/clock/clock.fs", "created": "2026-04-22", "updated": "2026-04-26"}, {"id": 442, "summary": "Top-level Makefile dsk target missing newer demos", "description": "Makefile DEMOS variable lists bounce, calculator, kaleidoscope, rain, tetris, rg-test, typewriter — but src/ also contains clock, fujinet-time, sound, vdg-modes. `make dsk` therefore omits 4 demos from build/demos.dsk. Either add them to DEMOS (and to the dsk decb-copy block) or document why they're excluded.", "type": "polish", "status": "done", "priority": "medium", "file": "Makefile", "created": "2026-04-22", "updated": "2026-04-28"}, {"id": 443, "summary": "kernel.asm: stale comment on START says 'copied to $8000'", "description": "forth/kernel/kernel.asm line 1505 comment reads 'Called by BOOTSTRAP after the kernel has been copied to $8000.' That was true before commit 2a53d5f relocated the kernel from $8000 to $E000. Update to '$E000'. Pure docfix, no behavior change. DONE 2026-05-08: kernel.asm START comment now describes both build profiles — ROM mode (kernel is already at $2000, ROMs alive) and all-RAM mode (BOOTSTRAP copies staged kernel from $1000 to $E000, ROMs paged out, interrupts masked). Both kernels rebuild cleanly.", "type": "docs", "status": "done", "priority": "low", "file": "kernel/kernel.asm", "created": "2026-04-22", "updated": "2026-05-08"}, {"id": 444, "summary": "Per-demo Makefiles are near-identical copy-paste", "description": "Each src/<demo>/Makefile is ~25 lines of almost the same content (KERNEL_DIR, FC, XROAR_ROMS, all/run/kernel/clean targets). When a single shared default changes (e.g. xroar args, kernel path), we have to edit 11 files. Refactor to a shared include — e.g. make/demo.mk that each demo's Makefile sources via `include ../../make/demo.mk`, with just a NAME var per demo. Reduces churn and copy-paste drift.", "type": "enhancement", "status": "done", "priority": "low", "file": "src/", "created": "2026-04-22", "updated": "2026-04-26"}, {"id": 445, "summary": "Clock: smooth (Rolex-style) second-hand sweep at 60Hz instead of per-second tick", "description": "src/clock/clock.fs currently redraws the second hand only when clk-sc changes (1 Hz), so it jumps from one second mark to the next. Make it sweep continuously: redraw on every vsync (60 Hz), advancing the angle by sub-second amounts derived from vs-cnt/vps. Per-frame cost ~5500 cycles is well under one frame; min/hr only redrawn on minute change (mn-pending counter spreads the heavier tick-hands work across the next two back buffers). Keep digital readout updates at 1 Hz inside the existing sec-change IF block. IMPLEMENTED: sc-angle (clock.fs:398) uses clk-sc*6 + (vs-cnt*6)/vps for sub-second sweep at 60Hz; mn-angle/hr-angle derive from sc-angle so all three hands share the same time base.", "type": "enhancement", "status": "done", "priority": "medium", "file": "src/clock/clock.fs", "created": "2026-04-23", "updated": "2026-05-05"}, {"id": 446, "summary": "KERNEL: beam-trace BEQ tests wrong flag, corrupts saved color for x%4==3 pixels", "description": "forth/kernel/kernel.asm CODE_BEAM_TRACE around line 2063-2068 does:\n\n  LDB ,Y       ; Z set based on VRAM byte\n  PSHS A\n  BEQ @nr      ; meant to skip shift when A==0 but tests B's Z\n  @rsh LSRB / DECA / BNE @rsh\n  @nr ANDB #$03\n\nWhen shift amount A==0 (x%4==3) and the VRAM byte is non-zero, BEQ does NOT branch, enters the shift loop. DECA wraps A from 0 to 255, shifts B right 255+ times, B becomes 0. Saved color is 0 regardless of actual pixel color.\n\nResult: 25% of pixels along any beam-traced line have corrupted saved color. beam-restore then paints those pixels black instead of restoring original color. Masked in demos that redraw before accumulated damage is visible, but exposed by the smooth-sweep clock where the minute hand stays on-screen for 60s of sec-hand passes. Minute hand visibly becomes dashed/chewed.\n\nFix: add TSTA before BEQ to test A instead of B's leftover Z flag. One-line change. Resolved by commit eaf8c32 (kernel beam-trace fix).", "type": "bug", "status": "done", "priority": "high", "file": "forth/kernel/kernel.asm", "created": "2026-04-23", "updated": "2026-04-26"}, {"id": 447, "summary": "Clock perf: angle-dx / angle-dy as CODE words", "description": "forth/lib/trig.fs angle-dx and angle-dy are each ~2,824 cycles per call (DOCOL + cos/sin 7-bit lookup + Forth * + signed /128 + EXIT). Each hand redraw via ep1/ep2 calls them twice (once for dx, once for dy), so redraw-sc-back spends ~5,500 of its 8,396 cycles in these two words. Converting to 6809 CODE with inline sin table lookup + MUL + ASR would drop each to ~400-500cy. Expected savings: typical clock frame from 9,608cy (64% budget) to ~4,500cy (30%); sec-change frame from 18,562cy (124%) to ~13,500cy (under budget). Largest single optimization available for clock smoothness. SUPERSEDED: #452 (sec-hand endpoint tables) and #453 (extended to mn/hr) precomputed the entire endpoint lookup, removing angle-dx/angle-dy from the per-frame path entirely. #455 (compute-angles CODE word) handled the remaining angle math at a higher level. The angle-dx/angle-dy words remain in forth/lib/trig.fs as general-purpose polar->Cartesian helpers (still used by rg-test and clock face init), but the per-frame hot path this issue targeted no longer exists.", "type": "enhancement", "status": "done", "priority": "high", "file": "forth/lib/trig.fs", "created": "2026-04-23", "updated": "2026-04-26"}, {"id": 448, "summary": "Clock perf: selective render-datetime — only update changed digits", "description": "src/clock/clock.fs render-datetime re-draws all 16 characters (YYYY.MM.DD and HH:MM:SS) each sec change, costing ~7,174cy. The only values that change every second are the 2 ss digits. Split render-datetime into render-date (re-draw only on dy/mo/yr change), render-hm (only on mn change), and render-ss (every sec). Saves ~6,000cy on 58/60 dig-pending frames per second once we pass the initial paint. Easy optimization; low risk. Done: split into render-date (4,301cy, day/boot only), render-hm (1,961cy, minute/boot only), and render-ss (912cy, every sec change). Replaced dig-pending with three counters (ss-pending, hm-pending, date-pending). Sec-change add-on drops from 8,954cy to 2,692cy — whole frame now comfortably under budget.", "type": "enhancement", "status": "done", "priority": "medium", "file": "src/clock/clock.fs", "created": "2026-04-23", "updated": "2026-04-23"}, {"id": 449, "summary": "Clock perf: skip render-sync-flash when no flash pending", "description": "src/clock/clock.fs render-sync-flash renders 8 characters (either 'RTC SYNC' or 8 spaces to clear) on every dig-pending frame. After the initial 2-frame flash clears on both buffers, we keep re-rendering spaces every dig-pending tick until the next flash fires. Gate render-sync-flash with a flash-dirty-pending counter so it only runs for 2 frames after the flash counter changes state. Minor savings (~1,780cy) but tidier. IMPLEMENTED 2026-05-05: added flash-pending counter (clock.fs:218). render-sync-flash now early-exits when flash-pending=0; bumped to 2 at the three visual-state transitions (fake-time, sync-from-fn, sync-flash decrement-to-zero). Verified in XRoar: initial RTC SYNC banner draws and clears, then bottom row is idle. Saves ~1,780cy on every dig-pending frame outside the flash window.", "type": "enhancement", "status": "done", "priority": "low", "file": "src/clock/clock.fs", "created": "2026-04-23", "updated": "2026-05-05"}, {"id": 450, "summary": "Clock perf: tick-hands as CODE word", "description": "src/clock/clock.fs tick-hands costs ~24,558cy (erase 3 hands + redraw all 3 in z-order).  Fires on mn-pending for 2 frames per minute.  Each firing takes ~3 real frames, losing 4 real frames per minute.  Converting to CODE with inlined ep/trace/paint logic could cut to ~8,000cy, making it fit in 1 real frame.  Lower priority than #447 since it only fires 2x/min. CLOSED 2026-05-05 (wont-do): clock already meets frame budget after #447, #455, #451, #449. Remaining 13% headroom not worth ~150 lines of fiddly 6809 asm. Reopen if a future demo on the clock face needs the cycles.", "type": "enhancement", "status": "closed", "priority": "low", "file": "src/clock/clock.fs", "created": "2026-04-23", "updated": "2026-05-05"}, {"id": 451, "summary": "Clock perf: precompute sin table as kernel data", "description": "forth/lib/trig.fs init-sin builds the 91-entry sin table by writing values one at a time via the tb helper (cost: 25,444cy one-time at boot).  Could be embedded as raw FCB data in the kernel (like font-data, sprite-data), copied once via CMOVE — same pattern as #162 (font) and #163 (sprite data).  Costs 91 bytes of kernel space, saves ~25,000cy of boot time and significant app binary size.  Paired benefit with #447 if both move to CODE. IMPLEMENTED 2026-05-05: added CFA_SIN_DATA DOVAR (91 FCB bytes) to kernel.asm after font-data; exposed sin-data in fc.py names dict; collapsed init-sin in trig.fs to one-liner (sin-data trig-base 91 CMOVE). Verified in XRoar with clock and rg-test (angle test draws correct radial lines). Measured: clock.bin 8162 -> 7626 bytes (-536); kernel +93 bytes. Boot init-sin now ~1,800cy (was ~25,444cy).", "type": "enhancement", "status": "done", "priority": "medium", "file": "forth/lib/trig.fs", "created": "2026-04-23", "updated": "2026-05-05"}, {"id": 452, "summary": "Clock perf: precomputed sec-hand endpoint tables", "description": "The smooth-sweep second hand redraws every frame and calls ep2 (~5,917cy) which internally calls angle-dx and angle-dy. Since the sec-hand radius is fixed (R-SC=46), precompute two 360-byte tables — sec-tx-tab[angle] holds (CX + sin(angle)*R-SC/2) and sec-ty-tab[angle] holds (CY - cos(angle)*R-SC) — and index them directly in redraw-sc-back. Eliminates ep2, clk>trig, and angle-dx/dy calls from the per-frame path. Expected savings: ~5,700cy per frame. Makes the loop fit comfortably within one real vblank in fake-time mode, so local seconds no longer drift. 720 bytes of binary cost. Narrower scope than issue #447 but solves the drift observed in fake-time. Verified in XRoar fake-time: drift dropped from 2.17x slow to 1.07x slow (120 real-sec = 110 fake-sec). Combined table lookup + pixel-endpoint dedup — most frames now do zero pixel work since consecutive angles share an integer tx/ty.", "type": "enhancement", "status": "done", "priority": "high", "file": "src/clock/clock.fs", "created": "2026-04-23", "updated": "2026-04-23"}, {"id": 453, "summary": "Clock: smooth-sweep for hour and minute hands too", "description": "The sec hand glides; hr and mn jerk forward once per minute/hour. Goal: all three hands advance continuously, proportional to wall time, so the clock flows instead of ticks. Implementation: precompute endpoint tables for hr (R=24) and mn (R=40) just like the existing sec tables (#452). Replace discrete mn-angle/hr-angle with smooth variants derived from sc-angle (mn-angle-smooth = clk-mn*6 + sc-angle/60; hr-angle-smooth = clk-hr*30 + mn-angle-smooth/12). Each buffer tracks last-rendered endpoints for all three hands. Every frame: compute current endpoints via table lookup, find the lowest hand whose endpoint changed (hr < mn < sc by z-order), erase top-down to that hand, redraw bottom-up from that hand. Adds two pairs of 360-byte tables (1,440 extra bytes) and extends flip-state to swap six more pairs (hr-ltx/lty, mn-ltx/lty). Visible benefit: the hour hand drifts to the next integer degree every ~2 minutes; minute hand every ~10 seconds; all completely smoothly. No more visible tick events. Done: added 4 new endpoint tables (hr-tx-tab, hr-ty-tab, mn-tx-tab, mn-ty-tab — 1,440 bytes). Added 6 new lasts (hr/mn ltx/lty, both buffers) and extended flip-state to swap them. New unified redraw-hands replaces the old redraw-sc-back/tick-hands split: every frame computes endpoints, finds lowest moved hand by z-order, erases top-down and redraws bottom-up. Verified in XRoar fake-time: 67 real-sec = 60 fake-sec (1.08x slow — same as before despite the smoother motion, because the dedup absorbs the extra cost). All three hands visible and tracking correctly.", "type": "enhancement", "status": "done", "priority": "high", "file": "src/clock/clock.fs", "created": "2026-04-23", "updated": "2026-04-23"}, {"id": 454, "summary": "Clock cosmetics: pip ticks for non-quarter positions + 10%-wider face", "description": "Two visual improvements to the analog face. (1) The diagonal 2-pixel tick marks at 1, 2, 4, 5, 7, 8, 10, 11 o'clock look approximate at low resolution — replace with a 2×2 pixel square (pip) at the outer edge so they read cleanly. The 12, 3, 6, 9 quarter marks stay as longer line segments. (2) Stretch the entire clock geometry (face + ticks + all 3 hands) horizontally by 10% so it better matches the CRT's wider-than-tall aspect ratio. Implementation: change the ep1/ep2 X-displacement compensation from /2 to ×11/20 (= 0.55), regenerate the three endpoint tables (sec/mn/hr) with the same 0.55 X-scale, replace the diagonal-tick branch in face-ticks with a 2×2 rg-pset block. Done. Added x-scale helper that handles signed-multiply via NEGATE-around (kernel * and / are unsigned, so naive 11 * 20 / wraps for negative dx). Regenerated all three hand endpoint tables (sec/mn/hr) with X scale 0.55. Replaced the diagonal-tick branch in face-ticks with a 2x2 rg-pset block. Verified in XRoar: face is visibly wider matching CRT aspect, 4 quarter ticks remain as line segments, 8 hour pips render cleanly.", "type": "enhancement", "status": "done", "priority": "medium", "file": "src/clock/clock.fs", "created": "2026-04-23", "updated": "2026-04-23"}, {"id": 455, "summary": "Clock perf: angle words (sc/mn/hr-angle) to CODE", "description": "redraw-hands base cost is ~5,560cy/frame, of which ~3,940cy is the three angle calculations (sc-angle 751, mn-angle 1,268, hr-angle 1,924). All three are simple integer math: sc = clk-sc*6 + (vs-cnt*6)/vps, mn = clk-mn*6 + sc/60, hr = (clk-hr%12)*30 + mn/12. The dominant cost is the 16-bit divide (Forth's /MOD is repeated subtract). CODE versions can use 6809 MUL for the *6 multiplications and shift-subtract for the divides (quotients are small: 0-5, 0-5, 0-29). Expected: ~3,000cy/frame saved, baseline drops from 6,876cy to ~3,876cy (26% budget). Brings minute-boundary frames under budget. Done. Added compute-angles CODE word (282cy) that computes all three angles in one pass using 6809 MUL + repeated-subtract for the three divides. redraw-hands and tick-hands now call it and read from new sa/ma/ha cached cells. Measured savings: baseline frame 6,876 → 3,216cy; redraw-hands worst case 11,732 → 8,251cy. Every frame now fits in one vblank except the once-per-day midnight overrun. Minute-boundary frames (previously 120% over budget) now at 96%.", "type": "enhancement", "status": "done", "priority": "high", "file": "src/clock/clock.fs", "created": "2026-04-23", "updated": "2026-04-23"}, {"id": 456, "summary": "Clock perf: redraw-hands as a single CODE word", "description": "Once #455 lands, the remaining ~2,000cy of base overhead in redraw-hands lives in the table lookups (6 of them), the cascade compares (3), and the lasts updates (6). Inlining the whole word in 6809 asm — register-driven cascade dispatch, direct memory addressing for the FVAR_*_lt[xy] cells, JSR to existing beam-trace/draw/restore CODE primitives — would eliminate that overhead. Estimated: another ~2,000cy/frame saved, baseline drops from ~3,876 to ~1,876cy (13% budget). Big-asm change (~150 lines), only worth doing after #455. CLOSED 2026-05-05 (wont-do): clock already meets frame budget after #447, #455, #451, #449. Remaining 13% headroom not worth ~150 lines of fiddly 6809 asm. Reopen if a future demo on the clock face needs the cycles.", "type": "enhancement", "status": "closed", "priority": "medium", "file": "src/clock/clock.fs", "created": "2026-04-23", "updated": "2026-05-05"}, {"id": 457, "summary": "Add Scott Adams and Adventure International to legends", "description": "The legends/ section lacks any entry for Scott Adams (founder of Adventure International, widely credited as the father of the microcomputer adventure game) or his company. Add: (1) Scott Adams entry in whos-who.md under 'A' (between Rick Adams and Bob Albrecht). (2) Adventure International entry in companies.md under Game Publishers. (3) README.md additions: name in Game Developers list, 1978/1979 milestones, and an adventure-game-lineage relationship bullet. Include disambiguation note that this is not the Dilbert cartoonist. VERIFIED 2026-05-05: legends/whos-who.md:13 has Scott Adams entry with Dilbert disambiguation; legends/companies.md:40 has Adventure International under Game Publishers; legends/README.md has the name in the Game Developers list (line 24), 1978/1979 milestones (lines 77-78), and the adventure-game-lineage bullet (line 111).", "type": "enhancement", "status": "done", "priority": "medium", "file": "legends/", "created": "2026-04-25", "updated": "2026-05-05"}, {"id": 458, "summary": "Add Bob Russell to legends + correct H. Allen Curtis entry", "description": "Add Bob Russell (R. R. Enterprises, author of Color Computer Memory Map V2.0 1983; multi-part Rainbow Memory Map series July-Dec 1983) to legends/whos-who.md under R. Also correct H. Allen Curtis entry: spelling was 'Curtiss' (two s's) — every Rainbow byline uses 'Curtis'. Replace with researched article timeline (Shades of PMODE3 Nov 1982; MC-10 Memory Map Jan 1984; Little E April 1984; A Feline CoCo 3 Fandango May 1987; PALETTEable Color Mixing April 1988). Flag the unverified 'desktop publishing software' claim pending evidence. Cross-reference Russell <-> Curtis via the MC-10 follow-up.", "type": "docs", "status": "done", "priority": "medium", "file": "legends/whos-who.md", "created": "2026-04-26", "updated": "2026-04-26"}, {"id": 472, "summary": "Add bye kernel primitive — clean exit to BASIC OK prompt", "description": "HALT is just BRA * (spin forever); demos can't actually return to BASIC. Added bye CODE primitive that JMPs to a low-RAM stub (EXIT_TO_BASIC at $0E00) which clears all-RAM mode (STA $FFDE) and dispatches through the hardware reset vector (JMP [$FFFE]). BASIC's reset path restores VDG text mode automatically and shows OK prompt. Stub MUST live in low RAM because clearing TY un-shadows the kernel mid-execution. Exposed in fc.py kernel_words as 'bye'.", "type": "enhancement", "status": "done", "priority": "high", "file": "forth/kernel/kernel.asm", "created": "2026-04-26", "updated": "2026-04-26"}, {"id": 473, "summary": "rg-text.fs: rg-type references undefined rg-emit", "description": "forth/lib/rg-text.fs line 16 defines rg-type which calls rg-emit — but rg-emit is not defined anywhere in the codebase. Any demo that INCLUDEs rg-text.fs and hits the rg-type code path fails to compile (Unknown word: 'rg-emit'). vdg-modes is currently broken because of this. Either define rg-emit (presumably wrap rg-char with cursor advance) or delete rg-type until needed.", "type": "bug", "status": "done", "priority": "medium", "file": "forth/lib/rg-text.fs", "created": "2026-04-26", "updated": "2026-04-28"}, {"id": 474, "summary": "Proper BASIC ROM handoff from bye (currently spins on OK screen)", "description": "Resolved by ROM mode (#476): in ROM-mode builds the BASIC ROMs stay mapped at $A000, so 'JMP $A027' cleanly returns to the OK prompt. Provided as 'basic-cold' in forth/lib/bye.fs. Verified working in typewriter pilot (32K CoCo, ROM-mode kernel at $1000). All-RAM mode remains fundamentally incompatible with returning to BASIC because the ROMs are paged out — accepted as a permanent trade-off. Demos that need a clean BASIC return should be ROM-mode builds; cartridge-delivered all-RAM apps rely on the physical RESET button.", "type": "enhancement", "status": "done", "priority": "low", "file": "forth/lib/bye.fs", "created": "2026-04-26", "updated": "2026-04-28"}, {"id": 475, "summary": "fc.py --stage-base flag: pin kernel staging address", "description": "Currently fc.py auto-packs the staged kernel immediately after the bootstrap (start = max(0x0E00, end-of-bootstrap-record)). This couples downstream binary layout to coco kernel size — any kernel growth/shrink shifts every staged address, which breaks projects (like spacewarp) that need their KCODE to land at a stable address regardless of coco-side churn. Add --stage-base 0xNNNN: when provided, override the auto-computed staging start with the given address. fc.py still patches the bootstrap LDX accordingly. Default behavior unchanged. ~5-line change. Documents the load-safety constraint directly in the build command for downstream projects.", "type": "enhancement", "status": "done", "priority": "high", "file": "forth/tools/fc.py", "created": "2026-04-27", "updated": "2026-04-28"}, {"id": 476, "summary": "ROM mode build path: kernel coexists with BASIC ROMs", "description": "Done — ROM mode is now the default. Kernel ORGs at $1000, BASIC ROMs stay mapped at $A000+, BREAK exits cleanly to OK via 'exit-basic'. All 8 demos (bounce, calculator, kaleidoscope, rain, rg-test, tetris, typewriter, vdg-modes) run on a 32K CoCo. Apps that need the full 64K (clock, fujinet-time, future spacewarp) opt in via 'KERNEL_VARIANT = allram' which selects the all-RAM kernel built with 'lwasm -DALL_RAM=1'. Auto-detected by fc.py from kernel record addresses, so no app-side flag needed.", "type": "enhancement", "status": "done", "priority": "medium", "file": "forth/tools/fc.py", "created": "2026-04-27", "updated": "2026-04-28"}, {"id": 477, "summary": "Add CFA_LIT0 / CFA_LIT1 / CFA_LIT2 kernel primitives for small-int literal compression", "description": "ITC currently compiles every integer literal to 4 bytes (CFA_LIT cell + 2-byte inline value). Small constants 0, 1, 2 dominate frequency in any non-trivial program — in spacewarp.fs they account for 426 occurrences = 1,704 bytes spent on LIT encoding. Add three dedicated kernel primitives (CODE_LIT0/LIT1/LIT2, 8 bytes each + 2-byte CFA = ~30 bytes kernel growth, +0.8% of current 3,712-byte kernel). Each call site collapses 4 bytes -> 2 bytes. fc.py changes: check for small-int fast path before falling through to LIT+value; symbol-presence guard preserves old-kernel compatibility. Estimated savings: spacewarp ~850 bytes shed (resolves its $7E5C LOADM-safety ceiling overrun ~7x over); coco demos likely 50-300 bytes each. Pure additive change; existing demos compile unchanged. Spacewarp's --stage-base 0x0EF6 pin (#475) absorbs the kernel growth within existing slack, no spacewarp-side changes needed. See full proposal: /tmp/coco-467-proposal.md. IMPLEMENTED 2026-04-28: kernel adds CODE_LIT0/LIT1/LIT2 (24 bytes code + 6 bytes CFA = 30 bytes growth, matches estimate). fc.py compile_forth picks up the symbols and emits the short CFAs when present (graceful fallback for older kernels). Measured savings: bounce -182, calc -146, clock -262, kaleidoscope -76, tetris -274, typewriter -64, plus rg-test/rain/fujinet-time. Pending user testing of demos in XRoar.", "type": "enhancement", "status": "done", "priority": "high", "file": "forth/kernel/kernel.asm", "created": "2026-04-28", "updated": "2026-04-28"}, {"id": 478, "summary": "Add CFA_LITM1 (-1/TRUE), CFA_LIT3, CFA_LIT4 small-int literal compression", "description": "Once #477 (LIT0/LIT1/LIT2) lands and the spacewarp savings are measured, evaluate adding CFA_LITM1 (-1) and CFA_LIT3. In spacewarp.fs: -1 appears 23 times, 3 appears 51 times. FALSE/TRUE idioms (0/-1) are common across many demos. Each adds another ~10 bytes of kernel growth for the corresponding compression. Decide based on residual margin needed after #477 ships and on cross-demo frequency surveys. Cheap to add; cheap to skip — pure scope decision. IMPLEMENTED 2026-04-28: added CFA_LITM1/CFA_LIT3/CFA_LIT4 to kernel + fc.py LIT_PRIMS dict. Measured savings on top of LIT0/1/2: tetris -98, calculator -98, clock -74, bounce -58, rg-test -42, kaleidoscope -8, fujinet-time -8, rain -6, typewriter -4 (~400 bytes total for ~30 bytes kernel growth). Verified all demos in XRoar via build/demos.dsk.", "type": "enhancement", "status": "done", "priority": "medium", "file": "forth/kernel/kernel.asm", "created": "2026-04-28", "updated": "2026-04-28"}, {"id": 479, "summary": "Compile-time metaprogramming: DATA[PY] directive vs full IMMEDIATE words", "description": "Currently fc.py can't run Forth code at compile time, so static data (sin tables, sprite glyphs, precomputed endpoint tables, font blocks) has to be hand-rolled with b, sequences or computed at boot via init-* words. Costs runtime cycles + binary size. Three options on the scope ladder, captured from a design discussion: (1) DATA[PY] directive — narrow escape hatch that takes a Python expression returning bytes and emits an FCB block; ~20 lines in fc.py; covers ~95% of cited use cases (sin table per #451, clock tx/ty tables, sprite/font data) without exposing compile_state; (2) [PY] ... [/PY] generic escape hatch with access to fc.py's HERE / dictionary / emit_word — ~50 lines; same elegance hit but covers control-flow generation too; (3) Real IMMEDIATE words with compile-time data stack and Python-side interpreter mirroring all 80 kernel primitives — ~400-1500 lines; introduces twin-implementation drift risk (Python-Forth must track target Forth semantics). Recommended sequencing: check whether any concrete need actually requires control flow vs pure data emission. If all static -> ship DATA[PY] only. Escalate only when DATA can't express a real need. Don't pre-build IMMEDIATE. DONE 2026-05-06: implemented the narrow DATA[PY] form. Tokenizer captures DATA[PY <name> ... ]DATA blocks line-by-line. Parser dedents the source, evaluates the trailing expression in a fresh Python namespace, coerces to bytes, and stores in data_blocks. compile_forth lays each block out as DOVAR cell + raw bytes (using the same hole/pad logic as variables) and resolves name references from threads to the data blocks CFA. Calling <name> from Forth pushes the address of the first byte (DOVAR semantics). Documented in forth/tools/README.md and docs/reference.html with a sin-table example. Verified via /tmp/test-data.fs (10-byte int table + 5-byte HELLO string both round-trip correctly). Did NOT implement the broader [PY ... [/PY] form or full IMMEDIATE — leaving those as future scope only if a real need turns up.", "type": "enhancement", "status": "done", "priority": "low", "file": "forth/tools/fc.py", "created": "2026-04-28", "updated": "2026-05-06"}, {"id": 480, "summary": "docs/vdg-modes.md: remove stale 'Kernel Primitive Requirements' section", "description": "The trailing 'Kernel Primitive Requirements' section proposed FILL, CMOVE, LSHIFT, RSHIFT as new kernel primitives. All four already exist in forth/kernel/kernel.asm (CODE_FILL/CMOVE/LSHIFT/RSHIFT) and are documented in docs/reference.html. Section removed; file now ends after the RG6 mode-switch example.", "type": "docs", "status": "done", "priority": "low", "file": "docs/vdg-modes.md", "created": "2026-05-05", "updated": "2026-05-05"}, {"id": 481, "summary": "Sound: verify BASIC POKE loop produces audio in current XRoar", "description": "Baseline check before any code work. Boot XRoar with default ROM-mode setup, drop into BASIC, type the 7-line POKE loop from src/sound/SOUND.md (lines 59-67), RUN, confirm audible tone. If it does NOT produce sound, investigate XRoar audio routing before touching sound.fs. If it does, proceed to #482. VERIFIED 2026-05-05: SOUND 200,5 in BASIC produces audible tone in current XRoar (user confirmed). Audio path from emulator to host works; safe to proceed with #482.", "type": "audit", "status": "done", "priority": "high", "file": "src/sound/SOUND.md", "created": "2026-05-05", "updated": "2026-05-05"}, {"id": 482, "summary": "Sound: replace sound.fs SND_PLAY stub with working snd-tone CODE word", "description": "sound.fs currently JSRs SND_PLAY which doesn't exist (was the symbol from a since-removed kernel sound routine). Replace with an inline 6809 CODE word that produces a tone using the known-working BASIC POKE recipe (enable sound via $FF23 bit 3, then loop toggling $FF20 between $FC and $00 with delay). Stack: ( pitch duration -- ) where pitch sets the inter-toggle delay and duration sets loop count. Builds on #481's baseline confirmation. Supersedes #433. IMPLEMENTED 2026-05-05: snd-tone CODE word in src/sound/sound.fs writes the canonical Daggorath PIA init ($FF01=$34, $FF03=$34, $FF21=$34, $FF23=$3C) then toggles $FF20 between $FC and $00 in a duration loop with a programmable per-half-cycle delay. Verified in XRoar — clean continuous tone (user confirmed). Earlier attempts that OR-masked individual bits failed because the prior PIA state was unpredictable; storing literal control-register values is deterministic.", "type": "bug", "status": "done", "priority": "high", "file": "src/sound/sound.fs", "created": "2026-05-05", "updated": "2026-05-05"}, {"id": 483, "summary": "Sound: make sound.fs interactive — keys 1-5 play different tones", "description": "After #482's snd-tone works, expand sound.fs into an interactive demo: poll KEY, dispatch on '1'..'5' to play different (pitch, duration) combinations covering low/mid/high tones, short/long durations, and a sweep effect. BREAK key exits via halt. Keep it under ~30 lines of Forth. IMPLEMENTED 2026-05-05: src/sound/sound.fs now polls KEY in BEGIN..UNTIL, dispatches 1..5 to distinct (pitch,duration) pairs (snd-tone), 5 calls a 7-step descending snd-sweep, and BREAK ($03) exits-basic. README.md added with the same level of detail as the typewriter demo.", "type": "demo", "status": "done", "priority": "medium", "file": "src/sound/sound.fs", "created": "2026-05-05", "updated": "2026-05-05"}, {"id": 484, "summary": "Sound: update SOUND.md to reflect ROM-mode default", "description": "SOUND.md was written 2026-03-26 when all-RAM mode was the default; most of the document's 'no sound' findings stemmed from $FFDF paging out BASIC ROMs and breaking the audio path. Since the 2026-04-28 ROM-mode default landed, BASIC ROMs stay alive and PIA state is intact. Rewrite SOUND.md as a working-state document describing the actual audio path used by sound.fs after #482, the ROM-mode constraints (no $FFDF), and any remaining caveats. Keep the historical investigation as a brief 'before ROM-mode default' appendix for context. DONE 2026-05-05: prepended a \"Historical\" status block to SOUND.md summarising why most of the original findings were misdiagnosed (BASIC PIA setup got paged out under all-RAM mode), and pointing readers at sound.fs / README.md for the working implementation. Verified both ROM-mode and all-RAM kernels produce identical clean tones with the new explicit PIA setup.", "type": "docs", "status": "done", "priority": "medium", "file": "src/sound/SOUND.md", "created": "2026-05-05", "updated": "2026-05-05"}, {"id": 485, "summary": "Sound: add sawtooth/triangle/sine waveforms and expand demo", "description": "snd-tone produces a square wave only. Extend forth/lib/sound.fs with snd-saw (sawtooth), snd-tri (triangle), and snd-sin (sine using the kernel sin table). Each takes (pitch duration --) like snd-tone. Update src/sound/sound.fs to expose more keys (1..9 or similar) including the new waveform variants and a couple of additional convenience effects to make the demo cover more of the audio palette. DONE 2026-05-05: forth/lib/sound.fs gains snd-saw (step pitch duration), snd-tri (built from two snd-saw calls), and snd-sin (walks the kernel TRIG_BASE sin table forward+back, stride 4 for audible-range frequency, requires init-sin). Demo expanded to keys 0..9 covering square (1..4), sweep (5), sawtooth (6,7), triangle (8), sine (9), noise (0). docs/reference.html sound section rewritten.", "type": "enhancement", "status": "done", "priority": "medium", "file": "forth/lib/sound.fs", "created": "2026-05-05", "updated": "2026-05-05"}, {"id": 486, "summary": "Sound: tune effect characters (beep shorter, zap=laser, chirp=Star-Trek, dock faster, etc.)", "description": "Tighten the sound effects so each is more distinctive and pleasant. lib changes: snd-beep shorter; snd-zap = quick descending laser (octave-drop bursts); snd-chirp = three short Star-Trek-communicator-style tones; snd-dock faster. Demo changes: key 1 faster, key 5 sweep's first tone faster, key 0 distinct from BOOM (shorter noise). DONE 2026-05-05: snd-beep shorter (300,30); snd-zap rewritten as smooth descending DO/+LOOP sweep; snd-chirp = three identical fast high blips with snd-pause silence between; snd-dock faster (600/300, dur 20); snd-boom now (60,500) using parameterized snd-noise(delay,duration); snd-sweep replaced with smooth ascending sweep via DO/+LOOP. snd-noise refactored to take (delay,duration) so caller can pick pitch. Added snd-pause helper (silence between bursts). Demo: key 1 faster (600,100); key 5 first tone faster (now smooth ascending); key 0 high-pitch hiss (1,400) distinct from BOOM. README gains complete cost tables (bytes + cycles + ms per word and per demo key).", "type": "polish", "status": "done", "priority": "low", "file": "forth/lib/sound.fs", "created": "2026-05-05", "updated": "2026-05-05"}, {"id": 487, "summary": "Kernel I: walk return stack to skip intervening colon-call frames", "description": "CODE_I currently reads from ,S flat (no walk), so a colon-defined helper called inside a DO loop sees the helper's own return address rather than the outer loop index.  Spacewarp pattern 'JOV-DMG I + C@' appears 13 times because the natural factoring ': jhp@ JOV-DMG I + C@ ;' returns the wrong value.  Standard ANS Forth I walks past colon-call frames; a one- or two-LEAS patch in CODE_I would restore the loop-body-helper factoring idiom and save ~65 bytes in spacewarp from this single pattern (plus similar wins elsewhere). DONE 2026-05-06: added VAR_LP loop-frame-pointer cell to kernel. CODE_DO now pushes (old_LP, limit, index) onto R-stack and updates VAR_LP via STS to point at the new index slot. CODE_LOOP / +LOOP / UNLOOP exit paths restore the saved old_LP and pop 6 bytes (was 4). CODE_I and CODE_J read via VAR_LP instead of fixed S offsets, so I works regardless of helper-frame depth and J chases one LP link. Verified via test-i.fs: direct-from-DO-body, from-colon-helper (was the bug), and J nested-loop all produce expected output. All existing demos rebuilt cleanly under both ROM and all-RAM kernels. Cost: kernel +52 bytes (3977 vs 3925 ROM); DO +6 cycles, LOOP/+LOOP exit +6, UNLOOP +6, I unchanged in cost, J +5.", "type": "bug", "status": "done", "priority": "high", "file": "forth/kernel/kernel.asm", "created": "2026-05-06", "updated": "2026-05-06"}, {"id": 488, "summary": "fc.py: hard-error (or fix) EXIT inside IF/THEN", "description": "Per CLAUDE.md, 'IF EXIT THEN' works as an early-return guard but 'IF ... EXIT ... THEN' with code after the EXIT silently miscompiles.  Currently we carry this as a defensive habit, but casual users hit it as an unexpected bug with quiet failure.  Either fix the compilation or detect the pattern at compile time and refuse it with a clear error. DONE 2026-05-06: fc.py parser now intercepts EXIT and emits one CFA_UNLOOP cell per active DO loop before CFA_EXIT. With the new VAR_LP-aware UNLOOP from #487, that pops the loop frame (index, limit, saved old_LP = 6 bytes) and restores VAR_LP cleanly. The standard idiom EXIT-inside-IF-inside-DO now compiles to correct code without forcing the author to remember UNLOOP. Removed the stale gotcha from CLAUDE.md, fc.py docstring, and src/sound/sound.fs comment. Verified via /tmp/test-exit2.fs (testB EXITs from inside DO with UNLOOP auto-inserted; testC then runs cleanly because R-stack is correct). All shipping demos rebuilt cleanly.", "type": "bug", "status": "done", "priority": "medium", "file": "forth/tools/fc.py", "created": "2026-05-06", "updated": "2026-05-06"}, {"id": 489, "summary": "fc.py: add +FIELD / RECORD struct-definer support", "description": "Apps currently express records via raw byte/word arrays and BASE +n C@ / +n ! patterns.  Spacewarp has many 'JOV-DMG i + C@' style accesses that a +FIELD-style definer would replace with named record fields.  Implement a Forth-83-style +FIELD primitive in fc.py (or a RECORD/END-RECORD pair) that emits constants for the field offsets.  Should be a modest fc.py change with a major source-readability payoff. DONE 2026-05-06: fc.py parser now recognises three Forth-2012-style struct definers: +FIELD (offset size --), CFIELD: (offset --, +1 byte), FIELD: (offset --, +2 bytes). Each defines the named word as a CONSTANT holding the field's offset, and replaces the cumulative-size cursor on the compile-time stack with offset+size so chained calls build a record layout. Pair with CONSTANT to capture total size: e.g. 0 CFIELD: ship.x CFIELD: ship.y FIELD: ship.vx FIELD: ship.vy CONSTANT /ship. Field words inline as literal offsets — zero call overhead. Documented in forth/tools/README.md and docs/reference.html. Verified via /tmp/test-fields.fs (offsets 0/1/2/4/6 emitted correctly; field reads/writes round-trip).", "type": "enhancement", "status": "done", "priority": "medium", "file": "forth/tools/fc.py", "created": "2026-05-06", "updated": "2026-05-06"}, {"id": 490, "summary": "fc.py: vocabularies / word lists", "description": "Single global namespace today.  Naming gets cramped fast in larger apps — spacewarp wanted helpers like c@1, w@+, and to redefine `0` etc. inside a private vocabulary.  Add WORDLIST or a lighter equivalent so apps can shadow short names internally and expose a curated public surface.  This is real architectural work, not a one-line fix; DEFERRED 2026-05-06: real architectural work, ~200 lines of fc.py changes for value we don't currently realize at ~28KB compiled across all demos. Keeping as future work — revisit when an app hits real naming-collision pain.", "type": "enhancement", "status": "open", "priority": "low", "file": "forth/tools/fc.py", "created": "2026-05-06", "updated": "2026-05-06"}, {"id": 491, "summary": "lib/README.md: surface per-word bytes and cycle costs", "description": "lib/README.md is auto-generated by tools/gen-lib-readme.py and currently lists each public library word with its stack effect and kind. For a 64KB-ROM kernel where every byte and every CPU cycle matters, the two most-asked questions about a lib word are how big and how fast. fc.py already computes both internally (--cycles mode walks the call graph; item_size/sized compute byte costs). Plan: add --metrics-json PATH to fc.py emitting per-word {bytes, cy_min, cy_max, notes} JSON; new tools/gen-lib-metrics.py topo-sorts libs by Requires:, builds a unified stub, runs fc.py to produce build/lib-metrics.json; gen-lib-readme.py loads it and adds Bytes/Cycles/Notes columns to the word table. Wire into Makefile so make all keeps it fresh. DONE 2026-05-08: Added --metrics-json PATH to fc.py (writes per-word {bytes, cy_min, cy_max, notes} JSON across kernel_primitives, forth_words, code_words, kcode_words, variables). New tools/gen-lib-metrics.py topo-sorts lib/*.fs by Requires:+real INCLUDEs, writes a unified stub at build/lib-metrics.fs, runs fc.py to produce build/lib-metrics.json. tools/gen-lib-readme.py loads the JSON and adds Bytes/Cycles/Notes columns to each library word table (graceful fallback to empty cells when JSON missing). Wired through Makefile so make all keeps lib/README.md fresh. Verified: 66 forth + 9 CODE words across 20 libs all populated; spot-checked key-held? = 175cy = DOCOL(27)+swap(39)+kbd-scan(48)+and(39)+exit(22) and bytes=10=DOCOL+4 refs+EXIT; loopy words like rg-hline correctly tagged \"has DO/LOOP\"; CODE words like beam-restore-slice show per-iter notes from analyze_code_block. Existing demos (tetris, clock) still build cleanly with --cycles.", "type": "enhancement", "status": "done", "priority": "medium", "file": "tools/fc.py, tools/gen-lib-readme.py, tools/gen-lib-metrics.py, Makefile", "created": "2026-05-08", "updated": "2026-05-08"}, {"id": 492, "summary": "lib/README.md: add per-word Description column", "description": "Word names in lib/README.md are mnemonic (cls-black, rg-pcls, snd-zap, expand-lo) and a reader scanning the index cannot tell what they do without opening the source. Plan: add a one-line Description column between Stack and Kind in the auto-generated table, sourced primarily from a new \"\\ word — desc\" inline source-comment convention (placed in one of the 6 lines preceding a definition), falling back to docs/reference.html (already has 141 hand-authored one-liners in <td class=\"word-name\"> rows; 79% coverage of current lib words). Case-insensitive name matching (KEY-HELD? ↔ key-held?). When source comment AND reference.html both exist and disagree, source wins and a docs-drift warning is emitted to stderr. Words missing descriptions in BOTH sources are reported on stderr at end of run so gaps stay visible. No fc.py / build-artefact changes — purely tools/gen-lib-readme.py + read-only consumption of docs/reference.html. Plan file: ~/.claude/plans/hi-claude-we-did-dreamy-pie.md. DONE 2026-05-08: tools/gen-lib-readme.py extended with scan_source_descriptions() (matches `\\ name — desc` lines anywhere in a .fs file, em-dash or ASCII --, skips divider lines and stack-effect comments) and parse_reference_html() (regex over <td class=\"word-name\"> rows, decodes HTML entities, trims long descriptions to first sentence, accepts both stack-effect and constant-value middle cells). Source comments win over reference.html with a docs-drift warning on disagreement; words with no description from either source are listed on stderr. Layout: per-file description list (with flow-control notes like has DO/LOOP appended in italic parens) followed by a narrow 5-column cost table (Word/Stack/Kind/Bytes/Cycles). Verified: cls-black sourced from reference.html; KEY-HELD? case-insensitive match works for both metrics and descriptions; snd-zap drift correctly flagged after adding a corrective source comment to lib/sound.fs; standalone fallback (no metrics JSON) still works. 16 words remain undocumented (#493). reference.html snd-zap accuracy followup at #494. Synthetic main filtering at #495.", "type": "enhancement", "status": "done", "priority": "medium", "file": "tools/gen-lib-readme.py, docs/reference.html (read-only)", "created": "2026-05-08", "updated": "2026-05-08"}, {"id": 493, "summary": "lib: add descriptions for 16 undocumented words", "description": "After surfacing the Description column in lib/README.md (#492), 16 public lib words have no description in either an inline `\\ name — desc` source comment OR docs/reference.html. The auto-generator now lists them on every run. The list: fn-cmd, fn-cmd-ready, fn-cmd-time, fn-op-fuji, fn-ready/n, fn-time/n (lib/fujinet.fs); joy-bit, joy-sel-lx, joy-sel-ly, joy-sel-rx, joy-sel-ry (lib/prox.fs); rg-addr, rg-init-at, rg-type (lib/rg-text.fs and rg-pixel.fs); rv (lib/prox.fs variable); snd-pause (lib/sound.fs). Either add a one-line `\\ name — short description` immediately above each definition (preferred — co-located with code) or add a row to docs/reference.html. Some of these may be private-by-convention and could be renamed with a leading underscore instead. DONE 2026-05-08: added `\\ name — desc` source-comment lines for all 16 previously-undocumented words across lib/dac.fs (joy-sel-rx, joy-sel-ry, joy-sel-lx, joy-sel-ly, joy-bit), lib/rg-pixel.fs (rv, rg-init-at, rg-addr), lib/rg-text.fs (rg-type), lib/fujinet.fs (FN-OP-FUJI, FN-CMD-READY, FN-CMD-TIME, fn-cmd, fn-ready/N, fn-time/N), lib/sound.fs (snd-pause). Generator now reports zero missing descriptions; all demos still build.", "type": "docs", "status": "done", "priority": "medium", "file": "lib/fujinet.fs, lib/prox.fs, lib/rg-text.fs, lib/rg-pixel.fs, lib/sound.fs", "created": "2026-05-08", "updated": "2026-05-08"}, {"id": 494, "summary": "reference.html: snd-zap description is wrong", "description": "Surfaced by the docs-drift warning from #492. reference.html says snd-zap is \"Rising zap (three ascending tones)\" but the actual code is `120 10 DO I 1 snd-tone 3 +LOOP` — a single linear pitch sweep through ~37 tones, not three. lib/sound.fs now carries a corrected source comment (\"Linear pitch sweep 10..120 with short bursts; sounds like a laser zap.\") that the generator picks up; reference.html should be updated to match so the drift warning clears. Also a good moment to spot-check other snd-* descriptions in reference.html against their actual code. DONE 2026-05-08: corrected reference.html snd-zap entry to match the source comment (\"Linear pitch sweep 10..120 with short bursts; sounds like a laser zap.\" instead of \"Rising zap (three ascending tones).\"). Also caught and fixed snd-chirp (was \"Three descending tones\" — but the code is three identical 60-pitch tones at the same frequency, so corrected to \"Three identical high blips in quick succession — like a bird chirp.\"). Generator now reports zero docs-drift warnings. Added reference.html as a Makefile dep of lib/README.md so changes there trigger README regen.", "type": "docs", "status": "done", "priority": "low", "file": "reference.html", "created": "2026-05-08", "updated": "2026-05-08"}, {"id": 495, "summary": "gen-lib-metrics.py: filter synthetic `main` from output", "description": "The unified-build stub at build/lib-metrics.fs ends with `: main ; main` so fc.py has something to compile. The resulting `main` word leaks into build/lib-metrics.json as a forth_word with bytes/cycles. It is harmless (no lib file defines `main`, so it never appears in lib/README.md), but it is noise: shows up in the \"missing descriptions\" warning, inflates the metrics word count, and is confusing if anyone inspects the JSON. Fix in tools/gen-lib-metrics.py by stripping `main` from the JSON after fc.py writes it, OR add a fc.py flag like --omit-main to skip it. A minor polish. DONE 2026-05-08: tools/gen-lib-metrics.py now post-processes the JSON to drop the synthetic main entry that the stub injects (only re-writes the file if main was actually present, so noop if fc.py changes ever stop emitting it). forth_words count went from 66 to 65; main no longer leaks into anything that consumes lib-metrics.json.", "type": "enhancement", "status": "done", "priority": "low", "file": "tools/gen-lib-metrics.py", "created": "2026-05-08", "updated": "2026-05-08"}, {"id": 496, "summary": "Move docs/reference.html to project root", "description": "Promote the language reference from docs/reference.html to /reference.html (root) so it sits alongside README.md, ROADMAP.md, COCO_RENOVATION.md as a top-level resource. Filename unchanged. Affects CLAUDE.md, RESOURCES.md, ROADMAP.md, tools/gen-lib-readme.py, docs/tutorial.html (back-link href), reference.html itself (style.css and tutorial.html relative paths repointed to docs/). DONE 2026-05-08.", "type": "docs", "status": "done", "priority": "medium", "file": "reference.html, plus refs in CLAUDE.md, RESOURCES.md, ROADMAP.md, tools/gen-lib-readme.py, docs/tutorial.html", "created": "2026-05-08", "updated": "2026-05-08"}, {"id": 497, "summary": "Add proposals/ directory for outside-contributed design documents", "description": "Create a top-level proposals/ directory to house design proposals contributed by collaborators (as distinct from in-tree implementation docs and tutorials under docs/). Moved docs/SOUND_ENGINE_PROPOSAL.md → proposals/SOUND_ENGINE_PROPOSAL.md. Updated the CLAUDE.md and RESOURCES.md resource tables to point to proposals/ as the canonical location for past user/collaborator proposal documents. DONE 2026-05-08.", "type": "docs", "status": "done", "priority": "medium", "file": "proposals/, CLAUDE.md, RESOURCES.md", "created": "2026-05-08", "updated": "2026-05-08"}, {"id": 498, "summary": "Restructure docs/ → tutorials/ with per-chapter subdirectories", "description": "Major reorganisation: rename docs/ → tutorials/, give each tutorial chapter its own subdirectory containing all of its assets (HTML as index.html, images, example code), with tutorials/index.html (was tutorial.html) at the top so it serves cleanly on the web. Examples move from docs/examples/NN into tutorials/NN-name/examples/. Shared CSS at tutorials/style.css. Non-tutorial files in docs/ (vdg-modes.md, image-prompts.md) move to project root. Presentation-only images (mc6809.jpg, photo-coco-room.png, photo-first-computer.png) move to /images/. Update all internal links in chapter HTMLs (../style.css, sibling-chapter links to ../NN-name/), reference.html, presentation.html, Makefile (tutorial-dsk paths), CLAUDE.md and RESOURCES.md doc tables.", "type": "docs", "status": "done", "priority": "medium", "file": "docs/ → tutorials/, plus refs in CLAUDE.md, RESOURCES.md, Makefile, reference.html, presentation.html", "created": "2026-05-08", "updated": "2026-05-08"}, {"id": 499, "summary": "kernel/boot-animation.html: support ROM-mode + all-RAM-mode toggle", "description": "Animation describes only the all-RAM boot dance (CLOADM staged kernel at $1000, bootstrap at $0E00, copy to $E000) — but ROM mode is now the default kernel profile (kernel ORGs at $2000, no bootstrap, no staging copy, app at $3000, ROMs stay alive at $8000-$DFFF). Update plan: add a mode toggle at the top of the page (ROM mode | All-RAM mode), maintain separate narrative step sequences and memory-map region positions for each mode, and correct the all-RAM addresses that have shifted since the animation was first written (APP_BASE, font/sin/stack offsets per current CLAUDE.md memory map). Keep the file at kernel/boot-animation.html. Cross-check addresses against kernel/README.md and CLAUDE.md memory map sections. IMPLEMENTED 2026-05-08 (awaiting browser test): added a top-of-page mode toggle (ROM mode default | All-RAM mode); body.mode-rom and body.mode-allram CSS classes drive visibility of mode-specific memory regions, narrative step boxes, address labels, and DECB record tables. ROM-mode narrative is 3 steps (Power On → LOADM → JMP START), all-RAM is 5 steps (Power On → LOADM staging → bootstrap enables all-RAM → copy $1000→$E000 → JMP START). Memory map shows kernel at $2000-$2EAF + app at $3000 + font at $5800 + sin at $7800 + stacks at $7E00/$8000 in ROM mode; staged kernel at $1000, bootstrap at $0E00, app at $2000-$8FFF, font at $9000, stacks at $DE00/$E000, kernel-final at $E000+ in all-RAM mode. JS restructured around per-mode steps/undos/stepIds objects. Mode switch rewinds the current mode to step 0 before swapping. Subtitle updated to mention both profiles. Refined per user feedback: corrected all-RAM app extent to $2000-$7FFF (was $8FFF, past LOADM ceiling); split BASIC ROM into ECB ($8000-$BFFF) and Disk-ECB/Cart ($C000-$DFFF); added explicit data-stack and return-stack zones with growth-direction labels (Data ↓ U=$7E00, Return ↓ S=$8000 in ROM mode; equivalents at $DE00/$E000 in all-RAM); added all-RAM sin-table region ($86CC); labeled font/sin blocks; expanded static-data label to call out font-data/sin-data/sprite-data/kernel-buffer contents; added heap region in ROM mode showing free space between font and sin; added $C000 address label; corrected DECB record tables (no fictional separate font/sin records — kernel bakes them in); narratives now explicitly mention LOADM ceiling at $7FFF. DONE 2026-05-08: chart flipped to standard convention (low memory at bottom, high memory at top, matching CoCo Technical Reference page 7); BASIC + DECB ownership at boot now visible with distinct regions for system DP/vars, line buffer, default text VRAM, DECB disk system, BASIC program area, and BASIC 6809 stack at $7E00-$7FFF; LOADM step hides BASIC vars/program/DECB but keeps BASIC stack alive (BASIC is the program executing the load); kernel/bootstrap takeover step retires the BASIC stack; ROM split into three correct 8K regions (ECB $8000-$9FFF, CB $A000-$BFFF, Cart $C000-$DFFF); explicit data-stack and return-stack zones with growth-direction labels in both modes; copy-arrow direction reversed to point UP from $1000 to $E000 in flipped layout.", "type": "docs", "status": "done", "priority": "medium", "file": "kernel/boot-animation.html", "created": "2026-05-08", "updated": "2026-05-08"}, {"id": 500, "summary": "Expand Cloud-9 entry + add BoysonTech to legends", "description": "Cloud-9 Tech entry in legends/companies.md is sparse (SuperBoard/SuperIDE only) but their current product line is broader: 63x09E CPU, Pro-Tector+, TRIAD+ 512K-2048K SRAM, Multi-Pak PAL upgrade, PS/2 keyboard interface, CoCo3 RGB/SCART/HDMI adapter, modular video cables, DOS adapter, TC^3 SCSI adapter. Also add BoysonTech (Ed Snider's CoCoSDC shop) as a Hardware Manufacturers entry; update Ed Snider in whos-who.md.", "type": "docs", "status": "done", "priority": "low", "file": "legends/", "created": "2026-05-11", "updated": "2026-05-11"}, {"id": 501, "summary": "Sound: 1-bit output demo + lib primitives (snd-tone1, snd-click1, snd-noise1)", "description": "Build a new demo exercising the CoCo's 1-bit sound output at $FF22 bit 1 (independent of the 6-bit DAC). Add snd-tone1 ( pitch duration -- ), snd-click1 ( -- ), and snd-noise1 ( delay duration -- ) to lib/sound.fs using read-modify-write (LDB/EORB #$02/STB) to preserve VDG mode bits 7-3 and RS-232 bit 0 in $FF22. Reuse existing snd-init (sound ena
