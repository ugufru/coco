ble is shared via $FF23 bit 3, CB2). New demo at src/sound1bit/ with key map mirroring src/sound/sound.fs (1-4 tones, 5 sweep, 6 click train, 7 noise, 8 A/B vs DAC, BREAK exit). README + auto-generated lib/README.md refresh. DONE 2026-05-15: lib/sound.fs gains snd-tone1, snd-click1, snd-noise1 (+ internal _snd-toggle1). Crucial fix discovered during testing: PIA1 PB bit 1 needs its DDR set as output — BASIC's init leaves it as input — so snd-init now flips $FF23 bit 2 to enter DDR mode, ORs $02 into $FF22, then returns $FF23 to data mode + sound enable ($3C). Demo at src/sound1bit/ verified in XRoar: tones 1-4 clean, sweep clean, click train buzzy, noise hiss, A/B (key 8) clearly distinguishes DAC vs 1-bit timbre. Screen text intact (RMW preserves VDG mode bits). reference.html and lib/README.md updated.", "type": "demo", "status": "done", "priority": "medium", "file": "src/sound1bit/sound1bit.fs, lib/sound.fs", "created": "2026-05-15", "updated": "2026-05-15"}, {"id": 502, "summary": "Makefile: add hello, sound, sound1bit to demos dsk build", "description": "DEMOS list and the dsk target were missing three demos. Added sound and sound1bit to DEMOS (so make all builds them) and added hello, sound, sound1bit to the dsk copy block as HELLO.BIN, SOUND.BIN, SOUND1B.BIN. Dsk now packages 13 programs. Verified by running make dsk — build succeeds and the disk image lists all 13.", "type": "build", "status": "done", "priority": "low", "file": "Makefile", "created": "2026-05-15", "updated": "2026-05-15"}, {"id": 503, "summary": "hello.fs: replace HALT with BREAK→exit-basic", "description": "hello demo ended on HALT, which loops forever — pressing BREAK did nothing. Replaced with BEGIN KEY 3 = UNTIL exit-basic so BREAK returns cleanly to BASIC, matching the other demos. Includes lib/bye.fs (Makefile EXTRA_DEPS updated). Verified in XRoar from the dsk: LOADM\"HELLO\":EXEC prints banner, BREAK drops to OK.", "type": "polish", "status": "done", "priority": "low", "file": "src/hello/hello.fs, src/hello/Makefile", "created": "2026-05-15", "updated": "2026-05-15"}, {"id": 504, "summary": "Rewrite SOUND_ENGINE_PROPOSAL.md after 2026-05-16 design session", "description": "Reconcile the proposal with the design session: (1) add R0=1 partial-speed frame-budget section (22,200 cy/frame, ~85 cy/HSYNC), (2) remove the inconsistent 'Option A produces 500 Hz tones' claim and reframe as click/percussion-only, (3) promote Option C from alternative to recommended path with realistic costs (~32-41% of frame active, ~0% silent), (4) replace the 5-field API state vector with the user's wavetable model (phase, freq, duration, amplitude), (5) document the ZOH variant (synth in main loop, 4-instruction IRQ handler) as the cheapest sub-option, (6) add active-vs-silent cost split, (7) note Y-register and ORCC #$50 kernel-IRQ-mask interactions.", "type": "docs", "status": "done", "priority": "medium", "file": "proposals/SOUND_ENGINE_PROPOSAL.md", "created": "2026-05-16", "updated": "2026-06-16"}, {"id": 505, "summary": "Add CoCo 3 intro / GIME architecture guide", "description": "New coco-guides/coco3-intro.md documenting the CoCo 1/2 -> 3 hardware evolution. Spine: the GIME (ACVC/TCC1014) inserts a layer of indirection + programmability under everything (color->palette, memory->MMU, timing->programmable timer) rather than replacing the 6809E/DAC/keyboard. Includes stark A->B comparison table, subsystem-by-subsystem dev-approach deltas (memory/MMU, video modes, palette RGB-vs-composite, 80-col text, keyboard, sound timing, CPU speed, RGB out), and sourced history/lore (Siegel sound-chip-vs-timer quote, Deluxe CoCo origin, Aug-1985 Microware prototype, two GIME revisions Tequila/Tortilla, myths: hidden 256-color mode, composite regression, timer +2/+1 bug, 210-line bug, Project 256 reverse-engineering, rushed Super Extended BASIC). Plus a forward-looking 'what this means for CoCo Renovation' fork section. Supporting edits: register doc in RESOURCES.md + CLAUDE.md mirrored table; new external sources appended to legends/references.md (Lomont hw ref, Sock's GIME register reference, Tandy CoCo 3 Service Manual, Siegel interview, Marentes 256 Mode, tlindner GIME timer tests).", "type": "docs", "status": "done", "priority": "medium", "file": "coco-guides/coco3-intro.md", "created": "2026-05-31", "updated": "2026-06-16"}, {"id": 506, "summary": "Write CoCo 3 support plan (proposals/COCO3_SUPPORT_PLAN.md)", "description": "Document a phased plan for explicitly supporting the CoCo 3 / GIME, grounded in a kernel+lib hardware inventory. Frames gaps in three tiers: (1) pure additions with no resisting code (GIME detection keystone, 64-color palette $FFB0-$FFBF, stable double-speed $FFD8/9, RGB-vs-composite palette tables); (2) gaps blocked by baked-in CoCo 1/2 assumptions (32-col text welded into EMIT/CR/AT/TYPE + NSCR, hardware text attributes, MMU paging $FFA0-$FFAF vs flat 64K, new graphics modes 320x192x16/640x192x2 vs RG6-only with #32 stride / #$03 color baked into rg-pset/rg-line/spr-draw/beam-trace/rg-char); (3) timing story (programmable GIME timer $FF94/95 FIRQ vs the kernel's permanent ORCC #$50 IRQ mask + all-polling design; double-speed silently breaks cycle-timed sound). Non-gaps noted: keyboard matrix + 6-bit DAC output are identical. Principle: every feature gates on runtime GIME detection so one binary still runs on a CoCo 2. References coco-guides/coco3-intro.md. Companion to ROADMAP.md (candidate future phase).", "type": "docs", "status": "done", "priority": "medium", "file": "proposals/COCO3_SUPPORT_PLAN.md", "created": "2026-05-31", "updated": "2026-06-16"}, {"id": 507, "summary": "Display mode reference comparing CoCo 1/2 (VDG) and CoCo 3 (GIME) text + video modes", "description": "New coco-guides/display-modes.md: a unified reference that puts the CoCo 1/2 VDG modes and the CoCo 3 GIME modes side by side. Text modes (VDG 32-col alphanumeric/SG vs GIME 32/40/64/80-col with attribute byte), graphics modes (VDG SG4-24/CG1-6/RG1-6 vs GIME 320/640 wide x 2/4/16 color), with resolution/colors/VRAM/bytes-per-row and the controlling registers for each (SAM $FFC0-$FFC5 + PIA1 $FF22 for VDG; GIME $FF98/$FF99 HRES/CRES + $FF9D-E offset for GIME). Cross-references vdg-modes.md (deep 1/2 detail) and coco3-intro.md (context). Needs exact GIME $FF99 bit encodings verified against Sock's GIME reference + Lomont before publishing.", "type": "docs", "status": "done", "priority": "medium", "file": "coco-guides/display-modes.md", "created": "2026-05-31", "updated": "2026-06-16"}, {"id": 508, "summary": "Implement async-sound.fs — cooperative HSYNC-polling sound library", "description": "General-purpose non-blocking sound library (not Space Warp specific). Cooperative cyclic-executive design: NO kernel changes — snd-poll reads HSYNC flag $FF01 bit7 and writes the 6-bit DAC $FF20 directly from a library CODE word; no FIRQ vector, no kvar-firq, no ORCC/ANDCC. Supersedes the proposal's Option C FIRQ path, which rests on a hardware error (HSYNC is on the IRQ line, not FIRQ — coco_technical_reference.txt:4775, vdg-modes.md:180-181; per-line IRQ would cost ~11,500cy/frame just in entry/exit tax). Three tiers of words: (setup) snd-async-init [CODE, reuse lib/sound.fs snd-init PIA mux->DAC]; (control, main loop) snd-note (freq amp frames--), snd-stop (--), snd-frame (--) once/VSYNC duration+envelope, snd-pitch! (freq--), snd-amp! (amp--), snd-playing? (--f); (sub-frame core) snd-poll (--) [CODE workhorse: HSYNC-edge-detect via snd-last-hs, advance snd-phase by snd-inc, lookup snd-wave[phase_hi], shift by snd-amp, STA $FF20], snd-fill (n--) [CODE tight loop emitting n HSYNC-locked samples for vsync-wait / wait-past-row spin]; (data/helpers) freq>inc (freq--inc), snd-wave 256-byte sine via DATA[PY (square special-cased). DP-located state cells in free $0050-$007F: snd-cur, snd-phase, snd-inc, snd-amp, snd-frames, snd-active, snd-last-hs. Target sample rate 16-32/frame (~480-720Hz square ceiling per space-warp #485) = fresh DAC write every ~700-1375cy, NOT every HSYNC. Open design decision to settle during impl: snd-poll call-paced vs HSYNC-edge-paced (latter chosen — stable pitch, <=84cy blocking wait). Additive: existing synchronous lib/sound.fs untouched. Refs proposals/SOUND_ENGINE_PROPOSAL.md (revision 2026-06-09) + proposals/hsync_polling_budget_chart.html.", "type": "feature", "status": "done", "priority": "medium", "file": "lib/async-sound.fs", "created": "2026-06-09", "updated": "2026-06-09"}, {"id": 509, "summary": "src/sound-async demo — exercise and verify async-sound.fs", "description": "Standalone demo that proves the async engine is non-blocking and is the test vehicle for #508 (library must be tested before #508 can resolve). Runs a moving SG4 sprite plus a continuous tone simultaneously, demonstrating that snd-poll/snd-fill placement keeps the tone going without stopping the animation. Sweeps pitch via snd-pitch! to show continuous control, and uses snd-fill inside the VSYNC-wait to show the dense-cluster venue. ROM mode, 32K. Wire into Makefile DEMOS + dsk copy (SNDASYNC.BIN). Verify in XRoar: tone is audible and steady while the sprite moves; BREAK exits to BASIC. Captures real snd-poll cycle cost measured with fc.py --cycles for feedback into the proposal/Space-Warp plan.", "type": "demo", "status": "done", "priority": "medium", "file": "src/sound-async/", "created": "2026-06-09", "updated": "2026-06-09"}, {"id": 510, "summary": "Release Bare Naked Forth 1.2 — async sound headline feature", "description": "Bump the distribution version 1.1 -> 1.2 with the cooperative async sound engine (lib/async-sound.fs, #508; src/sound-async demo, #509) as the headline feature. Changes: kernel/kernel.asm KERN_VERSION EQU $0101 -> $0102 (BCD major.minor; flows to the 'BARE NAKED FORTH <version>' banner in src/hello via the fc.py-exposed KERN-VERSION constant); README.md title 'Version 1.1' -> '1.2' plus a short release note listing async sound; rebuild BOTH kernels (make + make allram) per the kernel-change rule so kernel.map carries the new symbol; rebuild hello + sound-async and re-sync demo bins. Verify hello prints 'BARE NAKED FORTH 1.2' in XRoar.", "type": "release", "status": "done", "priority": "medium", "file": "kernel/kernel.asm, README.md", "created": "2026-06-09", "updated": "2026-06-16"}, {"id": 511, "summary": "Document async-sound.fs in reference.html (Library Words)", "description": "Add an 'Asynchronous Sound' ref-section under Library Words in reference.html, matching the existing 'Sound Effects' (sound.fs) section: INCLUDE path, prose explaining the cooperative non-blocking model (HSYNC-flag polling at $FF01, DAC at $FF20, no kernel changes, snd-fill for HSYNC-locked bursts vs snd-poll opportunistic, freq>inc assumes full snd-fill rate), and a ref-table of the public words (snd-async-init, snd-note, snd-stop, snd-frame, snd-pitch!, snd-amp!, snd-playing?, snd-poll, snd-fill, freq>inc) with stack effects, plus a short usage example. reference.html is the canonical full reference per CLAUDE.md; lib/README.md (auto-generated index) already updated under #508.", "type": "docs", "status": "done", "priority": "medium", "file": "reference.html", "created": "2026-06-09", "updated": "2026-06-09"}, {"id": 512, "summary": "async-sound: per-frame pitch slide (snd-slide!) for sweeps/zaps", "description": "Add a signed per-frame phase-increment delta to lib/async-sound.fs so a voice can slide pitch over its lifetime with no per-frame work by the caller. New VARIABLE snd-slide (0 = steady); snd-frame adds snd-slide to snd-inc each frame; snd-note zeroes snd-slide (fresh note steady by default); new word snd-slide! ( delta -- ). Enables one-shot sweeps (maser/zap = start high + negative slide; rise = positive slide) where the scheduler only calls snd-note + snd-slide! on the fire event and the existing per-frame snd-frame self-sweeps. Caller sizes |slide|*frames < inc0 to keep the increment positive. Convenience snd-sweep (auto-compute slide from f0/f1/frames) deferred (needs signed divide). Update reference.html + lib/README.", "type": "feature", "status": "done", "priority": "medium", "file": "lib/async-sound.fs", "created": "2026-06-09", "updated": "2026-06-09"}, {"id": 513, "summary": "sound-async demo: model sound-demo effects (maser/zap, beep, hit, rise)", "description": "Rework src/sound-async/sound-async.fs from a single steady tone into an interactive FX demo mirroring src/sound/sound.fs, but non-blocking: keypresses (Z maser/zap, B beep, H hit, R rise) start async effects via snd-note + snd-slide!; the main loop emits audio with snd-fill while a note plays (snd-playing?) and vsync-paces when idle, with a marker animating continuously to prove the game keeps running during sound. BREAK quits. Demonstrates the async equivalents of the synchronous snd-zap/snd-beep/snd-hit. Noise effects (snd-boom) need a noise wavetable, deferred.", "type": "demo", "status": "done", "priority": "medium", "file": "src/sound-async/sound-async.fs", "created": "2026-06-09", "updated": "2026-06-09"}, {"id": 514, "summary": "async-sound: waveform select, rest (silence), and noise", "description": "Engine additions to lib/async-sound.fs so the demo set can match sound.fs: (1) three more 256-byte signed wavetables snd-square/snd-saw/snd-tri alongside the existing sine (snd-wave), plus snd-waveform ( addr -- ) to point snd-wave-base at any of them (no hot-path change; snd-poll/snd-fill already read the cached base). (2) snd-rest ( frames -- ) = a silent voice for N frames (inc 0 + amp 8 -> wavetable sample collapses to DAC midpoint), the async analog of snd-pause, enabling gaps between notes. (3) noise: VARIABLE snd-seed + CODE snd-noise-fill ( n -- ) writing n HSYNC-locked pseudo-random DAC samples via a 16-bit galois LFSR (tap $B400), seeded in snd-async-init. Update reference.html + lib/README.", "type": "feature", "status": "done", "priority": "medium", "file": "lib/async-sound.fs", "created": "2026-06-09", "updated": "2026-06-09"}, {"id": 515, "summary": "sound-async demo: full sound.fs effect menu (waveforms, sweep, noise, chirp, dock)", "description": "Expand src/sound-async to mirror the src/sound menu, non-blocking: square tones (4 pitches), descending sweep, sawtooth, triangle, sine, noise burst, beep, zap/maser, boom, chirp, dock, hit. Composite effects sequenced via a small in-demo note queue (nq-reset/nq-add/nq-play over a DATA scratch buffer): each loop iteration starts the next queued note when the voice goes idle, with rests queued as silent notes (snd-rest semantics). Noise/boom driven by a chunked snd-noise-fill + a noise-frame counter so the marker keeps moving. Marker animates throughout to prove non-blocking; BREAK quits.", "type": "demo", "status": "done", "priority": "medium", "file": "src/sound-async/sound-async.fs", "created": "2026-06-09", "updated": "2026-06-09"}, {"id": 516, "summary": "async-sound: generate wavetables at runtime into caller-chosen RAM", "description": "Replace the four static DATA[PY wavetables (snd-wave/snd-square/snd-saw/snd-tri, ~1KB baked into every binary) with runtime generators that fill a 256-byte signed table at any caller-given address: gen-sine, gen-square, gen-saw, gen-tri ( addr -- ), plus /wave (256) constant. Lets 64K apps (Space Warp et al.) build tables in free hi RAM (e.g. $9200 in all-RAM mode) instead of consuming program space; apps with memory to spare can generate into a DATA buffer. snd-async-init no longer sets a default sine (no static table); caller generates a table and points snd-waveform at it. Sine uses a two-lobe parabolic approximation (cheap, no sin dependency, smooth on the 6-bit DAC). Update src/sound-async to generate its tables at startup (demo uses a fixed hi address to mirror the SW use case) and reference them via wt-* variables; update reference.html + lib/README.", "type": "feature", "status": "done", "priority": "medium", "file": "lib/async-sound.fs", "created": "2026-06-09", "updated": "2026-06-09"}, {"id": 517, "summary": "Oscillator/wavetable roadmap notes from Faust library review", "description": "proposals/OSCILLATOR_NOTES.md: forward-looking notes (post-1.2) distilled from the Faust oscillators library (faustlibraries.grame.fr/libs/oscillators), filtered for the 6809 / 6-bit DAC / ~15.7kHz constraints. Captures (1) splitting wavetable generation into its own lib/wavetable.fs separate from the async playback engine; (2) the generate-time vs play-time cost lens; (3) prioritized feature notes: variable-duty pulse/PWM, band-limited additive tables + octave mip-maps (anti-aliasing), Casio-CZ phase distortion for brightness sweeps, hard sync, resonator/coupled-form table-free sine, phasor/phase-offset exposure. Roadmap/notes only; no code.", "type": "docs", "status": "done", "priority": "low", "file": "proposals/OSCILLATOR_NOTES.md", "created": "2026-06-10", "updated": "2026-06-10"}, {"id": 518, "summary": "Expand OSCILLATOR_NOTES.md: 2-op/Electribe model, LFO matrix, 6809 MUL ring-mod, drum recipes", "description": "Major expansion of proposals/OSCILLATOR_NOTES.md driven by a 'state-of-the-art on 6809, low RAM + low CPU' design goal. Adds: design north star + RAM/CPU budget framing; a compact 2-operator+LFO voice model (one shared 256B sine table + two phase accumulators); two-operator modulation & the Korg Electribe model (ring mod, phase-mod/FM with ratio+depth, AM, sync); LFO modulation matrix (shapes incl. sample-&-hold via LFSR x targets pitch/amp/duty/PD-index/mod-depth); 6809-specific techniques (hardware MUL ring mod -- the 6502/Z80 can't; dual index regs for 2-op lookup; self-feedback FM); drum & SFX recipe cookbook (kick/tom/snare/hat/cowbell/clap/laser); wildcards (NES short-mode LFSR noise, bit/rate crush, wavefolding, wave-sequencing, Karplus-Strong, supersaw). Keeps the generate-time vs play-time lens. Roadmap/notes only.", "type": "docs", "status": "done", "priority": "low", "file": "proposals/OSCILLATOR_NOTES.md", "created": "2026-06-10", "updated": "2026-06-10"}, {"id": 519, "summary": "Split wavetable generators into lib/wavetable.fs", "description": "Move the waveform-table generators out of lib/async-sound.fs into a new dependency-free lib/wavetable.fs (the first step in OSCILLATOR_NOTES.md sequencing): /wave constant + gen-sine/gen-square/gen-saw/gen-tri. async-sound.fs keeps only the playback engine and no longer defines the generators. The two libs are independent (wavetable.fs needs only kernel primitives); the demo includes both. Update src/sound-async INCLUDEs, reference.html, and lib/README. Verify the FX demo still builds and runs identically.", "type": "refactor", "status": "done", "priority": "medium", "file": "lib/wavetable.fs, lib/async-sound.fs", "created": "2026-06-10", "updated": "2026-06-10"}, {"id": 520, "summary": "sound.fs: consolidate DAC/PIA init (drop per-effect re-init)", "description": "lib/sound.fs inlines the same PIA/DAC setup (FF01/FF03/FF21/FF23) in snd-tone, snd-tone1, snd-click1, snd-saw, snd-sin -- ~5-6 copies of ~10-15 bytes -- plus the standalone snd-init. Require callers to run snd-init once up front (matching how async-sound requires snd-async-init) and delete the inlined copies. Pure code-size win (~60-75 bytes), no CPU cost, no fc.py changes. Behavior change: effects assume snd-init has run -- document it and update the sound demos.", "type": "refactor", "status": "done", "priority": "high", "file": "lib/sound.fs", "created": "2026-06-10", "updated": "2026-06-10"}, {"id": 521, "summary": "async-sound: algorithmic waveform mode (table-free saw/square/tri)", "description": "gen-saw stores i-128, which is exactly the phase high byte; square is its sign; triangle is a fold of it. Only sine/custom needs a real 256-byte table. Add a per-voice waveform mode so saw/square/tri are computed inline from the phase (no table generated or stored) -- saves up to 768 bytes for apps using only simple waves. Costs one branch per emitted sample. Serves the low-RAM goal and folds into the 2-op design (sine-table operators, algorithmic carriers). Trade-off: a non-uniform emit path; weigh against keeping everything table-based.", "type": "feature", "status": "done", "priority": "medium", "file": "lib/async-sound.fs, lib/wavetable.fs", "created": "2026-06-10", "updated": "2026-06-10"}, {"id": 522, "summary": "fc.py: shared-asm / macro support for CODE words", "description": "fc.py has no way to share assembly across CODE words: they are NEXT-terminated (not JSR-able) and there is no shared-asm prelude or macro facility. Add a mechanism -- e.g. a shared ASM[...]ASM prelude block emitted once before the CODE words where MACROs or RTS-terminated subroutines with global labels can be defined and referenced from CODE/KCODE blocks. Enabler for DRY-ing the async emit core (#523) and benefits the whole project (any repeated asm fragment). Tooling change; needs care with the local-label scoping and the combined-assembly model. [DEFERRED 2026-06-10: fc.py extracts CODE words individually, so JSR subroutines need a two-pass address-fixup; macros would DRY source but not shrink the binary. Deferred per user -- keep emit fragments inline for now; revisit if the 2-op build bloats.]", "type": "feature", "status": "open", "priority": "low", "file": "tools/fc.py", "created": "2026-06-10", "updated": "2026-06-10"}, {"id": 523, "summary": "async-sound: DRY the emit core (phase-advance, scale-output, hsync-wait)", "description": "Three fragments are copy-pasted across the emitters: phase-advance+table-lookup (snd-poll, snd-fill), amplitude-scale+recenter+mask+DAC-write (snd-poll, snd-fill, snd-noise-fill), and the HSYNC-edge wait (snd-fill, snd-noise-fill). This duplication multiplies with every future 2-op/ring-mod/phase-mod variant. Factor into shared macros or JSR-able subroutines (depends on #522). Reduces code size now and turns the 2-op build from copy-paste into compose. Keep snd-poll's hot path fast (emit only runs on a fresh HSYNC, so a JSR is amortized). [DEFERRED 2026-06-10: fc.py extracts CODE words individually, so JSR subroutines need a two-pass address-fixup; macros would DRY source but not shrink the binary. Deferred per user -- keep emit fragments inline for now; revisit if the 2-op build bloats.]", "type": "refactor", "status": "open", "priority": "low", "file": "lib/async-sound.fs", "created": "2026-06-10", "updated": "2026-06-10"}, {"id": 524, "summary": "async-sound: page-aligned wavetable lookup (CPU)", "description": "The per-sample lookup does TFR A,B / CLRA / LDY base / LDA D,Y (~20 cy) because 6809 accumulator-offset indexing is signed. If wavetables are page-aligned (table base low byte = 0, which $9200/$7000 already satisfy), the lookup becomes poke-index-into-low-byte + indirect (~12 cy) -- about 7-8 cy/sample saved, doubling in value with a second operator. Requires page-aligned tables (make it a documented constraint) and a DP pointer cell. Measure with fc.py --cycles; must stay ROM-safe (no self-modifying code).", "type": "perf", "status": "done", "priority": "medium", "file": "lib/async-sound.fs", "created": "2026-06-10", "updated": "2026-06-10"}, {"id": 525, "summary": "async-sound: DP-locate voice state (CPU)", "description": "Voice state (snd-phase/inc/amp/frames/...) lives in app RAM via FVAR_ extended addressing. Moving it into the free direct-page region ($0050-$007F) saves ~1 cy per 16-bit access in the hot emitters (~4 cy/sample, doubling under 2-op). Needs a way to place Forth VARIABLEs (or the CODE-referenced cells) at DP addresses and reference them with direct addressing. Measure the actual saving; coordinate with #524 (the lookup pointer would also be DP). [DEFERRED 2026-06-10: needs DP-variable placement -- a fc.py feature (place a VARIABLE at $0050-$007F + reference it with direct addressing in CODE) or hacky hardcoded DP addresses that break the snd-phase @ Forth API. Same tooling class as the deferred #522. CPU is already net-neutral after #521+#524; DP gets more valuable alongside the 2-op build, when it would pair with the tooling. Deferred.]", "type": "perf", "status": "open", "priority": "low", "file": "lib/async-sound.fs", "created": "2026-06-10", "updated": "2026-06-10"}, {"id": 526, "summary": "wavetable: one canonical true sine from the kernel sin table", "description": "Two sine sources exist: gen-sine (parabolic approximation) and the kernel's real 91-byte sin-data (via lib/trig.fs init-sin, used by sound.fs snd-sin). Offer a gen-sine variant that builds the 256-byte table from the kernel sin-data by quadrant symmetry -- a truer sine, reusing bytes the kernel already ships, unifying the two sources. Keep the parabolic version as the no-dependency default; the HQ version pulls in the kernel sin table.", "type": "feature", "status": "done", "priority": "low", "file": "lib/wavetable.fs", "created": "2026-06-10", "updated": "2026-06-10"}, {"id": 527, "summary": "Document sound-library code/RAM footprint", "description": "Record the measured code-RAM footprint of the sound libraries so users know the cost of including them. Measured by building each into a trivial harness and diffing the app byte count (fc.py has no dead-code elimination, so the cost is fixed per included file): lib/wavetable.fs ~360B, lib/async-sound.fs ~615B, lib/sound.fs ~580B, lib/trig.fs ~250B; runtime wavetable buffer 256B/table (in caller RAM, not the binary). Add a Footprint: header field to each lib .fs (and teach tools/gen-lib-readme.py to surface it in lib/README), and a footprint note to each sound section in reference.html.", "type": "docs", "status": "done", "priority": "low", "file": "lib/*.fs, reference.html, tools/gen-lib-readme.py", "created": "2026-06-10", "updated": "2026-06-10"}, {"id": 528, "summary": "async-sound: smooth amplitude + per-frame amplitude envelope (snd-env)", "description": "Replace the coarse shift-based amplitude (snd-amp = 0..8 right-shift, only 8 levels) with a smooth multiply-based attenuation (snd-amp = 0..255, 0=full) using the 6809 MUL: scaled = sample * (255-att) >> 8, with an att=0 fast path so full-volume voices skip the multiply. Add snd-env (signed per-frame attenuation delta) applied in snd-frame exactly like snd-slide is for pitch -- the amplitude envelope: positive env fades out (decay), negative fades in (swell), clamped 0..255. New word snd-env! ( delta -- ); snd-note resets snd-env to 0; snd-async-init defaults amp=0 (full); snd-rest = att 255 (silence, was shift 8). Touches all three emitters (snd-poll/fill/noise-fill). Demo: fix snd-rest/chirp-rest silence (att 255) and boom decay (smooth att ramp), and demonstrate the envelope on a tonal effect. Note: per-sample cost rises ~MUL (~15cy) only when attenuating; full volume stays cheap.", "type": "feature", "status": "done", "priority": "medium", "file": "lib/async-sound.fs", "created": "2026-06-11", "updated": "2026-06-11"}, {"id": 529, "summary": "async-sound: square-wave ring modulator (sign-flip)", "description": "Add ring modulation by a square modulator -- the cheap form: ring mod by a +/-1 square is just conditionally NEGATEing the carrier sample (no MUL, no 2nd phase accumulator). Audio-rate via a per-sample down-counter that flips a sign every snd-rm-period samples (modulator freq = sample_rate / (2*period), ~7867/period Hz). State: snd-rm-period (0=off), snd-rm-count, snd-rm-sign; setter snd-ringmod! ( period -- ) sets period+count+sign. Applied in the tonal emitters (snd-poll/snd-fill) BEFORE amp scaling, so amp env composes; carrier = the oscillator (commutative, so carrier/modulator choice is conceptual). Slide on the carrier sweeps the sidebands for free. Ring mod is a persistent timbre setting like the waveform mode (snd-note does NOT reset it). ~28cy/sample when active, ~8cy when off. Demo: add a few ring-mod example voices (steady ring, decaying gong via env, sweeping warp via slide) + dispatch keys + banner. Document in reference.html + lib/README + footprint.", "type": "feature", "status": "done", "priority": "medium", "file": "lib/async-sound.fs", "created": "2026-06-13", "updated": "2026-06-14"}, {"id": 530, "summary": "async-sound: sine/wavetable ring modulator (full 2-op)", "description": "Smoother ring mod with a wavetable (sine) modulator instead of the square -- the full two-operator path from OSCILLATOR_NOTES.md: a second phase accumulator + table lookup + signed MUL (carrier_sample * mod_sample >> 8) per sample. Richer, less harsh bells/voices than the square sign-flip (#529); more expensive (2nd lookup + MUL ~+40-60cy/sample) and needs the deferred shared-asm/2-op tooling (#522/#523) to compose cleanly. Also enables phase-mod/FM (add scaled modulator to the carrier index) on the same machinery. Future / 2-op phase.", "type": "feature", "status": "open", "priority": "low", "file": "lib/async-sound.fs", "created": "2026-06-13", "updated": "2026-06-13"}, {"id": 531, "summary": "sound-async demo: add classic game SFX examples", "description": "Add four more demo voices showcasing the engine's combined features: K kick (drum -- pitch slide down + fast amp decay), M coin (two-tone pickup via queue, second note fades via env), P pwr (rising major arpeggio via queue = powerup), S siren (two queued notes, slide up then down = wail). Exercise envelope on tonal voices, multi-note queue sequences, and bidirectional pitch slide. Dispatch keys K/M/P/S + banner line.", "type": "demo", "status": "done", "priority": "low", "file": "src/sound-async/sound-async.fs", "created": "2026-06-14", "updated": "2026-06-14"}, {"id": 532, "summary": "Interactive SVG tutorial: ITC threading in Bare Naked Forth", "description": "Self-contained interactive HTML/SVG page (kernel/itc-threading.html) that single-steps through the indirect-threaded-code execution model: registers X=IP, U=DSP, S=RSP, Y=W; the thread of CFAs; the double indirection (thread -> CFA -> code) via NEXT (LDY ,X++ / JMP [,Y]); DOCOL (PSHS X, set IP to body) and EXIT (PULS X); and primitive execution. Worked example: : DOUBLE DUP + ; called from a MAIN thread with 5 on the stack, producing 10, with Step/Back/Reset, animated IP pointer, the [,Y] indirect-jump arrow, live data + return stacks, and per-step narration + the asm being executed. Linked from kernel/README.md.", "type": "docs", "status": "done", "priority": "low", "file": "kernel/itc-threading.html", "created": "2026-06-14", "updated": "2026-06-15"}, {"id": 533, "summary": "Adopt baseline contribution policy (CONTRIBUTING.md)", "description": "Repo has no CONTRIBUTING.md, so its contribution policy (issue-driven workflow via issues.jsonl, docs-as-source-of-truth, verify-don't-invent, bounded autonomy, tested-before-done) is only encoded in CLAUDE.md as assistant instructions and not visible to human contributors. Stamp the canonical baseline template from the contributing skill as CONTRIBUTING.md, filling PROJECT=CoCo Renovation and TRACKER=issues.jsonl. The stamped copy is project-owned and overrides the template; project-specific rules stay in CLAUDE.md, not the policy file.", "type": "docs", "status": "done", "priority": "low", "file": "CONTRIBUTING.md", "created": "2026-06-16", "updated": "2026-06-16"}, {"id": 534, "summary": "Colored RG6 text via copy-mask proposal", "description": "Add proposals/COLORED_TEXT_PROPOSAL.md: render artifact-colored text (white/blue/red) by ANDing each font byte with a color mask during the rg-char glyph copy, instead of pre-baking colored font tables. Font on-pixels are the 11 pair; AND $FF=white (default, no regression), $55 and $AA mask each pair to a single artifact bit (blue/red, exact mapping eyeball-confirmed under CSS/column parity). Primary approach: add VAR_RGCOLMASK (default $FF) + one ANDA in CODE_RG_CHAR's copy loop (kernel.asm:2169), exposed as KVAR-RGCOLMASK alongside KVAR-RGFONT. Fallback: app-side colored-copy CODE word. Zero extra RAM, ~40cy/char. Originated from space-warp title-screen color discussion. Proposal only; implementation tracked separately if approved.", "type": "enhancement", "status": "done", "priority": "low", "file": "proposals/COLORED_TEXT_PROPOSAL.md", "created": "2026-06-20", "updated": "2026-06-20"}, {"id": 535, "summary": "Colored RG6 text via copy-mask (kernel + lib)", "description": "Implement the COLORED_TEXT_PROPOSAL (#534). Kernel: add VAR_RGCOLMASK byte (default $FF) in the rg-char config block in kernel/kernel.asm; insert ANDA VAR_RGCOLMASK in CODE_RG_CHAR's @copy loop between the font-byte load and the VRAM store. Auto-exports as KVAR-RGCOLMASK via fc.py VAR_*->kvar-* rule. $FF=white identity (no regression), $55/$AA mask each artifact pair to a single bit (blue/red, mapping eyeball-confirmed under CSS/column parity). Lib: lib/rg-text.fs reimplements the glyph copy in pure Forth and shadows the kernel primitive, so its rg-char/rg-type would ignore the mask; patch its copy loop to AND each font byte with KVAR-RGCOLMASK C@ so rg-type honors the mask (matches the proposal's documented usage). Build BOTH kernels (make + make allram). Zero extra RAM, ~40cy/char.", "type": "enhancement", "status": "done", "priority": "medium", "file": "kernel/kernel.asm", "created": "2026-06-20", "updated": "2026-06-20"}, {"id": 536, "summary": "Demo: colored RG6 text palette swatch test (src/colored-text/)", "description": "New demo src/colored-text/colored-text.fs exercising the colored-text feature (#535) and serving as the verification harness the proposal asks for. RG6 mode via rg-init (lib/rg-pixel.fs), font via init-font (lib/font-art.fs), strings via rg-type (lib/rg-text.fs). Prints the same line three times, once per mask: $FF (white identity / regression check), $55, $AA. Capture in XRoar to pin down which mask renders blue vs red under the demo's CSS and record the confirmed constants. Add colored-text to the top-level Makefile DEMOS list. Depends on #535.", "type": "demo", "status": "done", "priority": "medium", "file": "src/colored-text/colored-text.fs", "created": "2026-06-20", "updated": "2026-06-20"}, {"id": 537, "summary": "Capture FujiNet Time demo screenshot for gallery", "description": "The demo gallery (#408) ships without a live screenshot for fujinet-time — it blocks on a FujiNet device XRoar can't answer, so tutorials/demos/index.html shows a .demo-noshot placeholder. Capture a real screenshot of the YYYY.MM.DD HH:MM:SS readout (FujiNet-capable emulator/hardware, or by mocking the fn-time response) and replace the placeholder with an <img> at tutorials/demos/images/fujinet-time.png.", "type": "docs", "status": "open", "priority": "low", "file": "tutorials/demos/index.html", "created": "2026-07-01", "updated": "2026-07-01"}, {"id": 538, "summary": "Per-demo deep-dive HTML pages (full walkthroughs)", "description": "Each demo in the gallery currently has a summary card. Build a full HTML page per demo that fully explains what's going on — annotated source walkthrough, the techniques used, the hardware it touches. Likely where the embedded WASM XRoar runner (#409) becomes valuable so readers can run each demo inline. Future/backlog.", "type": "docs", "status": "icebox", "priority": "low", "file": "tutorials/demos/", "created": "2026-07-01", "updated": "2026-07-01"}, {"id": 539, "summary": "Bespoke documentation publishing pipeline (markdown → servable HTML site)", "description": "EPIC. Bespoke publishing pipeline generating the whole web-servable site into a single committed site/ directory (served directly from git / copied to the website). DECISIONS: output = site/ at repo root, committed; markdown parsed by a small Python library (markdown/mistune) with all templating, nav, styling and link-rewriting as our own code; no third-party static-site framework. Markdown stays the source for generated pages; bespoke HTML (tutorial, reference, appendices) is hand-maintained and copied in with link-rewriting. Tracked via sub-issues #541-#547.", "type": "tooling", "status": "open", "priority": "medium", "file": "tools/", "created": "2026-07-01", "updated": "2026-07-01"}, {"id": 540, "summary": "XRoar appendix — how we use it, what it is, CLI + debugging tips", "description": "Add a tutorial appendix (tutorials/xroar/index.html) on XRoar: what it is and does, how this project uses the command-line build (machine/ROM flags, -run, disk mounting), and basic debugging tips — emphasising CLI features since we drive it from the terminal. Source knowledge from the /xroar skill knowledge base.", "type": "docs", "status": "done", "priority": "medium", "file": "tutorials/xroar/index.html", "created": "2026-07-01", "updated": "2026-07-02"}, {"id": 541, "summary": "Publishing: build-site.py skeleton + `make site` + pin markdown dep", "description": "Create tools/build-site.py skeleton and a top-level `make site` target that renders a single markdown file into site/ end-to-end. Pin the chosen markdown parser (markdown or mistune) in a tools requirements file. Foundation for #539.", "type": "tooling", "status": "done", "priority": "high", "file": "tools/build-site.py", "created": "2026-07-01", "updated": "2026-07-02"}, {"id": 542, "summary": "Publishing: shared style tokens + docs.css for generated pages", "description": "Extract the shared palette/type tokens (--green*, fonts) into site/assets/tokens.css imported site-wide. Author docs.css for generated markdown pages: article body + sidebar-nav layout, harmonised with the tutorial's green/serif book aesthetic but denser and navigable. Part of #539.", "type": "tooling", "status": "done", "priority": "high", "file": "tools/build-site.py", "created": "2026-07-01", "updated": "2026-07-02"}, {"id": 543, "summary": "Publishing: markdown page rendering with shared template + nav", "description": "Render each source .md to an HTML fragment (via the parser lib) and wrap it in our shared template: header, sidebar/section nav, footer. Generate the nav from the manifest. Never hand-edit generated HTML. Part of #539.", "type": "tooling", "status": "done", "priority": "high", "file": "tools/build-site.py", "created": "2026-07-01", "updated": "2026-07-02"}, {"id": 544, "summary": "Publishing: copy bespoke HTML trees (tutorials, reference) into site/ with link rewriting", "description": "Copy the hand-maintained HTML (tutorials/ book + appendices, reference.html) into site/ verbatim, rewriting relative links (../reference.html, cross-appendix links) so they resolve from the site root. The tutorial is the crown jewel — must render identically. Part of #539.", "type": "tooling", "status": "done", "priority": "high", "file": "tools/build-site.py", "created": "2026-07-01", "updated": "2026-07-02"}, {"id": 545, "summary": "Publishing: site manifest + internal-link validation", "description": "A single declarative manifest listing (source -> output, kind: generate|copy, style). Adding a doc = one line. Build validates internal links and flags orphaned/unlisted files so the doc set can't silently drift. Part of #539.", "type": "tooling", "status": "done", "priority": "medium", "file": "tools/build-site.py", "created": "2026-07-01", "updated": "2026-07-02"}, {"id": 546, "summary": "Publishing: source-code link strategy (link out to GitHub)", "description": "Generated pages and the tutorial link to src/ files (e.g. ../../src/...). On the served site, rewrite these to point at the GitHub repo by default (rendering source into the site is a later option). Centralise the rule in the build script. Part of #539.", "type": "tooling", "status": "done", "priority": "medium", "file": "tools/build-site.py", "created": "2026-07-01", "updated": "2026-07-02"}, {"id": 547, "summary": "Publishing: landing/index page + PUBLISHING.md", "description": "Generate site/index.html (cover + top-level nav across book, reference, guides, and generated notes, reusing cover-* classes). Write PUBLISHING.md documenting the whole process: source classes and the one-rule-each, the style contexts and which CSS applies where, the tools used, and how to add a new page. Part of #539.", "type": "tooling", "status": "done", "priority": "medium", "file": "tools/build-site.py", "created": "2026-07-01", "updated": "2026-07-03"}, {"id": 548, "summary": "reference.html shows stale version 1.1 (kernel is 1.2)", "description": "reference.html displays VERSION 1.1 in the header chapter-label (line ~32) and documents KERN-VERSION as $0101 (1.1) in both the value cell and prose (lines ~635-636). The kernel actually ships KERN_VERSION EQU $0102 (1.2) per kernel.asm, and README.md/ROADMAP.md already read 1.2. Update reference.html to 1.2 / $0102 so the docs match the shipped kernel.", "type": "docs", "status": "done", "priority": "medium", "file": "reference.html", "created": "2026-07-02", "updated": "2026-07-02"}, {"id": 549, "summary": "Rewrite COCO_RENOVATION.md as a manifesto reflecting current reality", "description": "The founding vision doc predated the Forth pivot: it described an on-device ROM toolchain that was never built and contradicted the cross-development reality now on the landing page. Rewrote it as a manifesto: honest about cross-compilation (desktop workshop, CoCo target, no on-device compilation), bridged the software-vs-hardware framing (1982 limits were era hardware economics, now lifted), reordered sections (workflow after what-renovation-is), added the RP2350 hardware section (copico-centipede/Centipede by strickyak, unreleased RP2350 CoCoFujiNet), and built to the 'CoCo is an idea now' thesis. No em-dashes.", "type": "docs", "status": "done", "priority": "medium", "file": "COCO_RENOVATION.md", "created": "2026-07-03", "updated": "2026-07-03"}, {"id": 550, "summary": "Tutorial index cover still shows Version 1.1 (kernel is 1.2)", "description": "tutorials/index.html cover-platform reads 'TRS-80 Color Computer -- Version 1.1' while the shipped kernel is 1.2 (same drift fixed in reference.html, #548). Update the tutorial cover to 1.2 and rebuild so the copied site/tutorials/index.html matches.", "type": "docs", "status": "done", "priority": "medium", "file": "tutorials/index.html", "created": "2026-07-03", "updated": "2026-07-03"}, {"id": 551, "summary": "EPIC: on-device self-hosting Forth (program the machine on the machine)", "description": "Resolves the ROADMAP open strategic fork in favor of native self-hosting Forth (NOT Extended Color BASIC emulation, which contradicts the renovation-not-emulation thesis). Goal: compile Forth on the CoCo itself via the renovation cartridge, not just execute cross-compiled threads. Design decisions settled 2026-07-19: (1) Headerless ITC threads stay in RAM, byte-identical to cross-compiled images; names/symbols live in a DETACHED sidecar (strip-and-keep-.pdb model), so the runtime carries zero name overhead. (2) Model B: symbols are RAM-resident DURING a dev session (fast FIND, a normal pointer walk), and the filesystem is where the symbol table is persisted and reloaded from, NOT where FIND looks per-lookup. Disk I/O happens at session boundaries, never on the compile hot path. (3) fc.py becomes a symbol producer too: emit a .sym sidecar per .bin in a shared format, so headerless cross-compiled binaries (kernel.sym for the 81 primitives, app.sym per program, session.sym for interactive defs) become fully symbolizable/debuggable on-device. Stamp each .sym with HERE/build-id to detect staleness and refuse to symbolize on mismatch. (4) Image/word model over file model: the live dictionary of definitions is the working artifact; source is stored PER WORD; .fs files are import/export interchange only, reconstructed for free by concatenating stored per-word source in definition order (feeds fc.py directly). (5) The editor is a DEFINITION editor, not a file editor: WORDS to browse, pick a word, edit its source in a small full-screen buffer, recompile on exit. SEE prints stored source rather than decompiling threads. (6) REPL is free: it is the outer interpreter in interpret state, the same loop the editor needs for compiling colon defs. (7) On-device assembler is CRITICAL (most of lib/ and the demos are CODE words; without it the system can only recombine existing primitives, never mint new ones). Build it as a Forth vocabulary in the postfix/RPN dialect (mnemonics are words emitting opcodes at HERE, operands reversed, trailing comma, structured control via stack backpatching) because it piggybacks on HERE/,/C,/the data stack/the outer interpreter and is the smallest thing that works (~1-2KB). The hard, risk-carrying nugget is the 6809 INDEXED-ADDRESSING POSTBYTE ENCODER (~16 modes, 5-bit offset special case, 8/16-bit offsets, indirect, PC-relative, auto inc/dec by 1/2) plus short-vs-long branch backpatching. CODE-word portability with fc.py's lwasm dialect is a known break: accept two dialects for now (colon defs stay portable both directions), store postfix source so export is automatic, and treat unifying fc.py on the postfix dialect (reimplement the 6809 encoder in Python, drop lwasm from the CODE path) as a someday. Hardware framing: the renovation CARTRIDGE is the platform (flash for resident image, microSD for bulk/interchange), XRoar is the test bench, a bare machine degrades gracefully to cassette save/load. FIRST SPIKE (sharpest de-risk, needs neither editor nor REPL): write the postfix assembler vocabulary + indexed-postbyte encoder in isolation and prove it by assembling a known CODE word on-device and diffing emitted bytes against lwasm's output for the same instructions. Prerequisites/seed already in ROADMAP Track 3: 27 (WORDS), 26 (.S), 25 (SEE), 22 (memory monitor), 28 (breakpoint trap). Targets all-RAM mode. Sub-epics to file when this starts: header/symbol format + loader, outer interpreter (WORD/FIND/NUMBER/INTERPRET + : ; STATE IMMEDIATE LITERAL), postfix 6809 assembler, per-word source store + .fs export, definition editor, fc.py .sym emission.", "type": "feature", "status": "open", "priority": "high", "file": "kernel/kernel.asm", "created": "2026-07-19", "updated": "2026-07-19"}, {"id": 552, "summary": "Proposal: RP2350 umbilical Forth (live host-to-target compile link)", "description": "Write proposals/UMBILICAL_FORTH_PROPOSAL.md capturing the 2026-08-26 design session. Concept: an RP2350/RP2040 cartridge on the expansion bus acts as a live umbilical between the host toolchain and a running CoCo, so fc.py can compile individual words on demand and poke them into the target. Key enabling finding: our dictionary is headerless (compile_forth, tools/fc.py:864, emits [DOCOL][body][CFA_EXIT] with no name or link fields; word_cfa is a host-side Python dict, ITC threads use absolute CFAs), so adding a word at runtime needs no target-side dictionary linking. Kernel is ROM-independent (kernel.asm:768, direct PIA0 scanning) so it can be spoonfed and run without BASIC init. NOTE: this is development infrastructure for #551, not an alternative to it. Also unblocks #406 by removing its stated dependency chain (#404 serial loader becomes unnecessary, #405 ROM cart stops being a prerequisite, since spoonfeed over USB is both loader and delivery vehicle). Proposed first implementation slice (separate issue when work starts): incremental compilation mode in fc.py, refactoring compile_forth to accept incoming (word_cfa, cursor) and return only delta bytes. Reference hardware/firmware is Henry Strickland's copico-bonobo (MIT), outside this project's access boundaries.", "type": "docs", "status": "open", "priority": "medium", "file": "proposals/UMBILICAL_FORTH_PROPOSAL.md", "created": "2026-08-26", "updated": "2026-08-26"}, {"id": 553, "summary": "ROADMAP.md strategic fork section is stale (superseded by #551)", "description": "ROADMAP.md (reset 2026-06-16) still presents 'Open strategic question (deliberately undecided)' with the on-device-self-hosting vs cross-developed fork unresolved, and says 'Unstarted; no epic filed yet'. Issue #551 (2026-07-19) resolved that fork in favor of on-device self-hosting Forth and IS the epic, with design decisions settled. The stale section actively misleads: a fresh reader (human or Claude) concludes the direction is undecided and may argue against the chosen path. Update the section to record the decision and point at #551, and revisit Track 3 framing ('where the fork bites') accordingly. 2026-08-26: ROADMAP.md updated in three places (fork section rewritten as 'North star', Track 3 framing, Suggested next move). Awaiting user review before marking done.\n\nClosed 2026-10-12. ROADMAP.md (and site/roadmap.html) now records the decision as 'North star: on-device, self-hosting Forth (decided 2026-07-19)' and points at #551 as the epic. Track 3 is reframed as the seed of #551.", "type": "docs", "status": "done", "priority": "medium", "file": "ROADMAP.md", "created": "2026-08-26", "updated": "2026-10-12"}, {"id": 554, "summary": "lib/console.fs: T1 true lowercase (lower-on, con-emit mapping)", "description": "Design session 2026-09-14. Plan: ~/.claude/plans/hi-claude-let-s-talk-polished-crescent.md. RE-POINTED from kernel/kernel.asm to lib/console.fs: ROM-mode kernel has ~125 bytes free (KERN_END $2F83 vs APP_BASE $3000 in kernel/build/kernel.map), not enough for T1 mapping + scroll + control chars. Kernel stays untouched; existing demos unaffected. Moving it into the kernel is #561. CODE words can use SCREEN, NSCR, VAR_CUR directly (fc.py EQUs all map symbols, tools/fc.py:608-630). T1 facts: coco2bus is CoCo 2B (NTSC,T1) (xroar/src/xroar.c:472-477); $FF22 bit 4 (GM0) drives T1 INT/EXT (xroar/src/dragon/dragon.c:1228), glyph index becomes the full 7-bit byte in normal video (xroar/src/mc6847/mc6847.c:488-493). Font dump: $01-$1A a-z, $40-$5F @A-Z[\\]^_, $60-$7F space/digits/punct, $20-$3F inverse digits/punct ($20 solid block). Mapping: c>=$60 -> c AND $1F; $40-$5F -> c; $20-$3F -> c OR $40. SCOPE (this chunk): lower-on ( -- ) = $FF22 C@ $10 OR $FF22 C!; con-emit ( c -- ) CODE word handling printable $20-$7E only, storing at SCREEN+VAR_CUR and advancing (wrap is fine here; scrolling is #555). lib/vdg.fs reset-text clears mode bits on exit. TEST: small .fs doing lower-on and typing \"Hello, World! 0123 [abc] ~\" in xroar -machine coco2bus; screenshot shows real lowercase. 2026-09-14 test: src/terminal/console-test.fs on xroar -machine coco2bus (screenshot): real lowercase renders; 20 lines scrolled leaving line i..t; backspace erased X; {|}~ render as the T1 font glyphs (braces look like parens). Awaiting user confirmation before done. Closed 2026-09-14: user confirmed working in live XRoar sessions (coco2bus T1, Becker bridge, peek/poke drawing, recorded as the \"Darth Vaper\" video).", "type": "feature", "status": "done", "priority": "high", "file": "lib/console.fs", "created": "2026-09-14", "updated": "2026-09-14"}, {"id": 555, "summary": "lib/console.fs: con-emit scrolling, CR/LF/BS/CLS, con-type", "description": "Design session 2026-09-14. Plan: ~/.claude/plans/hi-claude-let-s-talk-polished-crescent.md. RE-POINTED from kernel/kernel.asm to lib/console.fs: ROM-mode kernel has ~125 bytes free (KERN_END $2F83 vs APP_BASE $3000 in kernel/build/kernel.map), not enough for T1 mapping + scroll + control chars. Kernel stays untouched; existing demos unaffected. Moving it into the kernel is #561. CODE words can use SCREEN, NSCR, VAR_CUR directly (fc.py EQUs all map symbols, tools/fc.py:608-630). SCOPE (this chunk, builds on #554): con-emit handles $0D (column 0 of next row, scroll if needed), $0A ignored, $08 (if cursor>0 move back and write $60), $0C (fill $60, home); other control bytes ignored. Scroll: move $0420-$05FF to $0400, fill $05E0-$05FF with $60, cursor=480. Mind the CLAUDE.md flag gotcha (branch on flags before LDD). con-type ( addr len -- ) Forth loop over con-emit for S\" banners. TEST: .fs printing 20+ numbered lines scrolls; BS and CLS behave. 2026-09-14 test: src/terminal/console-test.fs on xroar -machine coco2bus (screenshot): real lowercase renders; 20 lines scrolled leaving line i..t; backspace erased X; {|}~ render as the T1 font glyphs (braces look like parens). Awaiting user confirmation before done. Closed 2026-09-14: user confirmed working in live XRoar sessions (coco2bus T1, Becker bridge, peek/poke drawing, recorded as the \"Darth Vaper\" video).", "type": "feature", "status": "done", "priority": "high", "file": "lib/console.fs", "created": "2026-09-14", "updated": "2026-09-14"}, {"id": 556, "summary": "lib/becker.fs: Becker port words bk? bk@ bk! bk-type", "description": "Design session 2026-09-14. Plan: ~/.claude/plans/hi-claude-let-s-talk-polished-crescent.md. Transport: desktop XRoar Becker port; XRoar is the TCP CLIENT, connecting once at cart creation to 127.0.0.1:65504 (xroar/src/becker.c:80-138), so the server must be up first. $FF41 status bit 1 = byte waiting; $FF42 data read/write (write silently drops on buffer full). hdbdw3bck.rom is not installed, but -cart rsdos -cart-becker enables the port on the plain RS-DOS cart using disk11.rom (xroar/src/rsdos.c:158, romlist rsdos=disk11 at xroar.c:712); RS-DOS never touches the port. XRoar 1.10 (/opt/homebrew/bin/xroar) has Becker compiled in. SCOPE: plain Forth, no CODE: : bk? $FF41 C@ 2 AND ; : bk@ $FF42 C@ ; : bk! $FF42 C! ; TEST: nc -l 127.0.0.1 65504, then a tiny echo .fs run with -cart rsdos -cart-becker; bytes flow both ways. Closed 2026-09-14: user confirmed working in live XRoar sessions (coco2bus T1, Becker bridge, peek/poke drawing, recorded as the \"Darth Vaper\" video).", "type": "feature", "status": "done", "priority": "medium", "file": "lib/becker.fs", "created": "2026-09-14", "updated": "2026-09-14"}, {"id": 557, "summary": "tools/cocoterm_bridge.py: bridge core (socket, line discipline, claude turns)", "description": "Design session 2026-09-14. Plan: ~/.claude/plans/hi-claude-let-s-talk-polished-crescent.md. Claude Code TUI cannot render on 32x16, so a host bridge speaks plain text; the CoCo is a dumb terminal that sends every key and the bridge owns the line. SCOPE (Python stdlib): listen on 127.0.0.1:--port (65504), one client at a time, re-accept on disconnect; banner and \"> \" prompt on connect. Line discipline: printable -> append+echo; $08 -> pop+echo $08; $0D -> echo CR, run a turn; $03 -> kill running turn else clear line, send ^C CR prompt; $0C -> send $0C + prompt. Turn: claude -p <line> --output-format stream-json --verbose --include-partial-messages --permission-mode <mode, default plan> [--allowedTools ...], in --cwd; capture session_id and use --resume <id> on later turns (NOT --continue, which grabs the most recent unrelated conversation). text_delta events go through the reflow (#560); tool_use blocks become \"* <tool> <short arg>\"; result ends the turn. Single paced writer thread (--cps, default 400) because XRoar Becker writes drop on overflow. TEST: nc 127.0.0.1 65504, type hello + CR, reply streams wrapped at 32 cols, pure ASCII. 2026-09-14 live test finding: after several good turns every turn showed \"* error: success\". Root cause: ANTHROPIC_API_KEY is set in the environment and outranks the claude.ai login, so claude -p billed that key, which hit HTTP 400 \"Credit balance is too low\" (result event: subtype=success, is_error=true, api_error_status=400, terminal_reason=api_error, reason text in result). Bridge bug: it printed subtype instead of the reason. Fixed: show and log the result text; added opt-in --no-api-key to drop ANTHROPIC_API_KEY from the child env (not default, since it changes billing). Closed 2026-09-14: user confirmed working in live XRoar sessions (coco2bus T1, Becker bridge, peek/poke drawing, recorded as the \"Darth Vaper\" video).", "type": "tool", "status": "done", "priority": "high", "file": "tools/cocoterm_bridge.py", "created": "2026-09-14", "updated": "2026-09-14"}, {"id": 558, "summary": "Terminal: VT52-style cursor escapes (bridge and terminal.fs)", "description": "Design session 2026-09-14 (Claude Code planning, CoCo terminal to Claude Code). Follow-up filed under the 80% rule; not needed for the first working Claude terminal (#24). Add a small escape subset (cursor home, clear to end of line, cursor position, inverse on/off) so the bridge (#557) can draw a status line or header without scrolling it away. Depends on #24, #555. Keep it tiny; full ANSI parsing is out of scope for a 32x16 VDG.", "type": "feature", "status": "open", "priority": "low", "file": "src/terminal/terminal.fs", "created": "2026-09-14", "updated": "2026-09-14"}, {"id": 559, "summary": "Terminal: CoCo 3 40/80-column version", "description": "Design session 2026-09-14 (Claude Code planning, CoCo terminal to Claude Code). Follow-up filed under the 80% rule. The T1 lowercase path (#554) targets CoCo 2B. A CoCo 3 build would give real lowercase and far more room for Claude output, but BNF has no GIME support: proposals/COCO3_SUPPORT_PLAN.md 2.1 (line 85) calls 40/80 columns 'the deepest gap' and lists the hard-coded 32s in EMIT, CR, AT, TYPE. Bridge (#557) would take a --cols flag. Depends on CoCo 3 kernel work; not started.", "type": "feature", "status": "open", "priority": "low", "file": "src/terminal/terminal.fs", "created": "2026-09-14", "updated": "2026-09-14"}, {"id": 560, "summary": "tools/cocoterm_bridge.py: streaming reflow and ASCII sanitizer with --selftest", "description": "Design session 2026-09-14. Plan: ~/.claude/plans/hi-claude-let-s-talk-polished-crescent.md. Pure, testable piece of the bridge (#557). Streaming reflow class fed arbitrary text chunks: map unicode punctuation to ASCII (em/en dash to -, smart quotes to straight, ellipsis to ..., bullets to -), drop * and backticks, drop # at line start, replace anything else outside $20-$7E with ?, word-wrap at --cols (32) with a word buffer and column counter, hard-break over-long words, newline -> CR ($0D). Must give identical output regardless of how the input is chunked. --selftest runs asserts (chunking invariance, wrap width, no bytes outside $0D/$20-$7E) and exits 0. Closed 2026-09-14: user confirmed working in live XRoar sessions (coco2bus T1, Becker bridge, peek/poke drawing, recorded as the \"Darth Vaper\" video).", "type": "tool", "status": "done", "priority": "high", "file": "tools/cocoterm_bridge.py", "created": "2026-09-14", "updated": "2026-09-14"}, {"id": 561, "summary": "Kernel: absorb lib/console.fs (T1 lowercase + scrolling) into EMIT/CR/TYPE", "description": "Design session 2026-09-14. Plan: ~/.claude/plans/hi-claude-let-s-talk-polished-crescent.md. Follow-up (80% rule). #554/#555 put the lowercase-aware scrolling console in lib/console.fs because the ROM-mode kernel has ~125 bytes free (KERN_END $2F83, APP_BASE $3000). Promote it into kernel EMIT (kernel.asm:514), CR (:560), TYPE (:1560) once headroom exists (move APP_BASE, or trim), with a VAR_LC flag defaulting to uppercase so existing demos are unchanged.", "type": "feature", "status": "open", "priority": "low", "file": "kernel/kernel.asm", "created": "2026-09-14", "updated": "2026-09-14"}, {"id": 562, "summary": "Terminal: key auto-repeat and rollover handling", "description": "Design session 2026-09-14. Plan: ~/.claude/plans/hi-claude-let-s-talk-polished-crescent.md. Follow-up (80% rule) for #24. The terminal polls key? (kernel.asm:923, no debounce) with edge detection because blocking KEY (kernel.asm:778) cannot coexist with Becker polling. Result: no auto-repeat, and a new key pressed while another is held can be missed (MATRIX2ASCII returns the first pressed key in scan order). Add VSYNC-timed repeat and better rollover, ideally a non-blocking debounced KEY variant.", "type": "feature", "status": "open", "priority": "low", "file": "src/terminal/terminal.fs", "created": "2026-09-14", "updated": "2026-09-14"}, {"id": 563, "summary": "fc.py: two S\" / .\" literals on one source line hang the tokenizer", "description": "Found 2026-09-14 while building src/terminal/console-test.fs (#554). tokenize() in tools/fc.py (string literal branch, ~lines 257-280) locates the literal with line.find(marker) but after consuming it only re-splits rest_of_line into tokens_on_line; it never advances `line`. A second S\" or .\" on the same line therefore finds the FIRST literal again, re-emits it, and loops forever (100% CPU, no output). Reproduce: a line like  S\" a\" con-type S\" b\" con-type . Fix: set line = rest_of_line before continue so subsequent find() calls search only the unconsumed text. Verify: hello.fs still builds byte-identically; a line with two literals compiles and both strings appear. Not addressed: strings containing ( ) or \\ are still mangled because comment stripping runs before literal extraction (separate, pre-existing). Closed 2026-09-14: user confirmed working in live XRoar sessions (coco2bus T1, Becker bridge, peek/poke drawing, recorded as the \"Darth Vaper\" video).", "type": "bug", "status": "done", "priority": "high", "file": "tools/fc.py", "created": "2026-09-14", "updated": "2026-09-14"}, {"id": 564, "summary": "Terminal: Claude can peek and poke CoCo memory over the Becker link", "description": "Requested 2026-09-14 from the CoCo terminal itself. Add an escape protocol to the Becker byte stream (bridge to CoCo: ESC 'P' addrH addrL n = read, ESC 'W' addrH addrL n data = write; CoCo replies ESC + n bytes, or a bare ESC ack) handled in src/terminal/terminal.fs, and expose it to Claude as MCP tools (peek, poke) via a stdio MCP server (tools/cocoterm_mcp.py) that talks to the bridge on a local control port (65505). Test: poke a pattern into RAM and peek it back through the live XRoar session. Closed 2026-09-14: user confirmed working in live XRoar sessions (coco2bus T1, Becker bridge, peek/poke drawing, recorded as the \"Darth Vaper\" video).", "type": "feature", "status": "done", "priority": "medium", "file": "src/terminal/terminal.fs", "created": "2026-09-14", "updated": "2026-09-14"}, {"id": 565, "summary": "Bridge: hide peek/poke tool notes from the CoCo screen", "description": "Requested 2026-09-14 from the CoCo terminal. tool_note lines (tools/cocoterm_bridge.py _pump) print '* mcp__coco__poke' for every memory tool call, which scrolls the screen and wrecks graphics drawn by poking VRAM. Skip notes for mcp__coco__* tools. Takes effect after the bridge restarts. Closed 2026-09-14: user confirmed working in live XRoar sessions (coco2bus T1, Becker bridge, peek/poke drawing, recorded as the \"Darth Vaper\" video).", "type": "bug", "status": "done", "priority": "medium", "file": "tools/cocoterm_bridge.py", "created": "2026-09-14", "updated": "2026-09-14"}, {"id": 566, "summary": "Vader vaping PSA: SG4 helmet and captions poked into live VRAM", "description": "Requested 2026-09-14 from the CoCo terminal. Draw a Darth Vader helmet in SG4 semigraphics on the text screen (rows 0-11) and show a series of anti-vaping captions (rows 12-15) by poking VRAM over the Becker link with mcp__coco__poke. Art and caption bytes come from src/vader/vader.py. Test: pokes land and the image and captions display on the live CoCo. Closed 2026-09-14: user confirmed working in live XRoar sessions (coco2bus T1, Becker bridge, peek/poke drawing, recorded as the \"Darth Vaper\" video).", "type": "feature", "status": "done", "priority": "low", "file": "src/vader/vader.py", "created": "2026-09-14", "updated": "2026-09-14"}, {"id": 567, "summary": "Docs: console.fs and becker.fs in reference.html and lib/README.md", "description": "Doc pass for the CoCo terminal work committed in b5158e6 (#24, #554-#557, #560, #563-#566). lib/console.fs and lib/becker.fs have no reference.html sections, and their per-word header lines do not match tools/gen-lib-readme.py DESC_RE (needs '\\ word -- desc' or '\\ word — desc'), so lib/README.md would list the words without descriptions. WORK: rewrite the per-word header lines in both files to the '\\ word -- desc' form (ASCII, no em dashes); add <!-- console.fs --> and <!-- becker.fs --> ref-section blocks to reference.html in the fujinet.fs style (h3, lib-path, prose, ref-table with word-name / stack-effect / description rows); regenerate lib/README.md with make lib-readme (which also refreshes build/lib-metrics.json). Verify: no missing-description warnings for the new words. 2026-09-14: per-word '\\ word -- desc' lines added to lib/console.fs and lib/becker.fs; Lowercase Console and Becker Port ref-sections added to reference.html after fujinet.fs; make lib-readme regenerated lib/README.md (both libs described, no missing-description warnings for them); site/reference.html rebuilt with tools/build-site.py (validation clean). Awaiting user review.\n\nClosed 2026-10-12. Per-word header lines in lib/console.fs and lib/becker.fs rewritten to the '\\ word -- desc' form; lib/README.md regenerated with descriptions; console.fs and becker.fs sections added to reference.html and site/reference.html.", "type": "docs", "status": "done", "priority": "medium", "file": "reference.html", "created": "2026-09-14", "updated": "2026-10-12"}, {"id": 568, "summary": "Docs: src/terminal/README.md (Claude Code terminal)", "description": "Doc pass for the CoCo terminal work committed in b5158e6 (#24, #554-#557, #560, #563-#566). Follow the src/typewriter/README.md layout: title, one-paragraph intro, screenshot, What It Demonstrates (T1 lowercase via $FF22 bit 4, Becker port $FF41/$FF42, key? edge detection, VSYNC-flag cursor blink, ESC peek/poke frames), Controls table, Running it (bridge first, then make run; -cart rsdos -cart-becker; why XRoar needs the server up first), bridge flags (--no-api-key, --permission-mode, --model, --cps, --nc, --selftest, memory tools), Protocol (dumb terminal, bridge owns the line; ESC P / ESC W frames), Known limits (#558, #559, #561, #562; T1 glyph quirks: _ draws as a left arrow, braces look like parens; plain 6847 machines show garbage for lowercase). Add screenshot.png from a live XRoar session. 2026-09-14: src/terminal/README.md written (architecture diagram, what it demonstrates, controls, running, bridge options, memory tools, known limits, console-test) with screenshot.png from a live session. Awaiting user review.\n\nClosed 2026-10-12. src/terminal/README.md written (97 lines) with screenshot.png. Note: #573 found the terminal actually runs SG6, not SG4; the README's graphics notes should be checked against #573 when that lands.", "type": "docs", "status": "done", "priority": "medium", "file": "src/terminal/README.md", "created": "2026-09-14", "updated": "2026-10-12"}, {"id": 569, "summary": "Docs: src/vader/README.md (Darth Vaper PSA)", "description": "Doc pass for the CoCo terminal work committed in b5158e6 (#24, #554-#557, #560, #563-#566). Short README for src/vader/vader.py: SG4 semigraphics helmet (64x24 SG4 pixels on rows 0-11, mirrored half art, red/buff/black) and centered T1 captions on rows 12-15; the script prints hex for $0400 image chunks and $0580 caption frames that Claude pokes into live VRAM through the terminal's peek/poke tools (#564). Explain how to run it and how it relates to the terminal. Screenshot if available. 2026-09-14: src/vader/README.md written with screenshot.png captured after poking vader.py output (helmet + first caption) through the live bridge. Awaiting user review.\n\nClosed 2026-10-12. src/vader/README.md written with screenshot.png. Caveat carried by #573: the art was packed as SG4 but the terminal renders SG6, so the screenshot and the 'SG4 example' framing are unverified until #573 resolves it.", "type": "docs", "status": "done", "priority": "low", "file": "src/vader/README.md", "created": "2026-09-14", "updated": "2026-10-12"}, {"id": 570, "summary": "Docs: tools/README.md sections for cocoterm_bridge.py and cocoterm_mcp.py", "description": "Doc pass for the CoCo terminal work committed in b5158e6 (#24, #554-#557, #560, #563-#566). tools/README.md documents fc.py and gen-lib-readme.py only. Add sections for cocoterm_bridge.py (architecture: XRoar Becker TCP client to bridge on 65504; line discipline; claude -p stream-json turns with --resume; Reflow sanitizer; paced writer; ANTHROPIC_API_KEY precedence and --no-api-key; error reporting from result text) and cocoterm_mcp.py (stdio MCP server, peek/poke via the bridge control port 65505 JSON lines, ESC frame protocol, 64-byte chunks, 1-1024 byte limits). Note the fc.py fix for two string literals on one line (#563) and the remaining limitation that ( ) and \\ inside strings are still eaten by comment stripping. 2026-09-14: tools/README.md index rows plus sections for cocoterm_bridge.py (connection, line discipline, turns, reflow, pacing, auth, --nc) and cocoterm_mcp.py (request path, ESC frames, limits), and an fc.py string-literal note (#563 fix, remaining ( ) \\ limitation). Awaiting user review.\n\nClosed 2026-10-12. tools/README.md gained sections for cocoterm_bridge.py and cocoterm_mcp.py.", "type": "docs", "status": "done", "priority": "medium", "file": "tools/README.md", "created": "2026-09-14", "updated": "2026-10-12"}, {"id": 571, "summary": "Docs: README.md release note and directory layout for the terminal", "description": "Doc pass for the CoCo terminal work committed in b5158e6 (#24, #554-#557, #560, #563-#566). README.md still headlines 'New in 1.2 - asynchronous sound' and its Directory Layout lists only fc.py under tools/ and hello under src/. Add a short release note for the Claude Code terminal (T1 lowercase console, Becker link, bridge, peek/poke tools), list lib/console.fs, lib/becker.fs, tools/cocoterm_*.py, src/terminal and src/vader in the layout. Version number and whether this is a tagged release are the user's call (KERN_VERSION in kernel.asm, README title, tag). Decision 2026-09-14: docs only, stay 1.2 (no KERN_VERSION bump, no tag). 2026-09-14: README.md gains an 'Also new: a CoCo terminal for Claude Code' note under the 1.2 headline and directory-layout entries for the new tools, libs and demos. Awaiting user review.\n\nClosed 2026-10-12. README.md has the terminal release note and the directory layout lists console.fs, becker.fs, cocoterm_*.py, src/terminal and src/vader. Version bump and tag were left as the user's call and not done.", "type": "docs", "status": "done", "priority": "medium", "file": "README.md", "created": "2026-09-14", "updated": "2026-10-12"}, {"id": 572, "summary": "Docs: vdg-modes.md CG3 SAM V column says 011, should be 100", "description": "coco-guides/vdg-modes.md:92 lists CG3 (128x96, 4 colors) with SAM V2:V1:V0 = 011, but the working code in src/vdg-modes/vdg-modes.fs:78 uses V=4 (100) with $C0 for $FF22. Confirmed on 2026-09-14 by the standalone ~/github/bunny demo (issue #1 there): 4 set-sam-v and $C8 set-pia (CSS=1) with the SAM offset pointed at vram-base gives a correct solid buff CG3 screen in XRoar. The whole SAM V column in that table looks shifted by one row relative to the standard SAM modes (CG1 001, RG1 001, CG2 010, RG2 011, CG3 100, RG3 101, CG6 110, RG6 110), so check every row, not only CG3.\n\nClosed 2026-10-12. coco-guides/vdg-modes.md full-graphics table: CG3 011->100, RG3 100->101, CG6 101->110 (CG1/RG1/CG2/RG2/RG6 were already right). Now matches src/vdg-modes/vdg-modes.fs mode table (CG3 4, RG3 5, CG6 6, RG6 6) and lib/rg-pixel.fs (6 for RG6).", "type": "docs", "status": "done", "priority": "low", "file": "coco-guides/vdg-modes.md", "created": "2026-09-14", "updated": "2026-10-12"}, {"id": 573, "summary": "Terminal is SG6 not SG4: fix the art packer and document the palette", "description": "Raised 2026-09-16 in a live CoCo terminal session, then re-scoped on 2026-09-17 when the premise turned out to be wrong.\n\nORIGINAL PREMISE (WRONG): that the terminal is in SG4 and needs a mode switch plus a toggle key to reach SG6.\n\nWHAT IS ACTUALLY TRUE: the terminal is ALREADY in SG6 and always has been. lib/console.fs lower-on sets $FF22 bit 4 to get MC6847T1 true lowercase. On the 6847 that same bit is INT*/EXT, which in alpha/semigraphics mode selects SG6 instead of SG4 for any byte with bit 7 set (coco-guides/vdg-modes.md:25 and :75, $FF22 bits 7-4 = 0XX1). Confirmed on the live machine: peek $FF22 returned $12, so A*/G=0, GM0=1, CSS=0.\n\nCONSEQUENCES:\n- No mode switch and no toggle key are needed. SG6 is free and coexists with the text console, exactly as SG4 does. Requirements 1, 2 and 4 of the original issue are moot.\n- tools/r2d2.py is WRONG. It packs SG4 bytes (bits 6-4 = a 3-bit colour, bits 3-0 = four 2x2 quadrants). Those bytes were poked to the live machine and rendered as SG6, so the picture on screen was not the picture in the source. Any earlier claim that SG4 art was drawn correctly on this terminal should be treated as unverified.\n- src/vader/ may have the same problem if it was ever viewed through the terminal rather than run as its own binary. Check before trusting it as an SG4 example.\n\nSG6 CELL FORMAT: byte = 1 C1 L5 L4 L3 L2 L1 L0. Six elements in a 2 wide x 3 tall grid, so the screen is 64x48 in the same 512 bytes. Only ONE colour bit per byte (C1, bit 6); the second colour bit is CSS ($FF22 bit 3), which is global. So a single screen has 2 colours plus black, not 8. Losing per-cell colour is the real cost of the extra vertical resolution.\n\nOPEN QUESTION: the exact SG6 palette is not documented in-tree. vdg-modes.md has colour set tables for full graphics and alpha but no SG6 section, and it says outright that SG4 ignores CSS (:158) without saying what SG6 does. A probe was poked to $050A on 2026-09-17 ($BF = C1 0, $FF = C1 1, four cells each) to read the two colours off the screen. Record the answer here and add an SG6 row to the Color Sets section of coco-guides/vdg-modes.md.\n\nREMAINING WORK:\n1. Fix tools/r2d2.py to emit SG6, or rename it to make the SG4 target explicit and add a separate SG6 packer. An SG6 packer takes a 64x48 grid and packs 2x3 blocks; with one colour bit per cell, art must be designed on 2x3 boundaries.\n2. Document the SG6 palette once the probe is read.\n3. Add a short note to CLAUDE.md under the terminal section: the terminal runs SG6, not SG4, because lowercase and INT*/EXT share $FF22 bit 4. This is the trap that caused the issue.\n\nRelated terminal display issues: #558 (cursor-addressing escapes), #559 (CoCo 3 40/80 column), #572 (vdg-modes.md has a wrong SAM V value for CG3, so verify that file against working code).\n\nPALETTE PROBE RESULT (2026-09-17, XRoar coco2bus, measured not assumed):\nFour cells of $BF (C1=0) beside four cells of $FF (C1=1), read off the screen by eye.\n  CSS=0 ($FF22 = $12):  C1=0 red, C1=1 orange\n  CSS=1 ($FF22 = $1A):  C1=0 red, C1=1 orange  (unchanged)\nSo SG6 here is 2 colours plus black, and CSS makes no difference to them. That contradicts the common claim that SG6 takes its second colour bit from CSS (which would give green/yellow vs blue/red). Either this build of XRoar ignores CSS in SG6, or the T1 part behaves differently from the plain 6847. NOT yet confirmed on real hardware: do that before writing it into coco-guides/vdg-modes.md as fact, and check the 6847/6847T1 pages of coco-guides/coco_technical_reference.pdf for the intended behaviour.\nPractical upshot for art: design for red, orange and black, and do not rely on CSS.\n\nRESOLVED 2026-10-12, AND THE PREMISE WAS BACKWARDS. The terminal IS in SG4.\nThe 2026-09-17 probe used solid blocks ($BF, $FF). Those are full red / full orange in SG4 as well as SG6, so it could not tell the modes apart, and 'CSS makes no difference' is just SG4 ignoring CSS.\nNew probe (standalone, writes $FF22 directly, nothing else touching it): top half of the screen $8C, bottom half $CC. In SG4, $8C/$CC light the top half of each cell in green/buff. In SG6, they light the middle third in a bit-6 colour.\n- coco2bus (MC6847T1) with $FF22 bit 4 set: green/buff top halves = SG4, identical to bit 4 clear. The T1 uses bit 4 for lowercase and has no SG6.\n- cocous (plain 6847) with bit 4 set: middle-third bands = SG6. Bit 6 = 0 blue, 1 red at CSS=0; magenta/orange at CSS=1. That matches the datasheet with C1 tied to data bit 7 (always 1 for a graphics cell).\nDONE: coco-guides/vdg-modes.md gained a Semigraphics-6 section (palette table, element layout, T1 note, how it was measured); the GM0 line and SG6 table row are corrected. CLAUDE.md's terminal section now says it really is SG4, and to probe with $8C, never solid blocks. tools/r2d2.py is correct (SG4) and its docstring says so. tools/sg6_*.py each carry a CORRECTION note: wrong for the terminal, and their red/orange palette is wrong even on a plain 6847.\nNOT DONE, filed as #578: confirm on real hardware; decide the fate of the sg6_*.py art.", "type": "feature", "status": "done", "priority": "high", "file": "tools/r2d2.py", "created": "2026-09-17", "updated": "2026-10-12"}, {"id": 574, "summary": "Tutorial ch13: LOADM instead of CLOADM, ROM-mode addresses, tutorials/ paths", "description": "Filed 2026-10-12 to cover edits already sitting uncommitted in tutorials/13-onto-your-coco/index.html. The chapter told readers to use CLOADM\"GUESS.BIN\" (cassette) and showed the old memory layout (kernel $1000, app $2000, exec ~$1225) and old getting-started/examples/ paths. Fixed: disk loading uses LOADM\"GUESS\":EXEC with CLOADM mentioned as the cassette path; the 'What CLOADM Does' section is now 'What the Loader Does'; the layout table shows ROM mode (kernel $2000, app $3000, exec $2981) and drops the stale cursor-init row; paths point at tutorials/12-the-guessing-game/examples/; a closing paragraph links the demo gallery (tutorials/demos/) and the DSK workflow guide (tutorials/dsk-workflow/), both of which exist. Not re-checked: the $2981 exec address against a fresh build of guess.bin.", "type": "docs", "status": "done", "priority": "medium", "file": "tutorials/13-onto-your-coco/index.html", "created": "2026-10-12", "updated": "2026-10-12"}, {"id": 575, "summary": "Tutorial audit: chapters 1-12 against the current kernel (remainder of #407)", "description": "Remainder of #407, which closed 2026-10-12 with only chapter 13 traceably audited (#574). The tutorial was written when the kernel was smaller; since then KCODE, CODE blocks, ~30 primitives, inline constants, the sound/beam/sprite libraries, ROM-mode memory layout (kernel $2000, app $3000) and the move from getting-started/ to tutorials/ have all landed.\n\nFIRST STEP (measurable): rebuild every chapter example against the current kernel and diff against the committed .bin. The examples are tutorials/01-meet-your-stack/examples/hello.fs, 02 title.fs, 03 letter.fs, 04 mirror.fs, 05 hi.fs, 06 alpha.fs, 07 grade.fs, 08 yorn.fs, 09 arith.fs, 10 calc.fs, 11 screen.fs, 12 guess.fs (each has a committed .bin beside it). Any example that fails to build, or whose .bin changes, marks a chapter to read closely. Chapter 00-about-forth has no example.\n\nTHEN per chapter: grep the prose for the stale patterns ch13 had (CLOADM where LOADM is meant, $1000/$2000 kernel/app addresses, getting-started/ paths, claims that a feature is unsupported when it now exists) and fix them; smooth transitions where newer material made the flow rough. Close at about 80% and file whatever chapter-level polish remains.\n\nPROGRESS 2026-10-12:\n- Build check: all 12 examples compile cleanly with fc.py against the current ROM-mode kernel (same invocation as make/demo.mk).\n- The committed .bin files were from the original tiny-kernel era: e.g. hello.bin was $0050+2, kernel $1000+209, app $2000+14, exec $10AD; guess.bin exec $1225. They ran on their own, but contradicted ch13's text (kernel $2000, app $3000, exec $2981, updated in #574). All 12 rebuilt: kernel $2000+3971, app at $3000, exec $2981. Sizes went from 245-1465 bytes to 4000-4816 bytes.\n- Run-tested in XRoar coco2bus: ch1 hello.bin shows HI; ch12 guess.bin boots to the GUESS MY NUMBER title and PRESS ANY KEY. Chapters 2-11 were built but not run.\n- Prose scan of ch0-12 for ch13's stale patterns (CLOADM, $1000/$2000/$1225, getting-started/ paths, 'not supported' claims): none found. Ch1's run.sh listing matches run.sh (it shows the older 'build kernel if map missing' check where run.sh now always calls make; harmless). HA
